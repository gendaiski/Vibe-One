<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F6F4ED"/><text id="Series label" x="64" y="72.55" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" fill="#314BFF"><tspan x="64" dy="0">FIELD NOTES   /   AI BUILDING</tspan></text><rect id="Connector" x="64" y="107" width="952" height="3" rx="0" fill="#D8D8D1"/><text id="Headline" x="64" y="234.7" font-family="Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.8" fill="#171923"><tspan x="64" dy="0">Novice vs. builder.</tspan></text><text id="Subheadline" x="64" y="412.2" font-family="Arial, sans-serif" font-size="32" font-weight="400" letter-spacing="0" fill="#171923"><tspan x="64" dy="0">Same tools. A more deliberate way to build.</tspan></text><rect id="Card" x="64" y="540" width="464" height="595" rx="28" fill="#FFFFFF"/><rect id="Card" x="552" y="540" width="464" height="595" rx="28" fill="#171923"/><text id="Copy" x="94" y="594.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#626777"><tspan x="94" dy="0">NOVICE</tspan></text><text id="Copy" x="582" y="594.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0" fill="#D6FF62"><tspan x="582" dy="0">BUILDER</tspan></text><text id="Copy" x="94" y="682.1" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" fill="#171923"><tspan x="94" dy="0">Asks for an outcome</tspan></text><text id="Copy" x="582" y="682.1" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" fill="#F6F4ED"><tspan x="582" dy="0">Defines the system</tspan></text><text id="Copy" x="94" y="773.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#171923"><tspan x="94" dy="0">One large prompt</tspan></text><text id="Copy" x="582" y="773.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#F6F4ED"><tspan x="582" dy="0">Builds in reviewable blocks</tspan></text><text id="Copy" x="94" y="864.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#171923"><tspan x="94" dy="0">Focuses on the page</tspan></text><text id="Copy" x="582" y="864.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#F6F4ED"><tspan x="582" dy="0">Connects the entire flow</tspan></text><text id="Copy" x="94" y="955.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#171923"><tspan x="94" dy="0">Reviews the appearance</tspan></text><text id="Copy" x="582" y="955.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#F6F4ED"><tspan x="582" dy="0">Tests behavior + states</tspan></text><text id="Copy" x="94" y="1046.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#171923"><tspan x="94" dy="0">Stops at “looks done”</tspan></text><text id="Copy" x="582" y="1046.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#F6F4ED"><tspan x="582" dy="0">Iterates with evidence</tspan></text><text id="Copy" x="64" y="1214.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="0" fill="#314BFF"><tspan x="64" dy="0">The upgrade is how you think.</tspan></text><text id="Footer" x="64" y="1297.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0" fill="#626777"><tspan x="64" dy="0">VIBE CODER → VIBE BUILDER</tspan></text><text id="Slide number" x="912" y="1291.55" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" fill="#314BFF"><tspan x="912" dy="0">09 / 09</tspan></text></svg>