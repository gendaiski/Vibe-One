<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350"><rect width="1080" height="1350" fill="#FFF9EF"/><text font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#08090D"><tspan x="64" y="59.2">VIBE CODER → VIBE BUILDER</tspan></text><rect x="64" y="105" width="100" height="19" rx="10" fill="#BAF600"/><text font-family="Arial,sans-serif" font-size="120" font-weight="700" fill="#08090D"><tspan x="64" y="257.0">Novice vs.</tspan><tspan x="64" y="379.4">Vibe Builder.</tspan></text><text font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#08090D"><tspan x="1000" y="1315.7">9</tspan></text><text font-family="Arial,sans-serif" font-size="52" font-weight="400" fill="#08090D"><tspan x="64" y="496.2">Same AI. Different mindset.</tspan></text><rect x="56" y="570" width="472" height="520" rx="36" fill="#F0F1FF"/><rect x="552" y="570" width="472" height="520" rx="36" fill="#EDFFC0"/><text font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#204BFF"><tspan x="88" y="645.7">NOVICE</tspan></text><text font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#08090D"><tspan x="584" y="645.7">BUILDER</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="88" y="738.05">One big request</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="584" y="738.05">Reviewable blocks</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="88" y="809.05">Describes the look</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="584" y="809.05">Defines the system</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="88" y="880.05">Builds isolated pages</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="584" y="880.05">Connects the journey</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="88" y="951.05">Checks appearance</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#08090D"><tspan x="584" y="951.05">Tests the full flow</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#08090D"><tspan x="88" y="1022.05">“Make me a website.”</tspan></text><text font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#08090D"><tspan x="584" y="1022.05">“Here’s how it works.”</tspan></text><rect x="64" y="1145" width="952" height="104" rx="50" fill="#D5FF69"/><text font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#08090D"><tspan x="112" y="1214.1">Build in blocks. Think in systems.</tspan></text><rect x="0" y="1270" width="1080" height="80" rx="0" fill="#FFF9EF"/><text font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#08090D"><tspan x="1000" y="1315.7">9</tspan></text></svg>