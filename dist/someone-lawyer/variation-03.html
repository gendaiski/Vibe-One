n\n        {/* Progress bar */}\n        \u003cdiv className=\"relative mt-4\">\n          \u003cdiv className=\"relative h-12 bg-[#e8e8e8] rounded-full overflow-hidden border border-[#ddd]\">\n            {/* Progress fill with gradient */}\n            \u003cmotion.div\n              className=\"absolute inset-y-0 left-0 rounded-full flex items-center justify-end pr-2\"\n              initial={{ width: \"0%\" }}\n              animate={{ width: `${Math.max(progress, 15)}%` }}\n              transition={{ duration: 1.5, ease: \"circOut\", delay: 0.5 }}\n              style={{\n                background:\n                  \"linear-gradient(90deg, #4a9c4a 0%, #5cb85c 50%, #7ed17e 100%)\",\n                boxShadow:\n                  \"0 0 15px rgba(92, 184, 92, 0.4), inset 0 2px 4px rgba(255,255,255,0.3)\",\n              }}\n            >\n              {/* Plane icon */}\n              \u003cmotion.div\n                className=\"relative flex items-center justify-center w-8 h-8 rounded-full\"\n                animate={{ y: [0, -2, 0] }}\n                transition={{\n                  duration: 2,\n                  repeat: Infinity,\n                  ease: \"easeInOut\",\n                }}\n                style={{\n                  background: \"rgba(255,255,255,0.3)\",\n                }}\n              >\n                \u003cPlaneIcon className=\"w-5 h-5 text-white transform rotate-45\" />\n              \u003c/motion.div>\n            \u003c/motion.div>\n          \u003c/div>\n\n          {/* Remaining time */}\n          \u003cmotion.div\n            initial={{ opacity: 0 }}\n            animate={{ opacity: 1 }}\n            transition={{ delay: 1.2 }}\n            className=\"absolute right-4 top-1/2 -translate-y-1/2 text-[#666] text-sm font-mono font-medium\"\n          >\n            {remainingTime}\n          \u003c/motion.div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/motion.div>\n  )\n}\n\nfunction HalftoneLightPattern({ className }: { className?: string }) {\n  return (\n    \u003csvg\n      className={cn(\"absolute inset-0 pointer-events-none\", className)}\n      width=\"100%\"\n      height=\"100%\"\n      xmlns=\"http://www.w3.org/2000/svg\"\n    >\n      \u003cdefs>\n        \u003cpattern\n          id=\"halftone-light\"\n          x=\"0\"\n          y=\"0\"\n          width=\"8\"\n          height=\"8\"\n          patternUnits=\"userSpaceOnUse\"\n        >\n          \u003ccircle cx=\"2\" cy=\"2\" r=\"1.2\" fill=\"rgba(45, 122, 45, 0.12)\" />\n        \u003c/pattern>\n        \u003clinearGradient\n          id=\"halftone-fade-light\"\n          x1=\"0%\"\n          y1=\"0%\"\n          x2=\"100%\"\n          y2=\"0%\"\n        >\n          \u003cstop offset=\"0%\" stopColor=\"white\" stopOpacity=\"1\" />\n          \u003cstop offset=\"50%\" stopColor=\"white\" stopOpacity=\"0.5\" />\n          \u003cstop offset=\"100%\" stopColor=\"white\" stopOpacity=\"0\" />\n        \u003c/linearGradient>\n        \u003cmask id=\"halftone-mask-light\">\n          \u003crect width=\"100%\" height=\"100%\" fill=\"url(#halftone-fade-light)\" />\n        \u003c/mask>\n      \u003c/defs>\n      \u003crect\n        width=\"100%\"\n        height=\"100%\"\n        fill=\"url(#halftone-light)\"\n        mask=\"url(#halftone-mask-light)\"\n      />\n    \u003c/svg>\n  )\n}\n\n// Adaptive component that switches based on theme\nfunction FlightStatusCardAdaptive(props: FlightStatusCardProps) {\n  return (\n    \u003c>\n      \u003cdiv className=\"hidden dark:block\">\n        \u003cFlightStatusCard {...props} />\n      \u003c/div>\n      \u003cdiv className=\"block dark:hidden\">\n        \u003cFlightStatusCardLight {...props} />\n      \u003c/div>\n    \u003c/>\n  )\n}\n\nexport {\n  FlightStatusCard,\n  FlightStatusCardLight,\n  FlightStatusCardAdaptive,\n  DotMatrixText,\n  DotMatrixChar,\n}\n","filename":"flight-status-card.tsx","install":"pnpm dlx shadcn@latest add @componentry/flight-status-card","posterData":"/assets/embedded/41c57b107a580b7f03860b87ed5b159ddf12cbff001620221404ad0806122d95.webp"},{"slug":"magnetic-dock","title":"Magnetic Dock","description":"MacOS style dock that scales items based on mouse proximity.","category":"Components","poster":"/preview-videos/component-animations/magneticdock.webp","video":"/preview-videos/component-animations/magneticdock.mp4","source":"\"use client\"\n\nimport * as React from \"react\"\nimport { motion, useMotionValue, useSpring, useTransform, AnimatePresence, useReducedMotion, type MotionValue } from \"framer-motion\"\nimport { cn } from \"@/lib/utils\"\n\ninterface MagneticDockProps {\n    /** Array of dock items */\n    items: DockItemData[]\n    /** Size of icons in pixels */\n    iconSize?: number\n    /** Maximum scale on hover */\n    maxScale?: number\n    /** Distance of magnetic effect in pixels */\n    magneticDistance?: number\n    /** Show labels on hover */\n    showLabels?: boolean\n    /** Dock position */\n    position?: \"bottom\" | \"top\" | \"left\" | \"right\"\n    /** Background style */\n    variant?: \"glass\" | \"solid\" | \"transparent\"\n    /** Custom class name */\n    className?: string\n}\n\ninterface DockItemData {\n    /** Unique identifier */\n    id: string\n    /** Display label */\n    label: string\n    /** Icon component or image URL */\n    icon: React.ReactNode\n    /** Click handler */\n    onClick?: () => void\n    /** Whether item is active */\n    isActive?: boolean\n    /** Badge count */\n    badge?: number\n}\n\ninterface DockItemProps {\n    item: DockItemData\n    mouseX: MotionValue\u003cnumber>\n    iconSize: number\n    maxScale: number\n    magneticDistance: number\n    showLabels: boolean\n    isVertical: boolean\n    reducedMotion: boolean\n}\n\nfunction DockItem({\n    item,\n    mouseX,\n    iconSize,\n    maxScale,\n    magneticDistance,\n    showLabels,\n    isVertical,\n    reducedMotion,\n}: DockItemProps) {\n    const ref = React.useRef\u003cHTMLButtonElement>(null)\n    const [isHovered, setIsHovered] = React.useState(false)\n    const [isFocused, setIsFocused] = React.useState(false)\n    const showLabel = showLabels && (isHovered || isFocused)\n\n    // Calculate distance from mouse to center of item\n    const distance = useTransform(mouseX, (val: number) => {\n        if (!ref.current) return magneticDistance + 1\n        const rect = ref.current.getBoundingClientRect()\n        const center = isVertical\n            ? rect.top + rect.height / 2\n            : rect.left + rect.width / 2\n        return val - center\n    })\n\n    // Scale based on distance - closer = larger\n    const scale = useTransform(distance, [-magneticDistance, 0, magneticDistance], [1, maxScale, 1])\n\n    // Apply spring physics for smooth animation\n    const springConfig = { damping: 20, stiffness: 300, mass: 0.5 }\n    const smoothScale = useSpring(scale, springConfig)\n\n    // Calculate the size based on scale\n    const size = useTransform(smoothScale, (s) => s * iconSize)\n\n    // Floating effect\n    const y = useTransform(smoothScale, (s) => (s - 1) * -10)\n    const smoothY = useSpring(y, springConfig)\n\n    return (\n        \u003cmotion.button\n            ref={ref}\n            type=\"button\"\n            tabIndex={0}\n            aria-label={item.label}\n            aria-current={item.isActive ? \"page\" : undefined}\n            onClick={item.onClick}\n            onFocus={() => setIsFocused(true)}\n            onBlur={() => setIsFocused(false)}\n            onMouseEnter={() => setIsHovered(true)}\n            onMouseLeave={() => setIsHovered(false)}\n            className={cn(\n                \"relative flex items-center justify-center\",\n                \"rounded-2xl transition-colors duration-200\",\n                \"focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400 dark:focus-visible:ring-white/50\",\n                item.isActive && \"bg-neutral-200/50 dark:bg-white/10\"\n            )}\n            style={{\n                width: reducedMotion ? iconSize : size,\n                height: reducedMotion ? iconSize : size,\n                y: reducedMotion || isVertical ? 0 : smoothY,\n                x: reducedMotion || !isVertical ? 0 : smoothY,\n            }}\n            whileTap={reducedMotion ? undefined : { scale: 0.9 }}\n        >\n            {/* Icon Container */}\n            \u003cmotion.div\n                className={cn(\n                    \"relative w-full h-full rounded-2xl overflow-hidden\",\n                    \"bg-gradient-to-b from-neutral-100 to-neutral-50\",\n                    \"dark:from-neutral-800 dark:to-neutral-900\",\n                    \"backdrop-blur-sm\",\n                    \"border border-neutral-300 dark:border-neutral-700\",\n                    \"shadow-lg shadow-black/10 dark:shadow-black/30\",\n                    \"flex items-center justify-center\",\n                    \"transition-colors duration-200\"\n                )}\n                style={{\n                    boxShadow: isHovered\n                        ? \"0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.5)\"\n                        : \"0 4px 12px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.3)\",\n                }}\n            >\n                {/* Icon */}\n                \u003cdiv aria-hidden=\"true\" className=\"w-[60%] h-[60%] flex items-center justify-center text-neutral-700 dark:text-white\">\n                    {item.icon}\n                \u003c/div>\n\n                {/* Shine effect */}\n                \u003cmotion.div\n                    className=\"absolute inset-0 pointer-events-none\"\n                    style={{\n                        background:\n                            \"linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 50%, transparent 100%)\",\n                        opacity: isHovered ? 0.9 : 0.5,\n                    }}\n                />\n            \u003c/motion.div>\n\n            {/* Badge */}\n            \u003cAnimatePresence initial={false}>\n                {item.badge !== undefined && item.badge > 0 && (\n                    \u003cmotion.div\n                        initial={reducedMotion ? false : { scale: 0, opacity: 0 }}\n                        animate={{ scale: 1, opacity: 1 }}\n                        exit={reducedMotion ? { opacity: 0 } : { scale: 0, opacity: 0 }}\n                        className={cn(\n                            \"absolute -top-1 -right-1\",\n                            \"min-w-[20px] h-5 px-1.5\",\n                            \"rounded-full\",\n                            \"bg-red-500\",\n                            \"text-white text-xs font-semibold\",\n                            \"flex items-center justify-center\",\n                            \"border-2 border-white dark:border-neutral-950\",\n                            \"shadow-lg\"\n                        )}\n                    >\n                        {item.badge > 99 ? \"99+\" : item.badge}\n                    \u003c/motion.div>\n                )}\n            \u003c/AnimatePresence>\n\n            {/* Active Indicator */}\n            \u003cAnimatePresence initial={false}>\n                {item.isActive && (\n                    \u003cmotion.div\n                        initial={reducedMotion ? false : { scale: 0, opacity: 0 }}\n                        animate={{ scale: 1, opacity: 1 }}\n                        exit={reducedMotion ? { opacity: 0 } : { scale: 0, opacity: 0 }}\n                        className={cn(\n                            \"absolute -bottom-2\",\n                            \"w-1.5 h-1.5 rounded-full\",\n                            \"bg-neutral-600 dark:bg-white/80\"\n                        )}\n                    />\n                )}\n            \u003c/AnimatePresence>\n\n            {/* Tooltip */}\n            \u003cAnimatePresence initial={false}>\n                {showLabel && (\n                    \u003cmotion.div\n                        aria-hidden=\"true\"\n                        initial={reducedMotion ? false : { opacity: 0, y: 8, scale: 0.9 }}\n                        animate={{ opacity: 1, y: 0, scale: 1 }}\n                        exit={reducedMotion ? { opacity: 0 } : { opacity: 0, y: 8, scale: 0.9 }}\n                        transition={{ duration: 0.15, ease: \"easeOut\" }}\n                        className={cn(\n                            \"absolute -top-10 left-1/2 -translate-x-1/2\",\n                            \"px-3 py-1.5 rounded-lg\",\n                            \"bg-white dark:bg-neutral-900/95\",\n                            \"backdrop-blur-sm\",\n                            \"text-neutral-800 dark:text-white text-sm font-medium whitespace-nowrap\",\n                            \"border border-neutral-200 dark:border-white/10\",\n                            \"shadow-xl shadow-black/10 dark:shadow-black/20\",\n                            \"pointer-events-none z-50\"\n                        )}\n                    >\n                        {item.label}\n                        {/* Tooltip arrow */}\n                        \u003cdiv\n                            className={cn(\n                                \"absolute left-1/2 -translate-x-1/2 -bottom-1\",\n                                \"w-2 h-2 rotate-45\",\n                                \"bg-white dark:bg-neutral-900/95\",\n                                \"border-r border-b border-neutral-200 dark:border-white/10\"\n                            )}\n                        />\n                    \u003c/motion.div>\n                )}\n            \u003c/AnimatePresence>\n\n            {/* Hover glow */}\n            \u003cmotion.div\n                className=\"absolute inset-0 rounded-2xl pointer-events-none\"\n                animate={{\n                    boxShadow: isHovered\n                        ? \"0 0 30px rgba(255,255,255,0.15)\"\n                        : \"0 0 0px rgba(255,255,255,0)\",\n                }}\n                transition={{ duration: 0.3 }}\n            />\n        \u003c/motion.button>\n    )\n}\n\nfunction MagneticDock({\n    items,\n    iconSize = 56,\n    maxScale = 1.5,\n    magneticDistance = 150,\n    showLabels = true,\n    position = \"bottom\",\n    variant = \"glass\",\n    className,\n}: MagneticDockProps) {\n    const mousePosition = useMotionValue(Infinity)\n    const reducedMotion = useReducedMotion() ?? false\n    const isVertical = position === \"left\" || position === \"right\"\n\n    const handleMouseMove = React.useCallback(\n        (e: React.MouseEvent) => {\n            if (isVertical) {\n                mousePosition.set(e.clientY)\n            } else {\n                mousePosition.set(e.clientX)\n            }\n        },\n        [mousePosition, isVertical]\n    )\n\n    const handleMouseLeave = () => {\n        mousePosition.set(Infinity)\n    }\n\n    const variantStyles = {\n        glass: cn(\n            \"bg-white/80 dark:bg-neutral-900/80\",\n            \"backdrop-blur-xl backdrop-saturate-150\",\n            \"border border-neutral-200 dark:border-neutral-700\"\n        ),\n        solid: cn(\n            \"bg-neutral-100 dark:bg-neutral-900\",\n            \"border border-neutral-300 dark:border-neutral-700\"\n        ),\n        transparent: \"bg-transparent border-0\",\n    }\n\n    const positionStyles = {\n        bottom: \"flex-row\",\n        top: \"flex-row\",\n        left: \"flex-col\",\n        right: \"flex-col\",\n    }\n\n    return (\n        \u003cmotion.div\n            onMouseMove={reducedMotion ? undefined : handleMouseMove}\n            onMouseLeave={handleMouseLeave}\n            className={cn(\n                \"inline-flex items-end gap-2 p-3 rounded-3xl\",\n                variantStyles[variant],\n                positionStyles[position],\n                \"shadow-xl shadow-black/10 dark:shadow-black/30\",\n                className\n            )}\n            initial={false}\n            animate={{ opacity: 1, y: 0 }}\n            transition={{ duration: 0.5, ease: [0.25, 0.46, 0.45, 0.94] }}\n        >\n            {items.map((item) => (\n                \u003cDockItem\n                    key={item.id}\n                    item={item}\n                    mouseX={mousePosition}\n                    iconSize={iconSize}\n                    maxScale={maxScale}\n                    magneticDistance={magneticDistance}\n                    showLabels={showLabels}\n                    isVertical={isVertical}\n                    reducedMotion={reducedMotion}\n                />\n            ))}\n        \u003c/motion.div>\n    )\n}\n\n// Preset icons for common use cases\nfunction DockIconHome({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003cpath d=\"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\" />\n            \u003cpolyline points=\"9 22 9 12 15 12 15 22\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconSearch({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003ccircle cx=\"11\" cy=\"11\" r=\"8\" />\n            \u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconFolder({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003cpath d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconMail({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003cpath d=\"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z\" />\n            \u003cpolyline points=\"22,6 12,13 2,6\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconMusic({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003cpath d=\"M9 18V5l12-2v13\" />\n            \u003ccircle cx=\"6\" cy=\"18\" r=\"3\" />\n            \u003ccircle cx=\"18\" cy=\"16\" r=\"3\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconSettings({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003ccircle cx=\"12\" cy=\"12\" r=\"3\" />\n            \u003cpath d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z\" />\n        \u003c/svg>\n    )\n}\n\nfunction DockIconTrash({ className }: { className?: string }) {\n    return (\n        \u003csvg\n            viewBox=\"0 0 24 24\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n            strokeLinecap=\"round\"\n            strokeLinejoin=\"round\"\n            className={cn(\"w-full h-full\", className)}\n        >\n            \u003cpolyline points=\"3 6 5 6 21 6\" />\n            \u003cpath d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\" />\n        \u003c/svg>\n    )\n}\n\nexport {\n    MagneticDock,\n    DockIconHome,\n    DockIconSearch,\n    DockIconFolder,\n    DockIconMail,\n    DockIconMusic,\n    DockIconSettings,\n    DockIconTrash,\n    type MagneticDockProps,\n    type DockItemData,\n}\n","filename":"magnetic-dock.tsx","install":"pnpm dlx shadcn@latest add @componentry/magnetic-dock","posterData":"/assets/embedded/c5017f958c0d11d8ab55eae9a15893a1fecb29748aa9616e95f6464510d2b83c.webp"},{"slug":"collection-surfer","title":"Collection Surfer","description":"Smooth surfing interaction for browsing collections.","category":"Components","poster":"/preview-videos/component-animations/collectionsurfer.webp","video":"/preview-videos/component-animations/collectionsurfer.mp4","source":"\"use client\";\n\nimport { motion, useScroll, useTransform, useSpring, useMotionValue, MotionValue } from \"framer-motion\";\nimport React from \"react\";\n\nexport interface CollectionItem {\n    id: number;\n    image: string;\n    title: string;\n}\n\nexport type CollectionSurferVariant = \"magnetic\" | \"uplift\" | \"simple\";\n\ninterface CollectionSurferProps {\n    items: CollectionItem[];\n    variant?: CollectionSurferVariant;\n}\n\nexport function CollectionSurfer({ items, variant = \"magnetic\" }: CollectionSurferProps) {\n    // 1. Loop Setup: Duplicate items to create a buffer\n    // We render the list twice: [Original Set, Duplicate Set]\n    // When we scroll past the Original Set, we snap back to the start.\n    const duplicatedItems = [...items, ...items];\n\n    // Scroll sensitivity\n    const scrollPerItem = 600;\n\n    // The exact scroll distance to complete one full loop of the ORIGINAL items\n    const loopDistance = items.length * scrollPerItem;\n\n    const { scrollY } = useScroll();\n\n    const smoothScroll = useSpring(scrollY, {\n        mass: 0.1,\n        stiffness: 100,\n        damping: 20\n    });\n\n    // 2. Modulo Logic:\n    // Instead of mapping 0 -> totalScroll, we map to a looped value.\n    // loops 0 -> loopDistance -> 0 -> loopDistance...\n    const loopedProgress = useTransform(smoothScroll, (value) => value % loopDistance);\n\n    // Step vector\n    const stepX = 240;\n    const stepY = -84;\n    const stepZ = -288;\n\n    // We only move the scene backwards by the length of ONE set of items\n    const x = useTransform(loopedProgress, [0, loopDistance], [0, -items.length * stepX]);\n    const y = useTransform(loopedProgress, [0, loopDistance], [0, -items.length * stepY]);\n    const z = useTransform(loopedProgress, [0, loopDistance], [0, -items.length * stepZ]);\n\n    // Mouse position for magnetic effect\n    // Initialize off-screen so no card is scaled by default\n    const mouseX = useMotionValue(-10000);\n    const mouseY = useMotionValue(-10000);\n\n    const handleMouseMove = (e: React.MouseEvent) => {\n        if (variant === \"simple\") return;\n        mouseX.set(e.clientX);\n        mouseY.set(e.clientY);\n    };\n\n    const handleMouseLeave = () => {\n        if (variant === \"simple\") return;\n        mouseX.set(-10000);\n        mouseY.set(-10000);\n    };\n\n    return (\n        \u003cdiv className=\"relative bg-black min-h-screen text-white w-full\">\n            {/* 3. Infinite Spacer: \n                We make this huge so the user can scroll for a very long time.\n                (e.g., 50,000px) */}\n            \u003cdiv style={{ height: \"50000px\" }} className=\"w-full\" />\n\n            {/* Fixed viewport */}\n            \u003cdiv\n                className=\"fixed inset-0 w-full h-screen overflow-hidden flex items-center justify-center perspective-container\"\n                onMouseMove={handleMouseMove}\n                onMouseLeave={handleMouseLeave}\n            >\n\n                {/* UI Overlays */}\n                \u003cdiv className=\"absolute top-[3vw] left-[3vw] z-50 pointer-events-none mix-blend-difference\">\n                    \u003ch1 className=\"font-heading font-bold text-[clamp(2rem,6vw,5rem)] leading-[0.9] tracking-tighter ml-[4vw]\">\n                        HERITAGE FW25/26\n                    \u003c/h1>\n                    \u003ch1 className=\"font-heading font-bold text-[clamp(2rem,6vw,5rem)] leading-[0.9] tracking-tighter\">\n                        COLLECTION\n                        \u003cspan className=\"text-[0.4em] align-top relative top-[0.6em] ml-2 font-mono tabular-nums\">\n                            ({items.length})\n                        \u003c/span>\n                    \u003c/h1>\n                \u003c/div>\n\n                \u003cdiv className=\"absolute bottom-[3vw] right-[3vw] z-50 font-mono text-xs tracking-wider uppercase opacity-70\">\n                    scroll to surf\n                \u003c/div>\n\n                {/* 3D Scene */}\n                \u003cdiv\n                    className=\"absolute inset-0 flex items-center justify-center\"\n                    style={{\n                        perspective: \"2000px\",\n                        perspectiveOrigin: \"10% 10%\",\n                    }}\n                >\n                    {/* Animated Track */}\n                    \u003cmotion.div\n                        className=\"relative w-0 h-0\"\n                        style={{\n                            x,\n                            y,\n                            z,\n                            transformStyle: \"preserve-3d\",\n                        }}\n                    >\n                        {duplicatedItems.map((item, i) => (\n                            \u003cCard\n                                // We need a unique key because IDs repeat in the duplicated array\n                                key={`${item.id}-${i}`}\n                                item={item}\n                                i={i}\n                                stepX={stepX}\n                                stepY={stepY}\n                                stepZ={stepZ}\n                                mouseX={mouseX}\n                                mouseY={mouseY}\n                                scrollSpring={smoothScroll}\n                                variant={variant}\n                            />\n                        ))}\n                    \u003c/motion.div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n    );\n}\n\nfunction Card({\n    item,\n    i,\n    stepX,\n    stepY,\n    stepZ,\n    mouseX,\n    mouseY,\n    scrollSpring,\n    variant\n}: {\n    item: CollectionItem,\n    i: number,\n    stepX: number,\n    stepY: number,\n    stepZ: number,\n    mouseX: MotionValue\u003cnumber>,\n    mouseY: MotionValue\u003cnumber>,\n    scrollSpring: MotionValue\u003cnumber>,\n    variant: CollectionSurferVariant\n}) {\n    const ref = React.useRef\u003cHTMLDivElement>(null);\n\n    // Calculate distance from mouse to center of card\n    const distance = useTransform([mouseX, mouseY, scrollSpring], ([x = 0, y = 0]: number[]) => {\n        if (!ref.current || variant === \"simple\") return 200; // Default large distance\n        const rect = ref.current.getBoundingClientRect();\n        const centerX = rect.left + rect.width / 2;\n        const centerY = rect.top + rect.height / 2;\n        const dist = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));\n        return dist;\n    });\n\n    // --- Magnetic Variant ---\n    // Map distance to scale: Closer = larger\n    const targetScale = useTransform(distance, [0, 400], [1.5, 1]);\n    const springScale = useSpring(targetScale, {\n        mass: 0.5,\n        stiffness: 300,\n        damping: 20\n    });\n\n    // --- Uplift Variant ---\n    // Map distance to Y uplift: Closer = move up (negative Y)\n    // We want it to move UP relative to the card's local space or world space? \n    // Moving up in Y (negative) usually works.\n    const targetUplift = useTransform(distance, [0, 400], [-100, 0]);\n    const springUplift = useSpring(targetUplift, {\n        mass: 0.5,\n        stiffness: 300,\n        damping: 20\n    });\n\n    // Combine transforms based on variant\n    const transform = useTransform(\n        [springScale, springUplift],\n        ([s, u]: number[]) => {\n            let scaleValue = 1;\n            let upliftValue = 0;\n\n            if (variant === \"magnetic\") {\n                scaleValue = Number(s);\n            } else if (variant === \"uplift\") {\n                upliftValue = Number(u);\n            }\n            // simple variant: scale=1, uplift=0\n\n            // Base position\n            const baseX = i * stepX;\n            const baseY = i * stepY;\n            const baseZ = i * stepZ;\n\n            return `translate3d(${baseX}px, ${baseY + upliftValue}px, ${baseZ}px) rotateY(-50deg) scale(${scaleValue})`;\n        }\n    );\n\n    return (\n        \u003cmotion.div\n            ref={ref}\n            className=\"absolute w-[300px] h-[400px] bg-neutral-900 overflow-hidden shadow-2xl transition-colors duration-500 ease-out group\"\n            style={{\n                transform,\n                transformStyle: \"preserve-3d\",\n            }}\n        >\n            {/* Index number: Using i % 16 + 1 so the duplicate cards show correct numbers (01-16) */}\n            \u003cdiv className=\"absolute -top-6 -left-4 text-white font-mono text-xs opacity-50 transition-opacity group-hover:opacity-100\">\n                {String((i % 16) + 1).padStart(2, '0')}\n            \u003c/div>\n\n            {/* Image */}\n            \u003cdiv className=\"relative w-full h-full brightness-75 group-hover:brightness-100 transition-all duration-300\">\n                \u003cimg\n                    src={item.image}\n                    alt={item.title}\n                    className=\"w-full h-full object-cover\"\n                />\n            \u003c/div>\n\n            \u003cdiv className=\"absolute inset-0 bg-gradient-to-tr from-black/20 to-transparent pointer-events-none\" />\n        \u003c/motion.div>\n    );\n}","filename":"collection-surfer.tsx","install":"pnpm dlx shadcn@latest add @componentry/collection-surfer","posterData":"/assets/embedded/debf1734db42a86abad283dc68b6a862b11d6c29d4cb6034b2607e541bf100ef.webp"},{"slug":"fisheye-infinite-grid","title":"Fisheye Infinite Grid","description":"A dense draggable image wall warped as one continuous fisheye surface with weighted momentum.","category":"Components","poster":"/preview-videos/component-animations/fisheyeinfinitegrid.webp","video":"/preview-videos/component-animations/fisheyeinfinitegrid.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport {\n  type CSSProperties,\n  type HTMLAttributes,\n  useEffect,\n  useRef,\n  useState,\n} from \"react\";\n\nexport interface FisheyeGridItem {\n  /** Image displayed inside the tile. */\n  image: string;\n  /** Accessible description for the image. */\n  alt: string;\n  /** Primary tile label. */\n  title?: string;\n  /** Secondary tile label, such as a year or category. */\n  meta?: string;\n}\n\nexport interface FisheyeInfiniteGridProps extends Omit\u003c\n  HTMLAttributes\u003cHTMLDivElement>,\n  \"children\"\n> {\n  /** Items repeated across the infinite field. */\n  items?: FisheyeGridItem[];\n  /** Width of each tile in CSS pixels. */\n  tileWidth?: number;\n  /** Height of each tile in CSS pixels. */\n  tileHeight?: number;\n  /** Space between tiles in CSS pixels. */\n  gap?: number;\n  /** Strength of the lens warp. Set to 0 for a flat grid. */\n  lensStrength?: number;\n  /** Visual treatment for the grid surface and tile chrome. */\n  theme?: \"dark\" | \"light\" | \"system\";\n  /** Distance of the subtle ambient hover drift in CSS pixels. */\n  hoverNudge?: number;\n  /** Momentum retained after releasing a drag, from 0 to 1. */\n  inertia?: number;\n  /** Amount of movement produced by trackpad or mouse-wheel input. */\n  wheelSensitivity?: number;\n  /** Additional classes applied to the root container. */\n  className?: string;\n}\n\nexport const FISHEYE_GRID_ITEMS: FisheyeGridItem[] = [\n  {\n    image:\n      \"https://images.unsplash.com/photo-1514906689926-25ba6dcb584b?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Soft motion-blurred portrait in pale light\",\n    title: \"Silver Veil\",\n    meta: \"01\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1527630941-4a229fd674ab?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Seated figure softened by vertical motion blur\",\n    title: \"Quiet Frame\",\n    meta: \"02\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1568557412756-7d219873dd11?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Figures moving through saturated orange light\",\n    title: \"Ember Transit\",\n    meta: \"03\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1581892805885-73bdd91beff0?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Monochrome portrait obscured by a moving hand\",\n    title: \"Soft Gesture\",\n    meta: \"04\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1603786420263-ad59136a7409?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Face stretched into warm horizontal motion\",\n    title: \"Amber Echo\",\n    meta: \"05\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1610846202780-b4d9837371ea?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Lone figure passing through a muted green field\",\n    title: \"Moss Passage\",\n    meta: \"06\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1612592046138-1514dc06a1cd?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Figure dissolving into cyan camera movement\",\n    title: \"Cyan Current\",\n    meta: \"07\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1617281822114-9541b921a880?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Dancers trailing across a dark stage\",\n    title: \"Phantom Chorus\",\n    meta: \"08\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1619122656350-bde66c98e6a4?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Soft figure receding into a warm cream background\",\n    title: \"Ivory Fade\",\n    meta: \"09\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1624344965194-6aa6729ad832?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Editorial portrait doubled in red and cyan light\",\n    title: \"Ionic Profile\",\n    meta: \"10\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1633382148761-d56d55cee3cd?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Monochrome portrait with hair caught in motion\",\n    title: \"Carbon Study\",\n    meta: \"11\",\n  },\n  {\n    image:\n      \"https://images.unsplash.com/photo-1542320868-497d7aeaaa13?w=900&q=85&auto=format&fit=crop\",\n    alt: \"Pale flowers swept across a black background\",\n    title: \"Petal Trace\",\n    meta: \"12\",\n  },\n];\n\nconst clamp = (value: number, min: number, max: number) =>\n  Math.min(max, Math.max(min, value));\n\nconst VERTEX_SHADER = `\n  attribute vec2 a_position;\n  varying vec2 v_uv;\n\n  void main() {\n    v_uv = a_position * 0.5 + 0.5;\n    gl_Position = vec4(a_position, 0.0, 1.0);\n  }\n`;\n\nconst FRAGMENT_SHADER = `\n  precision highp float;\n\n  uniform sampler2D u_texture;\n  uniform vec2 u_resolution;\n  uniform vec2 u_atlas_size;\n  uniform vec2 u_offset;\n  uniform float u_curvature;\n  varying vec2 v_uv;\n\n  void main() {\n    vec2 centered = v_uv * 2.0 - 1.0;\n    float aspect = u_resolution.x / max(u_resolution.y, 1.0);\n    vec2 lens = vec2(centered.x * aspect, centered.y);\n    float radius = dot(lens, lens) / (aspect * aspect + 1.0);\n    float curve = u_curvature * (0.34 * radius + 0.12 * radius * radius);\n    vec2 warped = lens / (1.0 + curve);\n    vec2 warped_uv = vec2(warped.x / aspect, warped.y) * 0.5 + 0.5;\n    vec2 world = vec2(\n      warped_uv.x * u_resolution.x - u_offset.x,\n      (1.0 - warped_uv.y) * u_resolution.y - u_offset.y\n    );\n    vec2 atlas_uv = fract(world / u_atlas_size);\n    vec4 color = texture2D(u_texture, vec2(atlas_uv.x, 1.0 - atlas_uv.y));\n    float edgeShade = clamp(radius * u_curvature * 0.12, 0.0, 0.24);\n    color.rgb *= 1.0 - edgeShade;\n    gl_FragColor = color;\n  }\n`;\n\nfunction createShader(gl: WebGLRenderingContext, type: number, source: string) {\n  const shader = gl.createShader(type);\n  if (!shader) return null;\n  gl.shaderSource(shader, source);\n  gl.compileShader(shader);\n  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {\n    gl.deleteShader(shader);\n    return null;\n  }\n  return shader;\n}\n\nfunction createProgram(gl: WebGLRenderingContext) {\n  const vertex = createShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER);\n  const fragment = createShader(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER);\n  if (!vertex || !fragment) return null;\n\n  const program = gl.createProgram();\n  if (!program) return null;\n  gl.attachShader(program, vertex);\n  gl.attachShader(program, fragment);\n  gl.linkProgram(program);\n  gl.deleteShader(vertex);\n  gl.deleteShader(fragment);\n\n  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n    gl.deleteProgram(program);\n    return null;\n  }\n  return program;\n}\n\nfunction drawCoverImage(\n  context: CanvasRenderingContext2D,\n  image: HTMLImageElement,\n  x: number,\n  y: number,\n  width: number,\n  height: number,\n) {\n  const scale = Math.max(\n    width / image.naturalWidth,\n    height / image.naturalHeight,\n  );\n  const sourceWidth = width / scale;\n  const sourceHeight = height / scale;\n  const sourceX = (image.naturalWidth - sourceWidth) / 2;\n  const sourceY = (image.naturalHeight - sourceHeight) / 2;\n  context.drawImage(\n    image,\n    sourceX,\n    sourceY,\n    sourceWidth,\n    sourceHeight,\n    x,\n    y,\n    width,\n    height,\n  );\n}\n\nexport function FisheyeInfiniteGrid({\n  items = FISHEYE_GRID_ITEMS,\n  tileWidth = 238,\n  tileHeight = 272,\n  gap = 0,\n  lensStrength = 0.24,\n  theme = \"system\",\n  hoverNudge = 16,\n  inertia = 0.94,\n  wheelSensitivity = 0.42,\n  className,\n  style,\n  \"aria-label\": ariaLabel = \"Infinite draggable image grid\",\n  ...rest\n}: FisheyeInfiniteGridProps) {\n  const rootRef = useRef\u003cHTMLDivElement>(null);\n  const canvasRef = useRef\u003cHTMLCanvasElement>(null);\n  const positionRef = useRef({ x: 0, y: 0 });\n  const velocityRef = useRef({ x: 0, y: 0 });\n  const dragRef = useRef({\n    active: false,\n    pointerId: -1,\n    x: 0,\n    y: 0,\n    time: 0,\n  });\n  const nudgeRef = useRef\u003c{\n    startedAt: number;\n    x: number;\n    y: number;\n  } | null>(null);\n  const reducedMotionRef = useRef(false);\n  const [resolvedTheme, setResolvedTheme] = useState\u003c\"dark\" | \"light\">(\n    them "FIRST_QUARTILE\":\n            return s.level1\n        case \"SECOND_QUARTILE\":\n            return s.level2\n        case \"THIRD_QUARTILE\":\n            return s.level3\n        case \"FOURTH_QUARTILE\":\n            return s.level4\n        case \"NONE\":\n        default:\n            return s.level0\n    }\n}\n\nfunction getShapeClass(shape: string) {\n    switch (shape) {\n        case \"circle\":\n            return \"rounded-full\"\n        case \"square\":\n            return \"rounded-none\"\n        case \"squircle\":\n            return \"rounded-sm\" // Approximation\n        case \"rounded\":\n        default:\n            return \"rounded-[2px]\"\n    }\n}\n\nexport function GithubCalendar({\n    username,\n    variant = \"default\",\n    shape = \"rounded\",\n    glowIntensity = 5,\n    className,\n    showTotal = true,\n    colorSchema = \"green\",\n}: GithubCalendarProps) {\n    const [data, setData] = React.useState\u003cGithubContributionData | null>(null)\n    const [loading, setLoading] = React.useState(true)\n    const [error, setError] = React.useState\u003cstring | null>(null)\n    const [hoveredDate, setHoveredDate] = React.useState\u003cstring | null>(null)\n    const [hoveredCount, setHoveredCount] = React.useState\u003cnumber | null>(null)\n    const [mousePos, setMousePos] = React.useState({ x: 0, y: 0 })\n\n    React.useEffect(() => {\n        const fetchData = async () => {\n            try {\n                setLoading(true)\n                const response = await fetch(\n                    `https://github-contributions-api.deno.dev/${username}.json`\n                )\n                if (!response.ok) {\n                    throw new Error(\"Failed to fetch GitHub data\")\n                }\n                const jsonData = await response.json()\n                setData(jsonData)\n            } catch (err) {\n                setError(err instanceof Error ? err.message : \"An error occurred\")\n            } finally {\n                setLoading(false)\n            }\n        }\n\n        if (username) {\n            fetchData()\n        }\n    }, [username])\n\n    if (error) {\n        return (\n            \u003cdiv className={cn(\"p-4 rounded-lg border border-red-200 bg-red-50 text-red-500 text-sm\", className)}>\n                Error: {error}\n            \u003c/div>\n        )\n    }\n\n    if (loading) {\n        return (\n            \u003cdiv className={cn(\"w-full h-32 animate-pulse bg-zinc-100 dark:bg-zinc-800 rounded-xl\", className)} />\n        )\n    }\n\n    const weeks = data?.contributions || []\n\n    return (\n        \u003cdiv className={cn(\"w-max max-w-full flex flex-col gap-4\", className)}>\n            {showTotal && (\n                \u003cdiv className=\"flex items-center justify-between\">\n                    \u003cdiv className=\"flex items-center gap-2\">\n                        \u003csvg height=\"16\" aria-hidden=\"true\" viewBox=\"0 0 16 16\" version=\"1.1\" width=\"16\" data-view-component=\"true\" className=\"fill-current text-muted-foreground\">\n                            \u003cpath d=\"M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z\">\u003c/path>\n                        \u003c/svg>\n                        \u003cspan className=\"font-semibold text-sm\">@{username}\u003c/span>\n                    \u003c/div>\n                    \u003cspan className=\"text-sm text-muted-foreground\">\n                        {data?.totalContributions} contributions in the last year\n                    \u003c/span>\n                \u003c/div>\n            )}\n\n            \u003cdiv\n                className=\"relative flex flex-nowrap gap-[3px] w-max max-w-full\"\n                onMouseLeave={() => {\n                    setHoveredDate(null)\n                    setHoveredCount(null)\n                }}\n            >\n                {/* Simple Tooltip */}\n                \u003cAnimatePresence>\n                    {hoveredDate && (\n                        \u003cmotion.div\n                            initial={{ opacity: 0, y: 10, scale: 0.9 }}\n                            animate={{ opacity: 1, y: 0, scale: 1 }}\n                            exit={{ opacity: 0, y: 5, scale: 0.9 }}\n                            transition={{ duration: 0.2 }}\n                            className=\"absolute z-50 pointer-events-none px-3 py-1.5 bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 text-xs rounded-md shadow-xl whitespace-nowrap\"\n                            style={{\n                                left: mousePos.x,\n                                top: mousePos.y - 40,\n                                transform: \"translateX(-50%)\"\n                            }}\n                        >\n                            \u003cspan className=\"font-bold mr-1\">{hoveredCount}\u003c/span>\n                            \u003cspan className=\"text-zinc-400 dark:text-zinc-500\">contributions on {hoveredDate}\u003c/span>\n                        \u003c/motion.div>\n                    )}\n                \u003c/AnimatePresence>\n\n                {weeks.map((week, weekIndex) => (\n                    \u003cdiv key={weekIndex} className=\"flex flex-col gap-[3px] w-[14px]\">\n                        {week.map((day, dayIndex) => {\n                            const isGlowing = variant === \"city-lights\" && day.contributionCount > 0;\n                            const isMinimal = variant === \"minimal\";\n                            const shapeClass = getShapeClass(shape);\n\n                            return (\n                                \u003cmotion.div\n                                    key={day.date}\n                                    initial={{ opacity: 0, scale: 0 }}\n                                    animate={{ opacity: 1, scale: 1 }}\n                                    transition={{\n                                        delay: weekIndex * 0.01 + dayIndex * 0.01,\n                                        type: \"spring\",\n                                        stiffness: 260,\n                                        damping: 20\n                                    }}\n                                    onMouseEnter={(e) => {\n                                        setHoveredDate(day.date)\n                                        setHoveredCount(day.contributionCount)\n                                        const rect = e.currentTarget.getBoundingClientRect()\n                                        const parentRect = e.currentTarget.offsetParent!.getBoundingClientRect()\n                                        setMousePos({\n                                            x: rect.left - parentRect.left + rect.width / 2,\n                                            y: rect.top - parentRect.top\n                                        })\n                                    }}\n                                    className={cn(\n                                        \"w-full aspect-square transition-colors duration-200\",\n                                        getLevelClass(day.contributionLevel, colorSchema),\n                                        isGlowing && \"z-10\",\n                                        shapeClass,\n                                        isMinimal && \"rounded-full scale-75\",\n                                    )}\n                                    style={\n                                        isGlowing ? {\n                                            boxShadow: day.contributionLevel !== \"NONE\"\n                                                ? `0 0 ${day.contributionCount > 3 ? `${glowIntensity * 1.5}px` : `${glowIntensity}px`} ${colorSchema === 'green' ? '#10b981' :\n                                                    colorSchema === 'blue' ? '#3b82f6' :\n                                                        colorSchema === 'purple' ? '#a855f7' :\n                                                            '#f97316'\n                                                }`\n                                                : 'none'\n                                        } : undefined\n                                    }\n                                />\n                            )\n                        })}\n                    \u003c/div>\n                ))}\n            \u003c/div>\n        \u003c/div>\n    )\n}\n","filename":"github-calendar.tsx","install":"pnpm dlx shadcn@latest add @componentry/github-calendar","posterData":"/assets/embedded/033f6b1670c45685e71f6ff667bed5c51567909d3071ddd423a6d7e1e870b0cd.webp"},{"slug":"scroll-choreography","title":"Scroll Choreography","description":"A smooth, scroll-driven image choreography component using Framer Motion.","category":"Components","poster":"/preview-videos/component-animations/scrollchoreography.webp","video":"/preview-videos/component-animations/scrollchoreography.mp4","source":"\"use client\";\n\nimport { motion, useScroll, useSpring, useTransform } from \"framer-motion\";\nimport { useRef } from \"react\";\nimport { cn } from \"@/lib/utils\";\n\ninterface ScrollChoreographyProps {\n  className?: string;\n  images: {\n    topLeft: string;\n    topRight: string;\n    bottomLeft: string;\n    bottomRight: string;\n  };\n}\n\nexport function ScrollChoreography({\n  className,\n  images,\n}: ScrollChoreographyProps) {\n  const containerRef = useRef\u003cHTMLDivElement>(null);\n\n  const { scrollYProgress } = useScroll({\n    target: containerRef,\n    offset: [\"start start\", \"end end\"],\n  });\n\n  const smoothProgress = useSpring(scrollYProgress, {\n    stiffness: 400, // Higher stiffness for a slightly faster snap\n    damping: 50,   // Play with damping to add a little bounce/jerk\n    mass: 1.2,     // Adds a bit more weight to the movement\n    restDelta: 0.001,\n  });\n\n  // Default positions relative to center\n  const xLeft = \"-20vw\";\n  const xRight = \"20vw\";\n  const yTop = \"-14vh\";\n  const yBottom = \"14vh\";\n\n  // Phase 1: 0 - 0.3 (Diagonal movement)\n  // Phase 2: 0.35 - 0.65 (Stack alignment to center)\n  // Phase 3: 0.7 - 0.9 (Top Right expands to full screen)\n\n  // Top Left -> moves to Bottom Left, then to Center\n  const tlX = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [xLeft, xLeft, xLeft, \"0vw\", \"0vw\"]);\n  const tlY = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [yTop, yBottom, yBottom, \"0vh\", \"0vh\"]);\n\n  // Bottom Right -> moves to Top Right, then to Center\n  const brX = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [xRight, xRight, xRight, \"0vw\", \"0vw\"]);\n  const brY = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [yBottom, yTop, yTop, \"0vh\", \"0vh\"]);\n\n  // Bottom Left -> stays, then moves to Center\n  const blX = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [xLeft, xLeft, xLeft, \"0vw\", \"0vw\"]);\n  const blY = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [yBottom, yBottom, yBottom, \"0vh\", \"0vh\"]);\n\n  // Top Right -> stays, then moves to Center, then expands\n  const trX = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [xRight, xRight, xRight, \"0vw\", \"0vw\"]);\n  const trY = useTransform(smoothProgress, [0, 0.3, 0.35, 0.65, 1], [yTop, yTop, yTop, \"0vh\", \"0vh\"]);\n\n  // Top Right (Hero) scaling/expansion properties\n  const heroWidth = useTransform(smoothProgress, [0.65, 0.7, 0.9, 1], [\"36vw\", \"36vw\", \"100vw\", \"100vw\"]);\n  const heroHeight = useTransform(smoothProgress, [0.65, 0.7, 0.9, 1], [\"24vh\", \"24vh\", \"100vh\", \"100vh\"]);\n\n  // Opacity fading for images underneath the hero as it expands\n  const underImagesOpacity = useTransform(smoothProgress, [0.75, 0.85], [1, 0]);\n\n  const baseImageClasses =\n    \"absolute left-1/2 top-1/2 w-[36vw] h-[24vh] overflow-hidden -translate-x-1/2 -translate-y-1/2 bg-muted shadow-2xl will-change-transform\";\n\n  return (\n    \u003cdiv ref={containerRef} className={cn(\"relative h-[300vh] w-full\", className)}>\n      \u003cdiv className=\"sticky top-0 h-screen w-full overflow-hidden\">\n        \u003cdiv className=\"absolute inset-0 flex items-center justify-center\">\n\n          {/* Top Left Image */}\n          \u003cmotion.div\n            style={{ x: tlX, y: tlY, opacity: underImagesOpacity }}\n            className={cn(baseImageClasses, \"z-10\")}\n          >\n            \u003cimg src={images.topLeft} alt=\"Top Left\" className=\"h-full w-full object-cover\" />\n          \u003c/motion.div>\n\n          {/* Bottom Right Image */}\n          \u003cmotion.div\n            style={{ x: brX, y: brY, opacity: underImagesOpacity }}\n            className={cn(baseImageClasses, \"z-20\")}\n          >\n            \u003cimg src={images.bottomRight} alt=\"Bottom Right\" className=\"h-full w-full object-cover\" />\n          \u003c/motion.div>\n\n          {/* Bottom Left Image */}\n          \u003cmotion.div\n            style={{ x: blX, y: blY, opacity: underImagesOpacity }}\n            className={cn(baseImageClasses, \"z-30\")}\n          >\n            \u003cimg src={images.bottomLeft} alt=\"Bottom Left\" className=\"h-full w-full object-cover\" />\n          \u003c/motion.div>\n\n          {/* Top Right Image (Hero - expands at the end) */}\n          \u003cmotion.div\n            style={{\n              x: trX,\n              y: trY,\n              width: heroWidth,\n              height: heroHeight,\n            }}\n            className={cn(baseImageClasses, \"z-40 origin-center bg-black/5\")}\n          >\n            \u003cimg src={images.topRight} alt=\"Top Right (Hero)\" className=\"h-full w-full object-cover\" />\n          \u003c/motion.div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  );\n}\n","filename":"scroll-choreography.tsx","install":"pnpm dlx shadcn@latest add @componentry/scroll-choreography","posterData":"/assets/embedded/7de904813881fbb04ce0edb684eb8f4e328b95fde5818975db4c6375da3b509d.webp"},{"slug":"scroll-tilted-grid","title":"Scroll Tilted Grid","description":"A cinematic image grid that tilts and resolves into focus as each frame crosses the viewport.","category":"Components","poster":"/preview-videos/component-animations/scrolltiltedgrid.webp","video":"/preview-videos/component-animations/scrolltiltedgrid.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { useReducedMotion } from \"framer-motion\";\nimport ReactLenis from \"lenis/react\";\nimport {\n  type CSSProperties,\n  useEffect,\n  useMemo,\n  useRef,\n  useState,\n} from \"react\";\n\nexport interface ScrollTiltedGridImage {\n  src: string;\n  alt: string;\n}\n\nexport interface ScrollTiltedGridProps {\n  images: readonly ScrollTiltedGridImage[];\n  loop?: boolean;\n  initialCycles?: number;\n  maxCycles?: number;\n  smoothScroll?: boolean;\n  aspectRatio?: string;\n  perspective?: number;\n  maxTilt?: number;\n  maxBlur?: number;\n  rounded?: string;\n  sectionPadding?: string;\n  className?: string;\n}\n\ntype TileVariables = CSSProperties & {\n  \"--tile-blur\": string;\n  \"--tile-brightness\": number;\n  \"--tile-saturation\": number;\n  \"--tile-transform\": string;\n  \"--tile-image-scale\": number;\n};\n\nfunction clamp(value: number, minimum = 0, maximum = 1) {\n  return Math.min(maximum, Math.max(minimum, value));\n}\n\nfunction GalleryTile({\n  image,\n  index,\n  aspectRatio,\n  perspective,\n  maxTilt,\n  maxBlur,\n  rounded,\n  reduceMotion,\n}: {\n  image: ScrollTiltedGridImage;\n  index: number;\n  aspectRatio: string;\n  perspective: number;\n  maxTilt: number;\n  maxBlur: number;\n  rounded: string;\n  reduceMotion: boolean;\n}) {\n  const tileRef = useRef\u003cHTMLElement>(null);\n  const side = index % 2 === 0 ? -1 : 1;\n\n  useEffect(() => {\n    const tile = tileRef.current;\n    if (!tile || reduceMotion) return;\n\n    let frame = 0;\n    const update = () => {\n      frame = 0;\n      const rect = tile.getBoundingClientRect();\n      const travel = window.innerHeight + rect.height;\n      const position = clamp((window.innerHeight - rect.top) / travel);\n      const distance = Math.abs(position - 0.5) * 2;\n      const signed = (position - 0.5) * 2;\n      const eased = distance * distance * (3 - 2 * distance);\n      const x = side * eased * 18;\n      const y = -signed * eased * 24;\n      const tilt = -signed * maxTilt;\n      const roll = side * signed * 3;\n      const skew = -side * signed * 7;\n\n      tile.style.setProperty(\"--tile-blur\", `${eased * maxBlur}px`);\n      tile.style.setProperty(\"--tile-brightness\", String(1 - eased * 0.5));\n      tile.style.setProperty(\"--tile-saturation\", String(1 - eased * 0.5));\n      tile.style.setProperty(\"--tile-image-scale\", String(1.03 + eased * 0.15));\n      tile.style.setProperty(\n        \"--tile-transform\",\n        `translate3d(${x}%, ${y}%, ${eased * 180}px) rotateX(${tilt}deg) rotateZ(${roll}deg) skewX(${skew}deg)`,\n      );\n    };\n    const schedule = () => {\n      if (!frame) frame = window.requestAnimationFrame(update);\n    };\n\n    update();\n    const resizeObserver = new ResizeObserver(schedule);\n    resizeObserver.observe(tile);\n    window.addEventListener(\"scroll\", schedule, { passive: true });\n    window.addEventListener(\"resize\", schedule);\n\n    return () => {\n      resizeObserver.disconnect();\n      window.removeEventListener(\"scroll\", schedule);\n      window.removeEventListener(\"resize\", schedule);\n      if (frame) window.cancelAnimationFrame(frame);\n    };\n  }, [maxBlur, maxTilt, reduceMotion, side]);\n\n  const variables: TileVariables = {\n    aspectRatio,\n    borderRadius: rounded,\n    perspective,\n    \"--tile-blur\": \"0px\",\n    \"--tile-brightness\": 1,\n    \"--tile-saturation\": 1,\n    \"--tile-transform\": \"translate3d(0, 0, 0)\",\n    \"--tile-image-scale\": 1.03,\n  };\n\n  return (\n    \u003cfigure\n      ref={tileRef}\n      className={cn(\"m-0\", side > 0 && \"pt-12 sm:pt-24\")}\n      style={variables}\n    >\n      \u003cdiv\n        className={cn(\n          \"relative w-full overflow-hidden border border-black/10 bg-neutral-200 shadow-[0_24px_80px_rgba(20,18,14,0.16)] dark:border-white/10 dark:bg-neutral-900 dark:shadow-[0_24px_90px_rgba(0,0,0,0.45)]\",\n          !reduceMotion &&\n            \"[filter:blur(var(--tile-blur))_brightness(var(--tile-brightness))_saturate(var(--tile-saturation))] [transform:var(--tile-transform)] [transform-style:preserve-3d]\",\n        )}\n        style={{ aspectRatio, borderRadius: rounded }}\n      >\n        \u003cimg\n          src={image.src}\n          alt={image.alt}\n          className={cn(\n            \"h-full w-full object-cover\",\n            !reduceMotion && \"[transform:scale(var(--tile-image-scale))]\",\n          )}\n          loading={index \u003c 4 ? \"eager\" : \"lazy\"}\n          draggable={false}\n        />\n        \u003cspan className=\"pointer-events-none absolute inset-0 bg-gradient-to-b from-white/5 via-transparent to-black/10\" />\n      \u003c/div>\n    \u003c/figure>\n  );\n}\n\nexport function ScrollTiltedGrid({\n  images,\n  loop = false,\n  initialCycles = 2,\n  maxCycles = 4,\n  smoothScroll = true,\n  aspectRatio = \"4 / 5\",\n  perspective = 1000,\n  maxTilt = 62,\n  maxBlur = 7,\n  rounded = \"0.25rem\",\n  sectionPadding = \"18vh\",\n  className,\n}: ScrollTiltedGridProps) {\n  const reduceMotion = useReducedMotion() ?? false;\n  const cycleLimit = Math.max(1, maxCycles);\n  const [cycleCount, setCycleCount] = useState(() =>\n    clamp(initialCycles, 1, cycleLimit),\n  );\n  const loadMoreRef = useRef\u003cHTMLDivElement>(null);\n\n  useEffect(() => {\n    const marker = loadMoreRef.current;\n    if (!loop || !marker) return;\n    const observer = new IntersectionObserver(\n      ([entry]) => {\n        if (entry?.isIntersecting) {\n          setCycleCount((count) => Math.min(cycleLimit, count + 1));\n        }\n      },\n      { rootMargin: \"1200px 0px\" },\n    );\n    observer.observe(marker);\n    return () => observer.disconnect();\n  }, [cycleLimit, loop]);\n\n  const tiles = useMemo(\n    () =>\n      Array.from({ length: loop ? cycleCount : 1 }, (_, cycle) =>\n        images.map((image, index) => ({ cycle, image, index })),\n      ).flat(),\n    [cycleCount, images, loop],\n  );\n\n  const gallery = (\n    \u003csection\n      className={cn(\"relative w-full overflow-hidden\", className)}\n      aria-label=\"Scroll-reactive image gallery\"\n    >\n      \u003cdiv\n        className=\"mx-auto grid w-full max-w-5xl grid-cols-2 items-start gap-x-4 gap-y-16 px-4 sm:gap-x-10 sm:gap-y-28 sm:px-10 lg:gap-x-16\"\n        style={{ paddingBlock: sectionPadding }}\n      >\n        {tiles.map(({ cycle, image, index }) => (\n          \u003cGalleryTile\n            key={`${cycle}-${index}-${image.src}`}\n            image={image}\n            index={index}\n            aspectRatio={aspectRatio}\n            perspective={perspective}\n            maxTilt={maxTilt}\n            maxBlur={maxBlur}\n            rounded={rounded}\n            reduceMotion={reduceMotion}\n          />\n        ))}\n      \u003c/div>\n      {loop && cycleCount \u003c cycleLimit ? (\n        \u003cdiv ref={loadMoreRef} className=\"h-px\" aria-hidden />\n      ) : null}\n    \u003c/section>\n  );\n\n  return smoothScroll && !reduceMotion ? (\n    \u003cReactLenis\n      root\n      options={{ autoRaf: true, lerp: 0.075, wheelMultiplier: 0.85 }}\n    >\n      {gallery}\n    \u003c/ReactLenis>\n  ) : (\n    gallery\n  );\n}\n","filename":"scroll-tilted-grid.tsx","install":"pnpm dlx shadcn@latest add @componentry/scroll-tilted-grid","posterData":"/assets/embedded/77f30bf05dd6a4719514f87f75e54c8f7df0fb23ca01068d6dc0cad85b28f1c6.webp"},{"slug":"layered-stack","title":"Layered Stack","description":"A stack of layered cards that interact with mouse hover.","category":"Components","poster":"/preview-videos/component-animations/layeredstack.webp","video":"/preview-videos/component-animations/layeredstack.mp4","source":"\"use client\";\n\nimport { ComponentPropsWithoutRef, useCallback, useEffect, useRef } from \"react\";\nimport gsap from \"gsap\";\nimport { cn } from \"@/lib/utils\";\n\nexport type LayeredStackProps = ComponentPropsWithoutRef\u003c\"div\">;\n\nexport const LayeredStack = ({ children, className, ...props }: LayeredStackProps) => {\n    const containerRef = useRef\u003cHTMLDivElement>(null);\n    const isStacked = useRef(true);\n    const isHovered = useRef(false);\n\n    const stackCards = useCallback((animate = true) => {\n        const container = containerRef.current;\n        if (!container) return;\n\n        isStacked.current = true;\n        const cards = Array.from(container.children) as HTMLElement[];\n\n        cards.forEach((card) => {\n            gsap.killTweensOf(card);\n        });\n\n        cards.forEach((card, i) => {\n            const offsetX = container.clientWidth / 2 - card.offsetWidth / 2 - card.offsetLeft;\n            const offsetY = container.clientHeight / 2 - card.offsetHeight / 2 - card.offsetTop;\n\n            if (!animate) {\n                gsap.set(card, {\n                    x: offsetX,\n                    y: offsetY,\n                    rotate: gsap.utils.random(-10, 10),\n                    zIndex: 100 - i,\n                });\n                return;\n            }\n\n            gsap.to(card, {\n                x: offsetX,\n                y: offsetY,\n                rotate: gsap.utils.random(-10, 10),\n                zIndex: 100 - i,\n                duration: 0.8,\n                ease: \"expo.out\",\n                overwrite: true,\n            });\n        });\n    }, []);\n\n    const resetCards = useCallback((animate = true) => {\n        const container = containerRef.current;\n        if (!container) return;\n\n        isStacked.current = false;\n        const cards = Array.from(container.children) as HTMLElement[];\n\n        if (!animate) {\n            cards.forEach((card, i) => {\n                gsap.killTweensOf(card);\n                gsap.set(card, {\n                    x: 0,\n                    y: 0,\n                    rotate: 0,\n                    zIndex: 100 - i,\n                });\n            });\n            return;\n        }\n\n        gsap.to(cards, {\n            x: 0,\n            y: 0,\n            zIndex: (i: number) => 100 - i,\n            duration: 0.8,\n            rotate: 0,\n            ease: \"expo.out\",\n            stagger: {\n                amount: 0.1,\n                from: \"start\",\n            },\n            overwrite: true,\n        });\n    }, []);\n\n    useEffect(() => {\n        const container = containerRef.current;\n        if (!container) return;\n\n        // Initial z-index setup\n        const cards = Array.from(container.children) as HTMLElement[];\n        cards.forEach((card, i) => {\n            gsap.set(card, { zIndex: 100 - i });\n        });\n\n        stackCards();\n\n        // Re-sync hover/stack state on resize to avoid stale hover visuals after layout shifts.\n        const ro = new ResizeObserver(() => {\n            const container = containerRef.current;\n            if (!container) return;\n\n            isHovered.current = container.matches(\":hover\");\n\n            if (isHovered.current) {\n                resetCards(false);\n            } else {\n                stackCards(false);\n            }\n        });\n        ro.observe(container);\n\n        return () => ro.disconnect();\n    }, [resetCards, stackCards]);\n\n    return (\n        \u003cdiv\n            ref={containerRef}\n            onMouseEnter={() => {\n                isHovered.current = true;\n                resetCards(true);\n            }}\n            onMouseLeave={() => {\n                isHovered.current = false;\n                stackCards(true);\n            }}\n            className={cn(\"relative\", className)}\n            {...props}>\n            {children}\n        \u003c/div>\n    );\n};\n","filename":"layered-stack.tsx","install":"pnpm dlx shadcn@latest add @componentry/layered-stack","posterData":"/assets/embedded/be486d2215bc2e625075315f74256c525a5bd387c5e0aa31d5835e2137d1d625.webp"},{"slug":"orbit-card-stack","title":"Orbit Card Stack","description":"Premium hover card deck that fans outward and lifts the active card without changing its color or angle.","category":"Components","poster":"/preview-videos/component-animations/orbitcardstack.webp","video":"/preview-videos/component-animations/orbitcardstack.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { ArrowUpRight } from \"lucide-react\";\nimport { useReducedMotion } from \"framer-motion\";\nimport {\n  type CSSProperties,\n  type FocusEvent,\n  useMemo,\n  useRef,\n  useState,\n} from \"react\";\n\nexport interface OrbitStackItem {\n  name: string;\n  role: string;\n  description: string;\n  accent?: string;\n  initials?: string;\n  stat?: string;\n  image?: string;\n}\n\ninterface OrbitCardStackProps {\n  items?: OrbitStackItem[];\n  className?: string;\n  cardClassName?: string;\n  defaultActiveIndex?: number;\n  spread?: number;\n  lift?: number;\n  onActiveChange?: (item: OrbitStackItem, index: number) => void;\n}\n\nconst defaultItems: OrbitStackItem[] = [\n  {\n    name: \"Mira Vale\",\n    role: \"Creative Lead\",\n    description:\n      \"Shapes visual systems with enough restraint to feel expensive and enough edge to be remembered.\",\n    accent: \"#f8d66d\",\n    initials: \"MV\",\n    stat: \"Identity\",\n    image: \"/images/orbit-card-stack/mira-vale.png\",\n  },\n  {\n    name: \"Noor Kade\",\n    role: \"Product Strategy\",\n    description:\n      \"Turns loose ideas into sharp product moves, crisp priorities, and launchable experiences.\",\n    accent: \"#78dcca\",\n    initials: \"NK\",\n    stat: \"Roadmap\",\n    image: \"/images/orbit-card-stack/noor-kade.png\",\n  },\n  {\n    name: \"Ari Chen\",\n    role: \"Founder\",\n    description:\n      \"Sets the taste bar, protects the details, and keeps the whole team pointed at the same high signal.\",\n    accent: \"#f3f1ea\",\n    initials: \"AC\",\n    stat: \"Vision\",\n    image: \"/images/orbit-card-stack/ari-chen.png\",\n  },\n  {\n    name: \"Sana Holt\",\n    role: \"Frontend Engineer\",\n    description:\n      \"Builds the motion, polish, and interface texture that make the product feel calm under pressure.\",\n    accent: \"#b9a7ff\",\n    initials: \"SH\",\n    stat: \"Motion\",\n    image: \"/images/orbit-card-stack/sana-holt.png\",\n  },\n  {\n    name: \"Ezra Moon\",\n    role: \"Operations\",\n    description:\n      \"Keeps the machine quiet, the handoffs clean, and the team moving without pointless friction.\",\n    accent: \"#ff9d77\",\n    initials: \"EM\",\n    stat: \"Systems\",\n    image: \"/images/orbit-card-stack/ezra-moon.png\",\n  },\n];\n\nfunction inRange(index: number, length: number) {\n  return Math.min(Math.max(0, index), Math.max(0, length - 1));\n}\n\nfunction initialsFor(item: OrbitStackItem) {\n  return (\n    item.initials ??\n    item.name\n      .split(/\\s+/)\n      .map((part) => part.at(0))\n      .join(\"\")\n      .slice(0, 2)\n      .toUpperCase()\n  );\n}\n\nfunction Portrait({ item }: { item: OrbitStackItem }) {\n  const initials = initialsFor(item);\n  const shared =\n    \"relative flex aspect-[1.36] w-full overflow-hidden rounded-[1.45rem] border border-black/[0.08] bg-black/[0.045]\";\n\n  if (item.image) {\n    return (\n      \u003cdiv className={shared}>\n        \u003cimg\n          src={item.image}\n          alt={item.name}\n          className=\"h-full w-full object-cover\"\n        />\n        \u003cspan className=\"absolute bottom-4 right-4 rounded-full bg-zinc-950 px-3 py-1 text-xs font-semibold tracking-[0.18em] text-white\">\n          {initials}\n        \u003c/span>\n      \u003c/div>\n    );\n  }\n\n  return (\n    \u003cdiv\n      className={shared}\n      style={{ \"--portrait-accent\": item.accent ?? \"#f3f1ea\" } as CSSProperties}\n    >\n      \u003cdiv className=\"absolute inset-0 bg-[radial-gradient(circle_at_22%_20%,var(--portrait-accent),transparent_24%),radial-gradient(circle_at_85%_72%,rgba(255,255,255,0.5),transparent_28%)] opacity-45\" />\n      \u003cdiv className=\"absolute inset-x-8 bottom-0 h-[72%] rounded-t-[999px] border-2 border-zinc-950 bg-[#f7f5ef]\" />\n      \u003cdiv className=\"absolute left-1/2 top-[22%] size-24 -translate-x-1/2 rounded-[45%_55%_48%_52%] border-2 border-zinc-950 bg-[#f5f2eb]\">\n        \u003cspan className=\"absolute left-[27%] top-[34%] size-2 rounded-full bg-zinc-950\" />\n        \u003cspan className=\"absolute right-[27%] top-[34%] size-2 rounded-full bg-zinc-950\" />\n        \u003cspan className=\"absolute left-1/2 top-[52%] h-6 w-4 -translate-x-1/2 rounded-b-full border-b-2 border-zinc-950\" />\n        \u003cspan\n          className=\"absolute -top-5 left-1/2 h-9 w-24 -translate-x-1/2 rounded-t-full border-2 border-b-0 border-zinc-950\"\n          style={{ backgroundColor: item.accent ?? \"#f3f1ea\" }}\n        />\n      \u003c/div>\n      \u003cspan className=\"absolute bottom-4 right-4 rounded-full bg-zinc-950 px-3 py-1 text-xs font-semibold tracking-[0.18em] text-white\">\n        {initials}\n      \u003c/span>\n    \u003c/div>\n  );\n}\n\nexport function OrbitCardStack({\n  items = defaultItems,\n  className,\n  cardClassName,\n  defaultActiveIndex = 2,\n  spread = 168,\n  lift = 34,\n  onActiveChange,\n}: OrbitCardStackProps) {\n  const reduceMotion = useReducedMotion() ?? false;\n  const cards = items.length ? items : defaultItems;\n  const restingIndex = inRange(defaultActiveIndex, cards.length);\n  const [activeIndex, setActiveIndex] = useState(restingIndex);\n  const [open, setOpen] = useState(false);\n  const stageRef = useRef\u003cHTMLDivElement>(null);\n  const midpoint = (cards.length - 1) / 2;\n\n  const layouts = useMemo(\n    () =>\n      cards.map((_, index) => {\n        const orbit = index - midpoint;\n        const stack = index - restingIndex;\n        return {\n          open: {\n            x: orbit * spread,\n            y: Math.abs(orbit) * 30 + Math.max(0, Math.abs(orbit) - 1) * 10,\n            rotation: orbit * 8.5,\n          },\n          closed: {\n            x: stack * 10,\n            y: Math.abs(stack) * 5,\n            rotation: stack * 2.8,\n          },\n        };\n      }),\n    [cards, midpoint, restingIndex, spread],\n  );\n\n  const activate = (index: number) => {\n    const next = inRange(index, cards.length);\n    setOpen(true);\n    setActiveIndex(next);\n    onActiveChange?.(cards[next]!, next);\n  };\n  const close = () => {\n    setOpen(false);\n    setActiveIndex(restingIndex);\n  };\n  const leaveFocus = (event: FocusEvent\u003cHTMLDivElement>) => {\n    if (!event.currentTarget.contains(event.relatedTarget)) close();\n  };\n\n  return (\n    \u003cdiv\n      className={cn(\n        \"relative flex min-h-full w-full items-center justify-center overflow-hidden p-8\",\n        className,\n      )}\n    >\n      \u003cdiv\n        ref={stageRef}\n        className=\"relative h-[470px] w-full max-w-[980px]\"\n        onMouseLeave={close}\n        onBlur={leaveFocus}\n        role=\"list\"\n        aria-label=\"Profile card stack\"\n      >\n        {cards.map((item, index) => {\n          const position = open ? layouts[index]!.open : layouts[index]!.closed;\n          const active = index === activeIndex;\n          const style: CSSProperties = {\n            zIndex: active ? 80 : 50 - Math.abs(index - activeIndex),\n            transform: `translate(calc(-50% + ${position.x}px), calc(-50% + ${\n              position.y - (open && active ? lift : 0)\n            }px)) rotate(${position.rotation}deg) scale(${open ? 0.985 : 0.97})`,\n            transitionDuration: reduceMotion ? \"0ms\" : \"420ms\",\n          };\n\n          return (\n            \u003carticle\n              key={`${item.name}-${index}`}\n              role=\"listitem\"\n              tabIndex={0}\n              aria-current={active ? \"true\" : undefined}\n              className={cn(\n                \"absolute left-1/2 top-1/2 w-[min(78vw,21rem)] origin-bottom cursor-pointer rounded-[1.9rem] border border-black/10 bg-[#e9e6df] p-4 text-[#141414] outline-none\",\n                \"transition-[transform] ease-[cubic-bezier(.2,.8,.2,1)] focus-visible:ring-2 focus-visible:ring-zinc-950/30 focus-visible:ring-offset-2 focus-visible:ring-offset-white\",\n                cardClassName,\n              )}\n              style={style}\n              onMouseEnter={() => activate(index)}\n              onFocus={() => activate(index)}\n              onClick={() => activate(index)}\n              onKeyDown={(event) => {\n                if (event.key === \"ArrowRight\" || event.key === \"ArrowDown\") {\n                  event.preventDefault();\n                  const next = (index + 1) % cards.length;\n                  activate(next);\n                  stageRef.current\n                    ?.querySelectorAll\u003cHTMLElement>(\"[role=listitem]\")\n                    [next]?.focus();\n                }\n                if (event.key === \"ArrowLeft\" || event.key === \"ArrowUp\") {\n                  event.preventDefault();\n                  const next = (index - 1 + cards.length) % cards.length;\n                  activate(next);\n                  stageRef.current\n                    ?.querySelectorAll\u003cHTMLElement>(\"[role=listitem]\")\n                    [next]?.focus();\n                }\n                if (event.key === \"Escape\") {\n                  event.currentTarget.blur();\n                  close();\n                }\n              }}\n            >\n              \u003cdiv className=\"relative\">\n                \u003cPortrait item={item} />\n                \u003cspan className=\"absolute right-3 top-3 grid size-11 place-items-center rounded-full bg-zinc-950 text-white shadow-lg shadow-black/20\">\n                  \u003cArrowUpRight className=\"size-4\" aria-hidden />\n                \u003c/span>\n              \u003c/div>\n              \u003cdiv className=\"px-2 pb-2 pt-6\">\n                \u003cp className=\"text-[0.72rem] font-semibold uppercase tracking-[0.18em] text-zinc-500\">\n                  {item.role}\n                \u003c/p>\n                \u003ch3 className=\"mt-2 text-[2rem] font-semibold leading-none tracking-[-0.04em] text-zinc-950\">\n                  {item.name}\n                \u003c/h3>\n                \u003cp className=\"mt-4 max-w-[17rem] text-[0.98rem] font-medium leading-[1.42] tracking-[-0.01em] text-zinc-700\">\n                  {item.description}\n                \u003c/p>\n                \u003cdiv className=\"mt-5 border-t border-black/10 pt-4 text-[0.68rem] font-bold uppercase tracking-[0.2em] text-zinc-500\">\n                  {item.stat ?? \"Profile\"}\n                \u003c/div>\n              \u003c/div>\n            \u003c/article>\n          );\n        })}\n      \u003c/div>\n    \u003c/div>\n  );\n}\n","filename":"orbit-card-stack.tsx","install":"pnpm dlx shadcn@latest add @componentry/orbit-card-stack","posterData":"/assets/embedded/59e3d370d7b4e038f1f5df5aafb3d713280033890712e8f6d47476f92b5e5d81.webp"},{"slug":"wheel-carousel","title":"Wheel Carousel","description":"A cinematic rotating-wheel picker with inertial drag, curved fading labels, and crossfading project imagery.","category":"Components","poster":"/preview-videos/component-animations/wheelcarousel.webp","video":"/preview-videos/component-animations/wheelcarousel.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { AnimatePresence, motion, useReducedMotion } from \"framer-motion\";\nimport { useTheme } from \"next-themes\";\nimport {\n  type KeyboardEvent,\n  type PointerEvent,\n  useCallback,\n  useEffect,\n  useId,\n  useMemo,\n  useRef,\n  useState,\n} from \"react\";\n\nexport interface WheelCarouselItem {\n  label: string;\n  image: string;\n  imageAlt?: string;\n}\n\nexport type WheelCarouselMode = \"system\" | \"light\" | \"dark\" | \"custom\";\n\nexport interface WheelCarouselProps {\n  items?: WheelCarouselItem[];\n  mode?: WheelCarouselMode;\n  photoSide?: \"left\" | \"right\";\n  photoWidth?: number;\n  photoAspect?: \"3/4\" | \"1/1\" | \"4/3\" | \"3/2\";\n  contentWidth?: number;\n  gap?: number;\n  photoRadius?: number;\n  crossfadeDuration?: number;\n  radius?: number;\n  spacing?: number;\n  visibleItems?: number;\n  apexInset?: number;\n  textColor?: string;\n  selectedColor?: string;\n  showMarker?: boolean;\n  markerColor?: string;\n  markerSize?: number;\n  markerGap?: number;\n  background?: string;\n  panelColor?: string;\n  scrollSpeed?: number;\n  dragSpeed?: number;\n  snap?: boolean;\n  momentum?: boolean;\n  appear?: boolean;\n  edgeFade?: boolean;\n  edgeFadeSize?: number;\n  initialIndex?: number;\n  activeIndex?: number;\n  onActiveChange?: (item: WheelCarouselItem, index: number) => void;\n  className?: string;\n  photoClassName?: string;\n  itemClassName?: string;\n}\n\nconst unsplash = (id: string) =>\n  `https://images.unsplash.com/photo-${id}?w=1200&q=80&auto=format&fit=crop`;\n\nexport const wheelCarouselDefaultItems: WheelCarouselItem[] = [\n  { label: \"Halcyon Fields\", image: unsplash(\"1520529890308-f503006340b4\") },\n  { label: \"Meridian House\", image: unsplash(\"1483366774565-c783b9f70e2c\") },\n
