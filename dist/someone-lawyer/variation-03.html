ent-animations/annotatedtext.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { useEffect, useRef, type ReactNode } from \"react\";\n\n/**\n * Every mark is generated rather than hand-drawn: a seeded random walk pushes\n * each sampled point off its ideal line, which is what reads as \"drawn by\n * hand\". The seed is fixed per mark, so the geometry is computed once at module\n * load and is identical on the server and in the browser.\n */\n\ntype Point = { x: number; y: number };\n\nfunction createRandom(seed: number) {\n  let state = seed >>> 0;\n  return function next() {\n    state = (state * 1664525 + 1013904223) >>> 0;\n    return state / 4294967296;\n  };\n}\n\n/** A signed nudge of at most `amount`. */\nfunction shake(rand: () => number, amount: number) {\n  return (rand() - 0.5) * 2 * amount;\n}\n\nfunction round(value: number) {\n  return Math.round(value * 100) / 100;\n}\n\n/** Curve through the sampled points by anchoring each one and passing through the midpoints. */\nfunction trace(points: Point[], close = false) {\n  const [first, ...rest] = points;\n  if (!first) return \"\";\n\n  let d = `M${round(first.x)},${round(first.y)}`;\n\n  rest.forEach((anchor, index) => {\n    const next = rest[index + 1];\n    if (!next) {\n      d += ` L${round(anchor.x)},${round(anchor.y)}`;\n      return;\n    }\n    d += ` Q${round(anchor.x)},${round(anchor.y)} ${round(\n      (anchor.x + next.x) / 2,\n    )},${round((anchor.y + next.y) / 2)}`;\n  });\n\n  return close ? `${d} Z` : d;\n}\n\n/** A nearly straight stroke that bows by `sag` and trembles by `wobble`. */\nfunction stroke(\n  from: Point,\n  to: Point,\n  options: { sag?: number; wobble?: number; steps?: number },\n  rand: () => number,\n) {\n  const { sag = 0, wobble = 0.55, steps = 12 } = options;\n  const points: Point[] = [];\n\n  for (let i = 0; i \u003c= steps; i++) {\n    const t = i / steps;\n    // Leave the endpoints exactly where they were asked for, so marks butt up\n    // against the edges of their box predictably.\n    const loose = i === 0 || i === steps ? 0 : 1;\n    points.push({\n      x: from.x + (to.x - from.x) * t + shake(rand, wobble) * loose,\n      y:\n        from.y +\n        (to.y - from.y) * t +\n        Math.sin(t * Math.PI) * sag +\n        shake(rand, wobble) * loose,\n    });\n  }\n\n  return points;\n}\n\n/** A horizontal sine, sampled four times per cycle. */\nfunction wave(\n  from: Point,\n  to: Point,\n  options: { amplitude: number; cycles: number; wobble?: number },\n  rand: () => number,\n) {\n  const { amplitude, cycles, wobble = 0.35 } = options;\n  const steps = Math.round(cycles * 4);\n  const points: Point[] = [];\n\n  for (let i = 0; i \u003c= steps; i++) {\n    const t = i / steps;\n    points.push({\n      x: from.x + (to.x - from.x) * t,\n      y:\n        from.y +\n        (to.y - from.y) * t +\n        Math.sin(t * cycles * Math.PI * 2) * amplitude +\n        shake(rand, wobble),\n    });\n  }\n\n  return points;\n}\n\n/** An elliptical sweep whose radius drifts as it goes around. */\nfunction arc(\n  center: Point,\n  radii: { rx: number; ry: number },\n  sweep: { from: number; to: number },\n  options: { wobble?: number; steps?: number },\n  rand: () => number,\n) {\n  const { wobble = 0.03, steps = 28 } = options;\n  const points: Point[] = [];\n\n  for (let i = 0; i \u003c= steps; i++) {\n    const t = i / steps;\n    const angle = ((sweep.from + (sweep.to - sweep.from) * t) * Math.PI) / 180;\n    const drift = 1 + shake(rand, wobble);\n    points.push({\n      x: center.x + Math.cos(angle) * radii.rx * drift,\n      y: center.y + Math.sin(angle) * radii.ry * drift,\n    });\n  }\n\n  return points;\n}\n\ntype Stroke = {\n  d: string;\n  width?: number;\n  opacity?: number;\n  fill?: boolean;\n};\n\nfunction wavyStrokes(): Stroke[] {\n  const rand = createRandom(17);\n  return [\n    {\n      d: trace(\n        wave(\n          { x: 2, y: 7 },\n          { x: 138, y: 7 },\n          { amplitude: 3, cycles: 9 },\n          rand,\n        ),\n      ),\n      width: 2.2,\n    },\n  ];\n}\n\nfunction underlineStrokes(): Stroke[] {\n  const rand = createRandom(23);\n  return [\n    { d: trace(stroke({ x: 3, y: 6 }, { x: 137, y: 5 }, { sag: -2 }, rand)) },\n  ];\n}\n\nfunction doubleUnderlineStrokes(): Stroke[] {\n  const rand = createRandom(41);\n  return [\n    { d: trace(stroke({ x: 3, y: 5 }, { x: 137, y: 4 }, { sag: -2 }, rand)) },\n    {\n      d: trace(stroke({ x: 5, y: 12 }, { x: 135, y: 11 }, { sag: -1.2 }, rand)),\n      width: 1.8,\n      opacity: 0.75,\n    },\n  ];\n}\n\nfunction strikethroughStrokes(): Stroke[] {\n  const rand = createRandom(59);\n  return [\n    { d: trace(stroke({ x: 3, y: 5 }, { x: 137, y: 5 }, { sag: 1.2 }, rand)) },\n  ];\n}\n\nfunction crossOutStrokes(): Stroke[] {\n  const rand = createRandom(73);\n  return [\n    {\n      d: trace(\n        stroke({ x: 4, y: 32 }, { x: 136, y: 8 }, { sag: -4, wobble: 1 }, rand),\n      ),\n    },\n    {\n      d: trace(\n        stroke({ x: 6, y: 10 }, { x: 134, y: 30 }, { sag: 4, wobble: 1 }, rand),\n      ),\n      width: 2,\n      opacity: 0.7,\n    },\n  ];\n}\n\nfunction arrowStrokes(): Stroke[] {\n  const rand = createRandom(89);\n  return [\n    { d: trace(stroke({ x: 3, y: 7 }, { x: 140, y: 8 }, { sag: -2.5 }, rand)) },\n    {\n      d: trace([\n        { x: 132, y: 3 },\n        { x: 142, y: 8 },\n        { x: 131, y: 13 },\n      ]),\n    },\n  ];\n}\n\nfunction circleStrokes(): Stroke[] {\n  const rand = createRandom(101);\n  return [\n    {\n      d: trace(\n        arc(\n          { x: 110, y: 32 },\n          { rx: 100, ry: 27 },\n          { from: 150, to: 520 },\n          { wobble: 0.035 },\n          rand,\n        ),\n      ),\n      width: 3,\n    },\n    {\n      d: trace(\n        arc(\n          { x: 110, y: 32 },\n          { rx: 95, ry: 24 },\n          { from: 165, to: 480 },\n          { wobble: 0.03 },\n          rand,\n        ),\n      ),\n      width: 1.5,\n      opacity: 0.55,\n    },\n  ];\n}\n\nfunction boxStrokes(): Stroke[] {\n  const rand = createRandom(127);\n  const topLeft = { x: 12, y: 10 };\n  const topRight = { x: 188, y: 10 };\n  const bottomRight = { x: 188, y: 54 };\n  const bottomLeft = { x: 12, y: 54 };\n\n  // The long edges bow outward; the short ones just tremble.\n  const outline = [\n    ...stroke(topLeft, topRight, { sag: -3, steps: 8 }, rand),\n    ...stroke(topRight, bottomRight, { steps: 4 }, rand),\n    ...stroke(bottomRight, bottomLeft, { sag: 3, steps: 8 }, rand),\n    ...stroke(bottomLeft, topLeft, { steps: 4 }, rand),\n  ];\n\n  return [{ d: trace(outline, true), width: 2.6 }];\n}\n\nfunction bracketStrokes(): Stroke[] {\n  const rand = createRandom(149);\n  return [\n    {\n      d: trace(\n        arc(\n          { x: 30, y: 30 },\n          { rx: 24, ry: 34 },\n          { from: 130, to: 230 },\n          { steps: 14 },\n          rand,\n        ),\n      ),\n      width: 2.6,\n    },\n    {\n      d: trace(\n        arc(\n          { x: 130, y: 30 },\n          { rx: 24, ry: 34 },\n          { from: 50, to: -50 },\n          { steps: 14 },\n          rand,\n        ),\n      ),\n      width: 2.6,\n    },\n  ];\n}\n\nfunction highlightStrokes(): Stroke[] {\n  const rand = createRandom(163);\n  // A closed blob: along the top, down the right end, back along the bottom.\n  const outline = [\n    ...stroke({ x: 5, y: 6 }, { x: 165, y: 5 }, { sag: -2, steps: 10 }, rand),\n    ...stroke({ x: 165, y: 5 }, { x: 165, y: 21 }, { steps: 3 }, rand),\n    ...stroke({ x: 165, y: 21 }, { x: 5, y: 22 }, { sag: 2, steps: 10 }, rand),\n    ...stroke({ x: 5, y: 22 }, { x: 5, y: 6 }, { steps: 3 }, rand),\n  ];\n\n  return [{ d: trace(outline, true), fill: true }];\n}\n\ntype MarkDefinition = {\n  wrapper: string;\n  decoration: string;\n  color: string;\n  viewBox?: string;\n  strokes?: Stroke[];\n  /** Marks that are plain CSS rather than a drawing. */\n  css?: string;\n  /** Filled marks sit behind the glyphs instead of on top of them. */\n  behindText?: boolean;\n};\n\nconst marks = {\n  wavy: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.4em] left-[-2%] h-[0.7em] w-[104%]\",\n    color: \"text-purple-500 dark:text-purple-300\",\n    viewBox: \"0 0 140 14\",\n    strokes: wavyStrokes(),\n  },\n  underline: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.32em] left-[-1%] h-[0.5em] w-[102%]\",\n    color: \"text-purple-500 dark:text-purple-400\",\n    viewBox: \"0 0 140 10\",\n    strokes: underlineStrokes(),\n  },\n  doubleUnderline: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.5em] left-[-1%] h-[0.7em] w-[102%]\",\n    color: \"text-emerald-600 dark:text-emerald-400\",\n    viewBox: \"0 0 140 16\",\n    strokes: doubleUnderlineStrokes(),\n  },\n  dottedUnderline: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.35em] left-[-1%] block h-[0.55em] w-[102%]\",\n    color: \"text-neutral-500 dark:text-neutral-400\",\n    css: cn(\n      \"bg-[radial-gradient(circle,currentColor_1.5px,transparent_1.5px)]\",\n      \"bg-size-[0.5em_100%] bg-position-[0_100%] bg-repeat-x\",\n    ),\n  },\n  line: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.18em] left-[-1%] block h-[2px] w-[102%]\",\n    color: \"text-neutral-500\",\n    css: \"rounded-full bg-current\",\n  },\n  arrow: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute bottom-[-0.45em] left-[-1%] h-[0.8em] w-[106%]\",\n    color: \"text-blue-600 dark:text-blue-400\",\n    viewBox: \"0 0 150 18\",\n    strokes: arrowStrokes(),\n  },\n  highlight: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute inset-x-[-4%] bottom-[-0.08em] z-0 h-[1.15em] w-[108%]\",\n    color: \"text-yellow-300/60\",\n    viewBox: \"0 0 170 26\",\n    strokes: highlightStrokes(),\n    behindText: true,\n  },\n  circle: {\n    wrapper: \"relative inline-block px-1 whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute inset-[-0.6em_-0.55em] h-[calc(100%+1.2em)] w-[calc(100%+1.1em)]\",\n    color: \"text-cyan-600 dark:text-cyan-200\",\n    viewBox: \"0 0 220 64\",\n    strokes: circleStrokes(),\n  },\n  box: {\n    wrapper: \"relative inline-block px-[0.4em] whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute inset-[-0.4em_-0.4em] h-[calc(100%+0.8em)] w-[calc(100%+0.8em)]\",\n    color: \"text-orange-600 dark:text-orange-400\",\n    viewBox: \"0 0 200 64\",\n    strokes: boxStrokes(),\n  },\n  bracket: {\n    wrapper: \"relative inline-block px-[0.35em] whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute inset-y-[-0.25em] left-[-0.15em] h-[calc(100%+0.5em)] w-[calc(100%+0.3em)]\",\n    color: \"text-neutral-500\",\n    viewBox: \"0 0 160 60\",\n    strokes: bracketStrokes(),\n  },\n  strikethrough: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute top-1/2 left-[-1%] h-[0.5em] w-[102%] -translate-y-1/2\",\n    color: \"text-red-500 dark:text-red-400\",\n    viewBox: \"0 0 140 10\",\n    strokes: strikethroughStrokes(),\n  },\n  crossOut: {\n    wrapper: \"relative inline-block whitespace-nowrap\",\n    decoration:\n      \"pointer-events-none absolute top-1/2 left-[-2%] h-[1.4em] w-[104%] -translate-y-1/2\",\n    color: \"text-red-500 dark:text-red-400\",\n    viewBox: \"0 0 140 40\",\n    strokes: crossOutStrokes(),\n  },\n} satisfies Record\u003cstring, MarkDefinition>;\n\nexport type AnnotationVariant = keyof typeof marks;\n\nexport interface AnnotatedTextProps {\n  /** The words to annotate. Kept on a single line so the drawing lines up. */\n  children: ReactNode;\n  /** Which hand-drawn mark to draw. */\n  variant?: AnnotationVariant;\n  /** Tailwind text color class for the mark, e.g. \"text-rose-400\". */\n  color?: string;\n  /** Draw the annotation when it first enters the viewport. */\n  animate?: boolean;\n  /** Delay before drawing, in seconds. */\n  delay?: number;\n  /** Drawing duration, in seconds. */\n  duration?: number;\n  /** Additional classes applied to the wrapper. */\n  className?: string;\n}\n\nexport function AnnotatedText({\n  children,\n  variant = \"wavy\",\n  color,\n  className,\n  animate = true,\n  delay = 0,\n  duration = 0.65,\n}: AnnotatedTextProps) {\n  const ref = useRef\u003cHTMLSpanElement>(null);\n\n  useEffect(() => {\n    const element = ref.current;\n    const reducedMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n    if (!element || !animate || reducedMotion.matches) return;\n\n    const drawings = element.querySelectorAll(\"[data-annotation-drawing]\");\n    const animations = Array.from(drawings, (drawing, index) => {\n      const reveal =\n        drawing.getAttribute(\"data-annotation-drawing\") === \"reveal\";\n      const opacity = Number(drawing.getAttribute(\"opacity\") ?? 1);\n      const animation = drawing.animate(\n        reveal\n          ? [{ clipPath: \"inset(0 100% 0 0)\" }, { clipPath: \"inset(0 0% 0 0)\" }]\n          : [\n              // A zero-length dash still paints a round cap. Keep it invisible\n              // during the delay, then reveal it as the stroke begins moving.\n              {\n                strokeDasharray: \"1\",\n                strokeDashoffset: \"1\",\n                opacity: 0,\n                offset: 0,\n              },\n              {\n                strokeDasharray: \"1\",\n                strokeDashoffset: \"0.999\",\n                opacity,\n                offset: 0.001,\n              },\n              {\n                strokeDasharray: \"1\",\n                strokeDashoffset: \"0\",\n                opacity,\n                offset: 1,\n              },\n            ],\n        {\n          duration: Math.max(0, duration) * 1000,\n          delay: Math.max(0, delay) * 1000 + index * 160,\n          easing: \"cubic-bezier(0.22, 0.61, 0.36, 1)\",\n          fill: \"backwards\",\n        },\n      );\n      animation.pause();\n      return animation;\n    });\n    const observer = new IntersectionObserver(\n      ([entry]) => {\n        if (!entry?.isIntersecting) return;\n        animations.forEach((animation) => animation.play());\n        observer.disconnect();\n      },\n      { threshold: 0.25 },\n    );\n    observer.observe(element);\n\n    const finish = () => {\n      if (!reducedMotion.matches) return;\n      observer.disconnect();\n      animations.forEach((animation) => animation.cancel());\n    };\n    reducedMotion.addEventListener(\"change\", finish);\n    return () => {\n      observer.disconnect();\n      animations.forEach((animation) => animation.cancel());\n      reducedMotion.removeEventListener(\"change\", finish);\n    };\n  }, [animate, delay, duration, variant]);\n\n  const mark: MarkDefinition = marks[variant];\n  const decorationClass = cn(mark.decoration, color ?? mark.color);\n\n  return (\n    \u003cspan ref={ref} className={cn(mark.wrapper, className)}>\n      {mark.behindText ? (\n        // The mark is an opaque fill, so the words ride on top of it as ink.\n        \u003cspan className=\"relative z-10\">{children}\u003c/span>\n      ) : (\n        children\n      )}\n\n      {mark.css ? (\n        \u003cspan\n          aria-hidden=\"true\"\n          data-annotation-drawing=\"reveal\"\n          className={cn(\"block\", decorationClass, mark.css)}\n        />\n      ) : (\n        \u003csvg\n          className={cn(decorationClass, mark.behindText && \"z-0\")}\n          viewBox={mark.viewBox}\n          fill=\"none\"\n          preserveAspectRatio=\"none\"\n          aria-hidden=\"true\"\n        >\n          {mark.strokes?.map((line) => (\n            \u003cpath\n              key={line.d}\n              d={line.d}\n              pathLength={1}\n              data-annotation-drawing={line.fill ? \"reveal\" : \"stroke\"}\n              fill={line.fill ? \"currentColor\" : \"none\"}\n              stroke={line.fill ? \"none\" : \"currentColor\"}\n              strokeWidth={line.fill ? undefined : (line.width ?? 2.4)}\n              strokeLinecap=\"round\"\n              strokeLinejoin=\"round\"\n              opacity={line.opacity}\n            />\n          ))}\n        \u003c/svg>\n      )}\n    \u003c/span>\n  );\n}\n","filename":"annotated-text.tsx","install":"pnpm dlx shadcn@latest add @componentry/annotated-text","posterData":"/assets/embedded/48d885695a209f6f859a140007dcf7f979a8a231510c8ecbbc9dafd4d2dc3d4c.webp"},{"slug":"case-study-flip-stack","title":"Case Study Flip Stack","description":"Editorial case study cards that fold upward on scroll to reveal the next story.","category":"Components","poster":"/preview-videos/component-animations/casestudyflipstack.webp","video":"/preview-videos/component-animations/casestudyflipstack.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport {\n  motion,\n  useMotionTemplate,\n  useReducedMotion,\n  useScroll,\n  useSpring,\n  useTransform,\n  type MotionValue,\n} from \"framer-motion\";\nimport { useRef } from \"react\";\n\nexport interface CaseStudyFlipItem {\n  number?: string;\n  eyebrow: string;\n  title: string;\n  description: string;\n  image: string;\n  imageAlt: string;\n  background: string;\n  foreground?: string;\n}\n\ninterface CaseStudyFlipStackProps {\n  items?: CaseStudyFlipItem[];\n  className?: string;\n  hint?: string;\n  heading?: string;\n  endLabel?: string;\n}\n\nconst DEFAULT_ITEMS: CaseStudyFlipItem[] = [\n  {\n    eyebrow: \"Fintech\",\n    title: \"Boosted conversion by 42% with a product-led redesign\",\n    description:\n      \"We restructured the onboarding flow and clarified the value proposition, helping the platform turn more visitors into activated users.\",\n    image:\n      \"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=1400&q=90&auto=format&fit=crop\",\n    imageAlt: \"Portrait framed by tropical greenery\",\n    background: \"#a94808\",\n    foreground: \"#fff7ed\",\n  },\n  {\n    eyebrow: \"Hospitality\",\n    title: \"A slower digital experience for a faster-growing retreat\",\n    description:\n      \"A cinematic booking journey brings the landscape forward, simplifies room selection, and gives every stay a stronger sense of place.\",\n    image:\n      \"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400&q=90&auto=format&fit=crop\",\n    imageAlt: \"A person overlooking a mountain landscape\",\n    background: \"#067b8f\",\n    foreground: \"#ecfeff\",\n  },\n  {\n    eyebrow: \"Culture\",\n    title: \"Turning a living archive into something you can wander through\",\n    description:\n      \"We paired bold editorial typography with an intuitive collection system, making decades of work feel immediate, playful, and alive.\",\n    image:\n      \"https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=1400&q=90&auto=format&fit=crop\",\n    imageAlt: \"Colorful artwork in a contemporary gallery\",\n    background: \"#ba075f\",\n    foreground: \"#fff1f7\",\n  },\n  {\n    eyebrow: \"Climate\",\n    title: \"Making complex energy data feel clear enough to act on\",\n    description:\n      \"An approachable visual system turns live infrastructure data into useful decisions for operators, partners, and the communities they serve.\",\n    image:\n      \"https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?w=1400&q=90&auto=format&fit=crop\",\n    imageAlt: \"Wind turbines across a green landscape\",\n    background: \"#3322a8\",\n    foreground: \"#f3f1ff\",\n  },\n];\n\nfunction FlipCard({\n  item,\n  index,\n  total,\n  progress,\n  reduceMotion,\n}: {\n  item: CaseStudyFlipItem;\n  index: number;\n  total: number;\n  progress: MotionValue\u003cnumber>;\n  reduceMotion: boolean;\n}) {\n  const segment = 1 / Math.max(total, 1);\n  const start = index * segment;\n  const end = Math.min(start + segment, 1);\n  const entryStart = Math.max(0, start - segment);\n  const entryEnd =\n    index === 0\n      ? 0.0001\n      : Math.min(start, entryStart + segment * 0.7);\n  const exitStart = start;\n  const exitEnd = end;\n  const stackedCardGap = Math.min(24, 72 / Math.max(total - 1, 1));\n  const stackedOffset = index * stackedCardGap;\n  const restingOffset = Math.min(index * 12, 34);\n  const restingScale = 1 - Math.min(index * 0.012, 0.035);\n\n  const exitYPercent = useTransform(\n    progress,\n    [exitStart, exitEnd],\n    reduceMotion ? [0, 0] : [0, -118],\n  );\n  const exitStackOffset = useTransform(\n    progress,\n    [exitStart, exitEnd],\n    reduceMotion ? [0, 0] : [0, stackedOffset],\n  );\n  const exitY = useMotionTemplate`calc(${exitYPercent}% + ${exitStackOffset}px)`;\n  const rotateX = useTransform(\n    progress,\n    [exitStart, exitEnd],\n    reduceMotion ? [0, 0] : [0, 22],\n  );\n  const opacity = useTransform(\n    progress,\n    [exitStart, exitEnd],\n    reduceMotion ? [1, 0] : [1, 1],\n  );\n  const entryScale = useTransform(\n    progress,\n    [entryStart, entryEnd],\n    index === 0 ? [1, 1] : [restingScale, 1],\n  );\n  const entryY = useTransform(\n    progress,\n    [entryStart, entryEnd],\n    index === 0 ? [0, 0] : [restingOffset, 0],\n  );\n\n  return (\n    \u003cmotion.article\n      className=\"absolute inset-x-0 top-0 aspect-[3/4] will-change-transform sm:aspect-[1.76/1]\"\n      style={{\n        y: exitY,\n        rotateX,\n        opacity,\n        zIndex: total - index,\n        transformOrigin: \"50% 50%\",\n        transformStyle: \"preserve-3d\",\n        backfaceVisibility: \"hidden\",\n      }}\n    >\n      \u003cmotion.div\n        className=\"grid h-full overflow-hidden rounded-[clamp(18px,2vw,30px)] shadow-[0_16px_50px_rgba(20,17,10,0.18)] sm:grid-cols-[1.15fr_0.85fr]\"\n        style={{\n          backgroundColor: item.background,\n          color: item.foreground ?? \"white\",\n          y: entryY,\n          scale: entryScale,\n          transformOrigin: \"50% 100%\",\n        }}\n      >\n        \u003cdiv className=\"flex min-w-0 flex-col p-[clamp(24px,3vw,48px)] md:pr-[clamp(22px,3vw,48px)]\">\n          \u003cdiv className=\"flex items-start\">\n            \u003cspan className=\"text-[clamp(24px,2.5vw,36px)] font-medium leading-none tracking-[-0.06em]\">\n              {item.number ?? String(index + 1).padStart(2, \"0\")}\n            \u003c/span>\n          \u003c/div>\n\n          \u003cdiv className=\"mt-auto max-w-[46rem] pt-8\">\n            \u003cp className=\"mb-[clamp(10px,1.5vw,22px)] text-[10px] font-semibold uppercase tracking-[0.16em] opacity-70 sm:text-xs\">\n              {item.eyebrow}\n            \u003c/p>\n            \u003ch2 className=\"max-w-[16ch] text-balance text-[clamp(28px,3.25vw,48px)] font-semibold leading-[0.96] tracking-[-0.05em]\">\n              {item.title}\n            \u003c/h2>\n            \u003cp className=\"mt-[clamp(16px,1.8vw,24px)] max-w-[42rem] text-[clamp(13px,1.1vw,16px)] leading-[1.5] opacity-82\">\n              {item.description}\n            \u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv className=\"relative m-[clamp(10px,1.2vw,18px)] min-h-[180px] overflow-hidden rounded-[clamp(12px,1.4vw,22px)] sm:ml-0\">\n          \u003cimg\n            src={item.image}\n            alt={item.imageAlt}\n            className=\"h-full w-full object-cover\"\n            loading={index \u003c 2 ? \"eager\" : \"lazy\"}\n            draggable={false}\n          />\n          \u003cdiv className=\"pointer-events-none absolute inset-0 bg-gradient-to-tr from-black/20 via-transparent to-white poster":"/preview-videos/visual-effects/ditheredlogo.webp","video":"/preview-videos/visual-effects/ditheredlogo.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport {\n  type CSSProperties,\n  useCallback,\n  useEffect,\n  useRef,\n  useState,\n} from \"react\";\n\ninterface GrayscaleResult {\n  grayscale: Uint8Array;\n  alpha: Uint8Array;\n  width: number;\n  height: number;\n}\n\ninterface DitherConfig {\n  threshold: number;\n  serpentine: boolean;\n  diffusionStrength: number;\n}\n\ninterface ParticleSystem {\n  count: number;\n  baseX: Float32Array;\n  baseY: Float32Array;\n  offsetX: Float32Array;\n  offsetY: Float32Array;\n  brightness: Float32Array;\n  tint: Float32Array;\n  size: number;\n}\n\ninterface Ripple {\n  x: number;\n  y: number;\n  start: number;\n}\n\nconst DEFAULTS = {\n  gridSize: 200,\n  scale: 0.5,\n  dotScale: 1,\n  invert: true,\n  cornerRadius: 0.2,\n  threshold: 180,\n  contrast: 0,\n  gamma: 1,\n  blur: 3.75,\n  diffusionStrength: 1,\n  serpentine: true,\n};\n\nconst RIPPLE_SPEED = 225;\nconst RIPPLE_WIDTH = 37;\nconst RIPPLE_FORCE = 20;\nconst RIPPLE_DURATION = 675;\nconst CURSOR_RADIUS = 100;\nconst CURSOR_RADIUS_SQ = CURSOR_RADIUS * CURSOR_RADIUS;\nconst CURSOR_FORCE = 40;\nconst LERP_FACTOR = 0.12;\nconst SNAP_THRESHOLD = 0.01;\n\nconst toGrayscaleGrid = (\n  img: HTMLImageElement,\n  maxDim: number,\n  contrast: number,\n  gamma: number,\n  blur: number,\n): GrayscaleResult => {\n  const aspect = img.naturalWidth / img.naturalHeight;\n  const outW = aspect >= 1 ? maxDim : Math.round(maxDim * aspect);\n  const outH = aspect >= 1 ? Math.round(maxDim / aspect) : maxDim;\n  const srcW = img.naturalWidth;\n  const srcH = img.naturalHeight;\n\n  const alphaCanvas = document.createElement(\"canvas\");\n  alphaCanvas.width = outW;\n  alphaCanvas.height = outH;\n  const alphaCtx = alphaCanvas.getContext(\"2d\");\n  if (!alphaCtx) {\n    throw new Error(\"DitheredLogo: unable to create alpha canvas context.\");\n  }\ { grayscale, alpha, width: outW, height: outH };\n};\n\nconst errorDiffusionDither = (\n  grayscale: Uint8Array,\n  width: number,\n  height: number,\n  config: DitherConfig,\n  alpha: Uint8Array,\n): Float32Array => {\n  const errors = new Float32Array(width * height);\n  for (let i = 0; i \u003c grayscale.length; i++) errors[i] = grayscale[i]!;\n\n  const positions: number[] = [];\n  const strength = config.diffusionStrength;\n\n  for (let y = 0; y \u003c height; y++) {\n    const ltr = !config.serpentine || y % 2 === 0;\n    const startX = ltr ? 0 : width - 1;\n    const endX = ltr ? width : -1;\n    const step = ltr ? 1 : -1;\n\n    for (let x = startX; x !== endX; x += step) {\n      const idx = y * width + x;\n      if (alpha[idx]! \u003c 128) continue;\n\n      const oldVal = errors[idx]!;\n      const newVal = oldVal > config.threshold ? 255 : 0;\n      const err = (oldVal - newVal) * strength;\n\n      if (newVal > 0) positions.push(x, y);\n\n      const spread = (nx: number, ny: number, weight: number) => {\n        if (nx \u003c 0 || nx >= width || ny \u003c 0 || ny >= height) return;\n        const ni = ny * width + nx;\n        if (alpha[ni]! \u003c 128) return;\n        errors[ni] = errors[ni]! + err * weight;\n      };\n\n      spread(x + step, y, 7 / 16);\n      spread(x - step, y + 1, 3 / 16);\n      spread(x, y + 1, 5 / 16);\n      spread(x + step, y + 1, 1 / 16);\n    }\n  }\n\n  return new Float32Array(positions);\n};\n\nconst fetchImage = (src: string): Promise\u003cHTMLImageElement> =>\n  new Promise((resolve, reject) => {\n    const img = new Image();\n    img.crossOrigin = \"anonymous\";\n    img.onload = () => resolve(img);\n    img.onerror = reject;\n    img.src = src;\n  });\n\nconst buildRoundedMask = (\n  w: number,\n  h: number,\n  radiusPct: number,\n): Set\u003cnumber> => {\n  const r = Math.round(radiusPct * Math.min(w, h));\n  const mask = new Set\u003cnumber>();\n\n  for (let y = 0; y \u003c h; y++) {\n    for (let x = 0; x \u003c n  ctx: CanvasRenderingContext2D,\n  sys: ParticleSystem,\n  particleColor: string,\n  canvasW: number,\n  canvasH: number,\n  dpr: number,\n) => {\n  ctx.clearRect(0, 0, canvasW * dpr, canvasH * dpr);\n\n  const buckets: number[][] = new Array(126);\n\n  for (let i = 0; i \u003c 126; i++) buckets[i] = [];\n\n  for (let i = 0; i \u003c sys.count; i++) {\n    const bucket =\n      6 * Math.round(20 * sys.brightness[i]!) + Math.round(5 * sys.tint[i]!);\n    buckets[Math.max(0, Math.min(125, bucket))]!.push(i);\n  }\n\n  const size = sys.size * dpr;\n  const pad = 0.25 * dpr;\n  const padSize = 0.5 * dpr;\n\n  for (let z = 0; z \u003c 126; z++) {\n    const ids = buckets[z]!;\n    if (ids.length === 0) continue;\n    const alpha = Math.floor(z / 6) / 20;\n    ctx.fillStyle = particleColor;\n    ctx.globalAlpha = alpha;\n\n    for (let j = 0; j \u003c ids.length; j++) {\n      const i = ids[j]!;\n      const rx = (sys.baseX[i]! + sys.offsetX[i]!) * dpr;\n      const ry = (sys.baseY[i]! + sys.offsetY[i]!) * dpr;\n      ctx.fillRect(rx - pad, ry - pad, size + padSize, size + padSize);\n    }\n  }\n\n  ctx.globalAlpha = 1;\n};\n\nexport interface DitheredLogoProps {\n  imageSrc: string;\n  gridSize?: number;\n  scale?: number;\n  dotScale?: number;\n  invert?: boolean;\n  cornerRadius?: number;\n  threshold?: number;\n  contrast?: number;\n  gamma?: number;\n  blur?: number;\n  diffusionStrength?: number;\n  serpentine?: boolean;\n  particleColor?: string;\n  style?: CSSProperties;\n  className?: string;\n}\n\nexport function DitheredLogo({\n  imageSrc,\n  gridSize = DEFAULTS.gridSize,\n  scale = DEFAULTS.scale,\n  dotScale = DEFAULTS.dotScale,\n  invert = DEFAULTS.invert,\n  cornerRadius = DEFAULTS.cornerRadius,\n  threshold = DEFAULTS.threshold,\n  contrast = DEFAULTS.contrast,\n  gamma = DEFAULTS.gamma,\n  blur = DEFAULTS.blur,\n  diffusionStrength = DEFAULTS.diffusionStrength,\n  serpentine = DEFAULTS.serpentine,\n  particleColor = \"currentColor\",\n  style,\n  className,\n}: DitheredLogoProps) {\n  const canvasRef = useRef\u003cHTMLCanvasElement>(null);\n  const systemRef = useRef\u003cParticleSystem | null>(null);\n  const cursorRef = useRef({ x: 0, y: 0, active: false });\n  const ripplesRef = useRef\u003cRipple[]>([]);\n  const animFrameRef = useRef(0);\n  const runningRef = useRef(false);\n  const prevConfigRef = useRef(\"\");\n  const [isMobile, setIsMobile] = useState(false);\n\n  const resolveParticleColor = useCallback(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return particleColor;\n    return particleColor === \"currentColor\"\n      ? getComputedStyle(canvas).color\n      : particleColor;\n  }, [particleColor]);\n\n  useEffect(() => {\n    const mq = window.matchMedia(\"(max-width: 640px)\");\n    setIsMobile(mq.matches);\n    const handler = (event: MediaQueryListEvent) => setIsMobile(event.matches);\n    mq.addEventListener(\"change\", handler);\n    return () => mq.removeEventListener(\"change\", handler);\n  }, []);\n\n  const startLoop = useCallback(() => {\n    if (runningRef.current) return;\n\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n\n    const ctx = canvas.getContext(\"2d\");\n    if (!ctx) return;\n\n    runningRef.current = true;\n    const dpr = window.devicePixelRatio || 1;\n\n    const tick = () => {\n      const sys = systemRef.current;\n      if (!sys) {\n        runningRef.current = false;\n        return;\n      }\n\n      const rect = canvas.getBoundingClientRect();\n      const needsMore = stepParticles(\n        sys,\n        cursorRef.current.x,\n        cursorRef.current.y,\n        cursorRef.current.active,\n        ripplesRef.current,\n        performance.now(),\n      );\n\n      drawParticles(\n        ctx,\n        sys,\n        resolveParticleColor(),\n        rect.width,\n        rect.height,\n        dpr,\n      );\n\n      if (needsMore) {\n        animFrameRef.current = requestAnimationFrame(tick);\n      } else {\n        runningRef.current = false;\n      }\n    };\n\n    animFrameRef.current = requestAnimationFrame(tick);\n  }, [resolveParticleColor]);\n\n  const rebuild = useCallback(\n    async (src: string) => {\n      const canvas = canvasRef.current;\n      if (!canvas || !src) return;\n\n      try {\n        const img = await fetchImage(src);\n        const rect = canvas.getBoundingClientRect();\n        const processed = toGrayscaleGrid(img, gridSize, contrast, gamma, blur);\n        const { width: gridW, height: gridH } = processed;\n\n        let positions = errorDiffusionDither(\n          processed.grayscale,\n          gridW,\n          gridH,\n          { threshold, serpentine, diffusionStrength },\n          processed.alpha,\n        );\n\n        if (invert) {\n          positions = applyMaskInversion(\n            positions,\n            gridW,\n            gridH,\n            cornerRadius,\n            processed.alpha,\n          );\n        }\n\n        const scaleFactor = Math.max(\n          0.5,\n          (Math.min(rect.width, rect.height) * scale) / Math.max(gridW, gridH),\n        );\n        const originX = Math.round((rect.width - gridW * scaleFactor) / 2);\n        const originY = Math.round((rect.height - gridH * scaleFactor) / 2);\n        const responsiveDotScale = isMobile ? dotScale * 0.8 : dotScale;\n\n        systemRef.current = initParticles(\n          positions,\n          scaleFactor,\n          responsiveDotScale,\n          originX,\n          originY,\n        );\n        startLoop();\n      } catch (error) {\n        console.error(\"DitheredLogo: failed to process image\", error);\n      }\n    },\n    [\n      gridSize,\n      scale,\n      dotScale,\n      invert,\n      cornerRadius,\n      threshold,\n      contrast,\n      gamma,\n      blur,\n      diffusionStrength,\n      serpentine,\n      isMobile,\n      startLoop,\n    ],\n  );\n\n  useEffect(() => {\n    const key = JSON.stringify([\n      imageSrc,\n      gridSize,\n      scale,\n      dotScale,\n      invert,\n      cornerRadius,\n      threshold,\n      contrast,\n      gamma,\n      blur,\n      diffusionStrength,\n      serpentine,\n      isMobile,\n    ]);\n\n    if (key === prevConfigRef.current) return;\n    prevConfigRef.current = key;\n    rebuild(imageSrc);\n  }, [\n    imageSrc,\n    gridSize,\n    scale,\n    dotScale,\n    invert,\n    cornerRadius,\n    threshold,\n    contrast,\n    gamma,\n    blur,\n    diffusionStrength,\n    serpentine,\n    isMobile,\n    rebuild,\n  ]);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n\n    const ctx = canvas.getContext(\"2d\");\n    if (!ctx) return;\n\n    let resizeTimer: ReturnType\u003ctypeof setTimeout> | null = null;\n    let lastW = 0;\n    let lastH = 0;\n\n    const handleResize = () => {\n      const rect = canvas.getBoundingClientRect();\n      const dpr = window.devicePixelRatio || 1;\n      canvas.width = Math.max(1, Math.round(rect.width * dpr));\n      canvas.height = Math.max(1, Math.round(rect.height * dpr));\n\n      const sys = systemRef.current;\n      if (sys) {\n        drawParticles(\n          ctx,\n          sys,\n          resolveParticleColor(),\n          rect.width,\n          rect.height,\n          dpr,\n        );\n      }\n\n      const w = Math.round(rect.width);\n      const h = Math.round(rect.height);\n      if (lastW !== 0 && (w !== lastW || h !== lastH)) {\n        if (resizeTimer) clearTimeout(resizeTimer);\n        resizeTimer = setTimeout(() => rebuild(imageSrc), 200);\n      }\n      lastW = w;\n      lastH = h;\n    };\n\n    const onPointerMove = (event: PointerEvent) => {\n      const rect = canvas.getBoundingClientRect();\n      cursorRef.current.x = event.clientX - rect.left;\n      cursorRef.current.y = event.clientY - rect.top;\n      cursorRef.current.active = true;\n      startLoop();\n    };\n\n    const onPointerLeave = (event: PointerEvent) => {\n      if (event.pointerType !== \"mouse\") return;\n      cursorRef.current.active = false;\n      startLoop();\n    };\n\n    const onPointerCancel = () => {\n      cursorRef.current.active = false;\n      startLoop();\n    };\n\n    const onPointerUp = (event: PointerEvent) => {\n      const rect = canvas.getBoundingClientRect();\n      ripplesRef.current.push({\n        x: event.clientX - rect.left,\n        y: event.clientY - rect.top,\n        start: performance.now(),\n      });\n\n      if (event.pointerType !== \"mouse\") cursorRef.current.active = false;\n      startLoop();\n    };\n\n    handleResize();\n    const resizeObserver = new ResizeObserver(handleResize);\n    const themeObserver = new MutationObserver(() => handleResize());\n    resizeObserver.observe(canvas);\n    themeObserver.observe(document.documentElement, {\n      attributes: true,\n      attributeFilter: [\"class\", \"style\"],\n    });\n    canvas.addEventListener(\"pointermove\", onPointerMove);\n    canvas.addEventListener(\"pointerleave\", onPointerLeave);\n    canvas.addEventListener(\"pointercancel\", onPointerCancel);\n    canvas.addEventListener(\"pointerup\", onPointerUp);\n\n    return () => {\n      cancelAnimationFrame(animFrameRef.current);\n      runningRef.current = false;\n      if (resizeTimer) clearTimeout(resizeTimer);\n      resizeObserver.disconnect();\n      themeObserver.disconnect();\n      canvas.removeEventListener(\"pointermove\", onPointerMove);\n      canvas.removeEventListener(\"pointerleave\", onPointerLeave);\n      canvas.removeEventListener(\"pointercancel\", onPointerCancel);\n      canvas.removeEventListener(\"pointerup\", onPointerUp);\n    };\n  }, [startLoop, rebuild, imageSrc, resolveParticleColor]);\n\n  return (\n    \u003cdiv\n      className={cn(\"relative h-60 w-60 text-black\", className)}\n      style={{\n        ...style,\n      }}\n    >\n      \u003ccanvas\n        ref={canvasRef}\n        className=\"absolute inset-0 block h-full w-full touch-none\"\n      />\n    \u003c/div>\n  );\n}\n\nexport default DitheredLogo;\n","filename":"dithered-logo.tsx","install":"pnpm dlx shadcn@latest add @componentry/dithered-logo","posterData":"/assets/embedded/2d1202399df6d30f047ab764e46934d498665ff6c00da99ab374e38b315944be.webp"},{"slug":"sticky-scroll-cards","title":"Sticky Scroll Cards","description":"A scroll-driven card stack where images pin and scale as you scroll, creating a layered depth effect.","category":"Components","poster":"/preview-videos/component-animations/stickyscrollcards.webp","video":"/preview-videos/component-animations/stickyscrollcards.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport {\n  useReducedMotion,\n  useScroll,\n  useTransform,\n  motion,\n} from \"framer-motion\";\nimport ReactLenis from \"lenis/react\";\nimport { useRef } from \"react\";\n\nexport interface StickyScrollCardItem {\n  title: string;\n  src: string;\n}\n\ninterface StickyScrollCardsProps {\n  /** Array of card items, each with a title and image src URL */\n  cards?: StickyScrollCardItem[];\n  /** Hint label shown above the stack */\n  hint?: string;\n  /** Additional CSS classes for the outer container */\n  className?: string;\n}\n\nconst DEFAULT_CARDS: StickyScrollCardItem[] = [\n  {\n    title: \"Misty Alps\",\n    src: \"https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1200&q=85\",\n  },\n  {\n    title: \"Sunlit Grove\",\n    src: \"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1200&q=85\",\n  },\n  {\n    title: \"Turquoise Shore\",\n    src: \"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=85\",\n  },\n  {\n    title: \"Mountain Pass\",\n    src: \"https://images.unsplash.com/photo-1482938289607-e9573fc25ebb?w=1200&q=85\",\n  },\n  {\n    title: \"Rolling Hills\",\n    src: \"https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1200&q=85\",\n  },\n];\n\nconst TILT_PATTERN = [-1.25, 0.85, -0.65, 1.35, -0.9];\n\nfunction StackCard({\n  card,\n  index,\n  total,\n  container,\n  reduceMotion,\n}: {\n  card: StickyScrollCardItem;\n  index: number;\n  total: number;\n  container: React.RefObject\u003cHTMLDivElement | null>;\n  reduceMotion: boolean;\n}) {\n  const { scrollYProgress } = useScroll({\n    target: container,\n    offset: [\"start start\", \"end end\"],\n  });\n  const start = total > 1 ? index / (total + 1) : 0;\n  const restingScale = Math.max(0.56, 1 - (total - index - 1) * 0.095);\n  const scale = useTransform(\n    scrollYProgress,\n    [start, 1],\n    reduceMotion ? [1, 1] : [1, restingScale],\n  );\n\n  return (\n    \u003csection className=\"sticky top-0 grid h-screen place-items-center\">\n      \u003cmotion.figure\n        className=\"relative m-0 origin-top overflow-hidden rounded bg-white text-neutral-950\"\n        style={{\n          scale,\n          rotate: reduceMotion ? 0 : TILT_PATTERN[index % TILT_PATTERN.length],\n          top: `calc(-5vh + ${160 + index * 22}px)`,\n          boxShadow:\n            \"0 2px 5px rgb(0 0 0 / 0.06), 0 18px 48px rgb(0 0 0 / 0.13)\",\n        }}\n      >\n        \u003cdiv className=\"p-2.5 pb-0\">\n          \u003cimg\n            src={card.src}\n            alt={card.title}\n            className=\"block h-[clamp(210px,32vw,290px)] w-[min(78vw,460px)] object-cover\"\n            loading={index \u003c 2 ? \"eager\" : \"lazy\"}\n            draggable={false}\n          />\n        \u003c/div>\n        \u003cfigcaption className=\"grid h-11 place-items-center px-4 text-[11px] font-medium uppercase tracking-[0.18em] text-neutral-400\">\n          {card.title}\n        \u003c/figcaption>\n      \u003c/motion.figure>\n    \u003c/section>\n  );\n}\n\nexport function StickyScrollCards({\n  cards = DEFAULT_CARDS,\n  hint = \"scroll to explore\",\n  className,\n}: StickyScrollCardsProps) {\n  const container = useRef\u003cHTMLDivElement>(null);\n  const reduceMotion = useReducedMotion() ?? false;\n\n  const content = (\n    \u003cmain\n      ref={container}\n      className={cn(\n        \"relative flex w-full flex-col items-center pb-[100vh] pt-[50vh]\",\n        className,\n      )}\n    >\n      \u003cdiv className=\"absolute left-1/2 top-[8%] flex -translate-x-1/2 flex-col items-center gap-3\">\n        \u003cp className=\"text-[10px] font-medium uppercase tracking-[0.2em] opacity-30\">\n          {hint}\n        \u003c/p>\n        \u003cspan className=\"h-12 w-px bg-gradient-to-b from-foreground/30 to-transparent\" />\n      \u003c/div>\n\n      {cards.map((card, index) => (\n        \u003cStackCard\n          key={`${card.src}-${index}`}\n          card={card}\n          index={index}\n          total={cards.length}\n          container={container}\n          reduceMotion={reduceMotion}\n        />\n      ))}\n    \u003c/main>\n  );\n\n  return reduceMotion ? content : \u003cReactLenis root>{content}\u003c/ReactLenis>;\n}\n","filename":"sticky-scroll-cards.tsx","install":"pnpm dlx shadcn@latest add @componentry/sticky-scroll-cards","posterData":"/assets/embedded/190250c3582bd8f9db80b21d3a07154b79e0271c2c0dc623d3b094a5d69a6f44.webp"},{"slug":"music-player","title":"Music Player","description":"A fun interactive vinyl record music player with swinging tonearm.","category":"Components","poster":"/preview-videos/component-animations/musicplayer.webp","video":"/preview-videos/component-animations/musicplayer.mp4","source":"\"use client\";\n\nimport React, { useRef, useState, useEffect } from \"react\";\nimport { cn } from \"@/lib/utils\";\nimport { motion } from \"framer-motion\";\n\nexport interface MusicPlayerProps extends React.HTMLAttributes\u003cHTMLDivElement> {\n  /** The source URL of the audio file or YouTube video */\n  src: string;\n  /** The URL of the album cover image */\n  coverArt: string;\n  /** Whether to auto-play the audio when loaded */\n  autoPlay?: boolean;\n}\n\nexport function MusicPlayer({\n  className,\n  src,\n  coverArt,\n  autoPlay = false,\n  ...props\n}: MusicPlayerProps) {\n  const [isPlaying, setIsPlaying] = useState(autoPlay);\n  const audioRef = useRef\u003cHTMLAudioElement | null>(null);\n  const iframeRef = useRef\u003cHTMLIFrameElement | null>(null);\n\n  // Extract YouTube ID if it's a YouTube URL\n  const getYoutubeId = (url: string) => {\n    const match = url.match(\n      /(?:youtu\\.be\\/|youtube\\.com\\/(?:embed\\/|v\\/|watch\\?v=|watch\\?.+&v=))([^&?]+)/\n    );\n    return match ? match[1] : null;\n  };\n  \n  const youtubeId = src ? getYoutubeId(src) : null;\n\n  useEffect(() => {\n    if (isPlaying) {\n      if (youtubeId && iframeRef.current?.contentWindow) {\n        iframeRef.current.contentWindow.postMessage(\n          JSON.stringify({ event: \"command\", func: \"playVideo\", args: [] }),\n          \"*\"\n        );\n      } else {\n        audioRef.current?.play().catch(() => setIsPlaying(false));\n      }\n    } else {\n      if (youtubeId && iframeRef.current?.contentWindow) {\n        iframeRef.current.contentWindow.postMessage(\n          JSON.stringify({ event: \"command\", func: \"pauseVideo\", args: [] }),\n          \"*\"\n        );\n      } else {\n        audioRef.current?.pause();\n      }\n    }\n  }, [isPlaying, youtubeId]);\n\n  const togglePlay = () => {\n    setIsPlaying(!isPlaying);\n  };\n\n  return (\n    \u003cdiv\n      className={cn(\"relative inline-flex flex-col items-center\", className)}\n      {...props}\n    >\n      {youtubeId ? (\n        \u003ciframe\n          ref={iframeRef}\n          className=\"hidden\"\n          src={`https://www.youtube.com/embed/${youtubeId}?enablejsapi=1&autoplay=${\n            autoPlay ? 1 : 0\n          }&controls=0`}\n          allow=\"autoplay\"\n        />\n      ) : (\n        \u003caudio\n          ref={audioRef}\n          src={src}\n          onEnded={() => setIsPlaying(false)}\n          className=\"hidden\"\n        />\n      )}\n\n      \u003cdiv\n        className=\"relative cursor-pointer select-none h-64 w-64 md:h-80 md:w-80\"\n        onClick={togglePlay}\n        title={isPlaying ? \"Pause\" : \"Play\"}\n      >\n        {/* Tonearm */}\n        \u003cmotion.div\n          className=\"absolute z-20 top-[-5%] right-[-10%] sm:top-[-8%] sm:right-[-15%] origin-top-right w-[60%] h-[15%] pointer-events-none\"\n          initial={{ rotate: 10 }}\n          animate={{ rotate: isPlaying ? -20 : 10 }}\n          transition={{ duration: 0.5, ease: \"easeInOut\" }}\n        >\n          {/* Tonearm base */}\n          \u003cdiv className=\"absolute top-0 right-0 w-8 h-8 md:w-10 md:h-10 rounded-full bg-zinc-400 dark:bg-zinc-600 shadow-md transform translate-x-1/2 -translate-y-1/2 border-4 border-zinc-200 dark:border-zinc-800 z-10\" />\n          {/* Tonearm stick & Needle */}\n          \u003cdiv className=\"absolute top-0 right-[10px] sm:right-[15px] w-[90%] h-2 md:h-3 bg-zinc-400 dark:bg-zinc-500 rounded-full origin-right -rotate-12 shadow-sm flex items-center justify-start\">\n            {/* Needle */}\n            \u003cdiv className=\"w-4 h-4 md:w-5 md:h-5 bg-zinc-800 dark:bg-zinc-300 rounded-full shadow-md transform -translate-x-1/2\" />\n          \u003c/div>\n        \u003c/motion.div>\n\n        {/* Record Disc */}\n        \u003cdiv\n          className={cn(\n            \"relative w-full h-full rounded-full border-4 sm:border-8 border-black/10 dark:border-white/10 shadow-xl overflow-hidden shadow-black/30 bg-black animate-spin\"\n          )}\n          style={{\n            animationDuration: \"4s\",\n            animationPlayState: isPlaying ? \"running\" : \"paused\",\n          }}\n        >\n          {/* Album Cover Background */}\n          \u003cdiv\n            className=\"absolute inset-0 bg-cover bg-center opacity-90 transition-opacity\"\n            style={{ backgroundImage: `url(${coverArt})` }}\n          />\n\n          {/* Grooves Overlay (Multiple dark gradient rings) */}\n          \u003cdiv\n            className=\"absolute inset-0 rounded-full border border-black/20\"\n            style={{\n              background:\n                \"radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 21%, transparent 22%, transparent 35%, rgba(0,0,0,0.5) 36%, transparent 37%, transparent 50%, rgba(0,0,0,0.3) 51%, transparent 52%, transparent 65%, rgba(0,0,0,0.6) 66%, transparent 67%, transparent 80%, rgba(0,0,0,0.4) 81%, transparent 82%)\",\n            }}\n          />\n\n          {/* Glare effect */}\n          \u003cdiv\n            className=\"absolute inset-0 rounded-full pointer-events-none\"\n            style={{\n              background:\n                \"linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.2) 100%)\",\n            }}\n          />\n\n          {/* Center Hole and Label Area */}\n          \u003cdiv className=\"absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-1/3 h-1/3 rounded-full bg-zinc-900 border border-zinc-700 shadow-inner flex items-center justify-center\">\n            {/* The very center pin hole */}\n            \u003cdiv className=\"w-3 h-3 md:w-4 md:h-4 bg-zinc-300 dark:bg-zinc-600 rounded-full shadow-inner border border-black/40\" />\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  );\n}\n","filename":"music-player.tsx","install":"pnpm dlx shadcn@latest add @componentry/music-player","posterData":"/assets/embedded/9976a79b7cede8bba68f5878cde671ca408041759e88a8fd34033237ecab0a96.webp"},{"slug":"scroll-split-card","title":"Scroll Split Card","description":"A scroll-driven interactive card that splits into three panels and flips.","category":"Components","poster":"/preview-videos/component-animations/scrollsplitcard.webp","video":"/preview-videos/component-animations/scrollsplitcard.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { motion, useScroll, useTransform, useMotionTemplate } from \"framer-motion\";\nimport { useRef } from \"react\";\n\ninterface ScrollSplitCardItem {\n  title: string;\n  description: string;\n  bgColor: string;\n  textColor: string;\n  icon?: React.ReactNode;\n}\n\ninterface ScrollSplitCardProps {\n  className?: string;\n  imageSrc: string;\n  cards: ScrollSplitCardItem[];\n  containerRef?: React.RefObject\u003cHTMLElement | null>;\n}\n\nexport function ScrollSplitCard({\n  className,\n  imageSrc,\n  cards,\n  containerRef: externalContainerRef,\n}: ScrollSplitCardProps) {\n  const containerRef = useRef\u003cHTMLDivElement>(null);\n\n  const { scrollYProgress } = useScroll({\n    target: containerRef,\n    container: externalContainerRef,\n    offset: [\"start start\", \"end end\"],\n  });\n\n  // Stage 1 to 2: Separation (0 to 0.4), then Stage 2 to 3: Overlap closer (0.4 to 0.8)\n  const leftX = useTransform(scrollYProgress, [0, 0.4, 0.8], [0, -48, -24]);\n  const rightX = useTransform(scrollYProgress, [0, 0.4, 0.8], [0, 48, 24]);\n  const scale = useTransform(scrollYProgress, [0, 0.4], [1, 0.9]);\n\n  // Stage 2 to 3: Flip (0.4 to 0.8)\n  const rotateY = useTransform(scrollYProgress, [0.4, 0.8], [0, 180]);\n  // Due to 180deg Y flip, positive Z becomes visual counter-clockwise, negative Z becomes visual clockwise\n  const rotateZLeft = useTransform(scrollYProgress, [0.4, 0.8], [0, 6]);\n  const rotateZRight = useTransform(scrollYProgress, [0.4, 0.8], [0, -6]);\n\n  // Dynamic borders/radii so it looks like ONE flat image initially\n  const borderRadiusLeft = useTransform(scrollYProgress, [0, 0.2], [\"16px 0px 0px 16px\", \"16px 16px 16px 16px\"]);\n  const borderRadiusMiddle = useTransform(scrollYProgress, [0, 0.2], [\"0px 0px 0px 0px\", \"16px 16px 16px 16px\"]);\n  const borderRadiusRight = useTransform(scrollYProgress, [0, 0.2], [\"0px 16px 16px 0px\", \"16px 16px 16px 16px\"]);\n  const borderOpacity = useTransform(scrollYProgress, [0, 0.2], [0, 0.2]);\n  const shadowOpacity = useTransform(scrollYProgress, [0, 0.2], [0, 0.4]);\n  const boxShadow = useMotionTemplate`inset 0 1px 1px rgba(255, 255, 255, ${borderOpacity}), inset 0 -24px 48px rgba(0, 0, 0, ${shadowOpacity}), 0 25px 50px -12px rgba(0, 0, 0, ${shadowOpacity})`;\n\n  // Cards move up in the last viewport\n  const cardsY = useTransform(scrollYProgress, [0.8, 1], [0, -200]);\n\n  // Text appearance at the end in the sticky viewport\n  const textOpacity = useTransform(scrollYProgress, [0.8, 1], [0, 1]);\n  const textY = useTransform(scrollYProgress, [0.8, 1], [40, 0]);\n\n  // Indicator text appearance at the start\n  const startTextOpacity = useTransform(scrollYProgress, [0, 0.1], [1, 0]);\n  const startTextY = useTransform(scrollYProgress, [0, 0.1], [0, 20]);\n\n  return (\n    \u003cdiv\n      ref={containerRef}\n      className={cn(\"relative h-[500vh] w-full\", className)}\n    >\n      \u003cdiv className=\"sticky top-0 flex h-screen w-full items-center justify-center overflow-hidden [perspective:1200px]\">\n        {/* Starting Text indicator */}\n        \u003cmotion.div\n          className=\"absolute top-[20%] left-0 right-0 text-center\"\n          style={{\n            opacity: startTextOpacity,\n            y: startTextY,\n          }}\n        >\n          \u003cp className=\"text-sm font-medium tracking-widest text-foreground/50 uppercase\">\n            Scroll down\n          \u003c/p>\n        \u003c/motion.div>\n\n        \u003cmotion.div\n          style={{ scale, y: cardsY, transformStyle: \"preserve-3d\" }}\n          className=\"flex h-[400px] w-full max-w-4xl px-4 relative\"\n        >\n          {cards.slice(0, 3).map((card, i) => (\n            \u003cmotion.div\n              key={i}\n              className=\"relative h-full flex-1\"\n              style={{\n                x: i === 0 ? leftX : i === 2 ? rightX : 0,\n                rotateY,\n                rotateZ: i === 0 ? rotateZLeft : i === 2 ? rotateZRight : 0,\n                zIndex: i, // Ensures Left is under Middle, and Right is above Middle\n                transformStyle: \"preserve-3d\",\n              }}\n            >\n              {/* Front Side: Original Image Split */}\n              \u003cmotion.div\n                className=\"absolute inset-0 overflow-hidden [backface-visibility:hidden]\"\n                style={{\n                  zIndex: 2, // Ensure front stays above initially\n                  borderRadius: i === 0 ? borderRadiusLeft : i === 2 ? borderRadiusRight : borderRadiusMiddle,\n                  boxShadow,\n                }}\n              >\n                \u003cdiv\n                  className=\"absolute inset-0 h-full w-[300%]\"\n                  style={{\n                    left: `${-100 * i}%`,\n                    backgroundImage: `url(${imageSrc})`,\n                    backgroundSize: \"100% 100%\",\n                    backgroundPosition: \"center\",\n                  }}\n                />\n              \u003c/motion.div>\n\n              {/* Back Side: New Content Card */}\n              \u003cmotion.div\n                className={cn(\n                  \"absolute inset-0 overflow-hidden flex flex-col justify-end p-8 [backface-visibility:hidden] will-change-transform\",\n                  \"border border-white/5 bg-gradient-to-br from-white/10 to-transparent\",\n                  \"shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),inset_0_-24px_48px_rgba(0,0,0,0.2)]\"\n                )}\n                style={{\n                  backgroundColor: card.bgColor,\n                  color: card.textColor,\n                  transform: \"rotateY(180deg)\",\n                  zIndex: 1, // Ensure back is behind before flip\n                  borderRadius: i === 0 ? borderRadiusLeft : i === 2 ? borderRadiusRight : borderRadiusMiddle,\n                  boxShadow,\n                }}\n              >\n                {/* Grainy Noise Overlay */}\n                \u003cdiv\n                  className=\"pointer-events-none absolute inset-0 opacity-20 mix-blend-overlay\"\n                  style={{\n                    backgroundImage: `url(\"https://framerusercontent.com/images/6mcf62RlDfRfU61Yg5vb2pefpi4.png?width=256&height=256\")`,\n                    backgroundRepeat: \"repeat\",\n                  }}\n                />\n\n                \u003cdiv className=\"relative z-10 mb-auto\">{card.icon}\u003c/div>\n                \u003ch3 className=\"relative z-10 mb-4 text-2xl font-medium leading-tight\">\n                  {card.title}\n                \u003c/h3>\n                \u003cp className=\"relative z-10 text-sm opacity-80\">{card.description}\u003c/p>\n              \u003c/motion.div>\n            \u003c/motion.div>\n          ))}\n        \u003c/motion.div>\n\n        {/* Ending Text fixed in the sticky viewport */}\n        \u003cmotion.div\n          className=\"absolute bottom-[20%] left-0 right-0 text-center\"\n          style={{\n            opacity: textOpacity,\n            y: textY,\n          }}\n        >\n          \u003cp className=\"text-3xl font-medium tracking-tight text-foreground/80 font-serif italic\">\n            So cool, right?\n          \u003c/p>\n        \u003c/motion.div>\n      \u003c/div>\n    \u003c/div>\n  );\n}\n","filename":"scroll-split-card.tsx","install":"pnpm dlx shadcn@latest add @componentry/scroll-split-card","posterData":"/assets/embedded/180bbad1f7e676efec590a011bb09792e644c74d1a07010002cb60a2ac567539.webp"},{"slug":"hover-transition","title":"Hover Transition","description":"Eight polished hover transitions with per-card animation, direction, color, and content controls.","category":"Components","poster":"/preview-videos/component-animations/hovertransition.webp","video":"/preview-videos/component-animations/hovertransition.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\nexport const hoverTransitionEffects = [\n  \"wipe\",\n  \"ripple\",\n  \"parallax\",\n  \"curtain\",\n  \"diagonal\",\n  \"morph\",\n  \"strips\",\n  \"slide\",\n] as const;\n\nexport const hoverTransitionDirections = [\n  \"top\",\n  \"right\",\n  \"bottom\",\n  \"left\",\n  \"top-left\",\n  \"top-right\",\n  \"bottom-right\",\n  \"bottom-left\",\n  \"center\",\n] as const;\n\nexport type HoverTransitionEffect = (typeof hoverTransitionEffects)[number];\nexport type HoverTransitionDirection =\n  (typeof hoverTransitionDirections)[number];\n\nexport interface HoverTransitionProps extends Omit\u003c\n  React.HTMLAttributes\u003cHTMLDivElement>,\n  \"children\"\n> {\n  defaultComponent?: React.ReactNode;\n  hoverComponent?: React.ReactNode;\n  effect?: HoverTransitionEffect;\n  direction?: HoverTransitionDirection;\n  duration?: number;\n  easing?: string;\n  label?: string;\n}\n\ntype Vector = { x: number; y: number };\n\nconst directionVectors: Record\u003cHoverTransitionDirection, Vector> = {\n  top: { x: 0, y: -1 },\n  right: { x: 1, y: 0 },\n  bottom: { x: 0, y: 1 },\n  left: { x: -1, y: 0 },\n  \"top-left\": { x: -1, y: -1 },\n  \"top-right\": { x: 1, y: -1 },\n  \"bottom-right\": { x: 1, y: 1 },\n  \"bottom-left\": { x: -1, y: 1 },\n  center: { x: 0, y: 0 },\n};\n\nconst rippleOrigins: Record\u003cHoverTransitionDirection, string> = {\n  top: \"50% 0%\",\n  right: \"100% 50%\",\n  bottom: \"50% 100%\",\n  left: \"0% 50%\",\n  \"top-left\": \"0% 0%\",\n  \"top-right\": \"100% 0%\",\n  \"bottom-right\": \"100% 100%\",\n  \"bottom-left\": \"0% 100%\",\n  center: \"50% 50%\",\n};\n\nfunction hiddenInset(direction: HoverTransitionDirection) {\n  switch (direction) {\n    case \"top\":\n      return \"inset(0 0 100% 0)\";\n    case \"right\":\n      return \"inset(0 0 0 100%)\";\n    case \"bottom\":\n      return \"inset(100% 0 0 0)\";\n    case \"left\":\n      return \"inset(0 100% 0 0)\";\n    case \"top-left\":\n      return \"inset(0 100% 100% 0)\";\n    case \"top-right\":\n      return \"inset(0 0 100% 100%)\";\n    case \"bottom-right\":\n      return \"inset(100% 0 0 100%)\";\n    case \"bottom-left\":\n      return \"inset(100% 100% 0 0)\";\n    default:\n      return \"inset(50%)\";\n  }\n}\n\nfunction usePrefersReducedMotion() {\n  const [reduced, setReduced] = React.useState(false);\n\n  React.useEffect(() => {\n    const media = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n    const update = () => setReduced(media.matches);\n    update();\n    media.addEventListener(\"change\", update);\n    return () => media.removeEventListener(\"change\", update);\n  }, []);\n\n  return reduced;\n}\n\nfunction FallbackCard({ hover = false }: { hover?: boolean }) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"relative flex h-full min-h-64 w-full flex-col justify-between overflow-hidden p-5 text-white\",\n        hover\n          ? \"bg-[radial-gradient(circle_at_75%_20%,#dfff63_0,transparent_26%),linear-gradient(145deg,#292929,#080808)]\"\n          : \"bg-[radial-gradient(circle_at_20%_15%,#4f5dff_0,transparent_30%),linear-gradient(145deg,#1d2230,#07080b)]\",\n      )}\n    >\n      \u003cdiv className=\"flex items-center gap-2 font-mono text-xs uppercase tracking-[0.18em] text-white/70\">\n        \u003cspan className=\"size-2 bg-[#dfff63]\" />\n        {hover ? \"Hover\" : \"Default\"}\n      \u003c/div>\n      \u003cdiv>\n        \u003cp className=\"text-3xl font-medium tracking-[-0.04em]\">\n          {hover ? \"New perspective\" : \"Hover this card\"}\n        \u003c/p>\n        \u003cp className=\"mt-1 text-sm text-white/60\">Hover Transition\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  );\n}\n\nfunction Layer({\n  children,\n  style,\n  className,\n}: {\n  children: React.ReactNode;\n  style?: React.CSSProperties;\n  className?: string;\n}) {\n  return (\n    \u003cdiv\n      aria-hidden=\"true\"\n      className={cn(\"pointer-events-none absolute inset-0\", className)}\n      style={style}\n    >\n      {children}\n    \u003c/div>\n  );\n}\n\nexport function HoverTransition({\n  defaultComponent,\n  hoverComponent,\n  effect = \"wipe\",\n  direction = \"right\",\n  duration = 0.72,\n  easing = \"cubic-bezier(0.22, 1, 0.36, 1)\",\n  label = \"Interactive hover transition\",\n  className,\n  onMouseEnter,\n  onMouseLeave,\n  onFocus,\n  onBlur,\n  onPointerMove,\n  onPointerLeave,\n  tabIndex,\n  ...props\n}: HoverTransitionProps) {\n  const rootRef = React.useRef\u003cHTMLDivElement>(null);\n  const [active, setActive] = React.useState(false);\n  const reducedMotion = usePrefersReducedMotion();\n  const vector = directionVectors[direction];\n  const perceivedDurationScale =\n    effect === \"diagonal\" || effect === \"ripple\" ? 1.25 : 1;\n  const seconds = reducedMotion\n    ? 0\n    : Math.max(0, duration) * perceivedDurationScale;\n  const before = defaultComponent ?? \u003cFallbackCard />;\n  const after = hoverComponent ?? \u003cFallbackCard hover />;\n  const distanceX = vector.x * 100;\n  const distanceY = vector.y * 100;\n\n  const transitionFor = (properties: string[], delay = 0, durationScale = 1) =>\n    properties\n      .map(\n        (property) =>\n          `${property} ${seconds * durationScale}s ${easing} ${reducedMotion ? 0 : delay}s`,\n      )\n      .join(\", \");\n\n  const layerTransition = transitionFor([\n    \"clip-path\",\n    \"transform\",\n    \"opacity\",\n    \"filter\",\n    \"border-radius\",\n  ]);\n\n  const activate = (event: React.MouseEvent\u003cHTMLDivElement>) => {\n    setActive(true);\n    onMouseEnter?.(event);\n  };\n  const deactivate = (event: React.MouseEvent\u003cHTMLDivElement>) => {\n    setActive(false);\n    onMouseLeave?.(event);\n  };\n\n  const resetTilt = () => {\n    const element = rootRef.current;\n    if (!element) return;\n    element.style.setProperty(\"--hover-tilt-x\", \"0deg\");\n    element.style.setProperty(\"--hover-tilt-y\", \"0deg\");\n  };\n\n  const trackPointer = (event: React.PointerEvent\u003cHTMLDivElement>) => {\n    onPointerMove?.(event);\n    if (reducedMotion || event.pointerType !== \"mouse\") return;\n\n    const bounds = event.currentTarget.getBoundingClientRect();\n    const x = Math.min(\n      1,\n      Math.max(0, (event.clientX - bounds.left) / bounds.width),\n    );\n    const y = Math.min(\n      1,\n      Math.max(0, (event.clientY - bounds.top) / bounds.height),\n    );\n    const maxTilt = 2.4;\n\n    event.currentTarget.style.setProperty(\n      \"--hover-tilt-x\",\n      `${((0.5 - y) * maxTilt).toFixed(2)}deg`,\n    );\n    event.currentTarget.style.setProperty(\n      \"--hover-tilt-y\",\n      `${((x - 0.5) * maxTilt).toFixed(2)}deg`,\n    );\n    event.currentTarget.style.setProperty(\n      \"--hover-glare-x\",\n      `${(x * 100).toFixed(1)}%`,\n    );\n    event.currentTarget.style.setProperty(\n      \"--hover-glare-y\",\n      `${(y * 100).toFixed(1)}%`,\n    );\n  };\n\n  const hoverLayer = (style: React.CSSProperties) => (\n    \u003cLayer style={{ transition: layerTransition, ...style }}>{after}\u003c/Layer>\n  );\n\n  let animatedLayers: React.ReactNode;\n\n  switch (effect) {\n    case \"ripple\":\n      animatedLayers = hoverLayer({\n        clipPath: active\n          ? `circle(150% at ${rippleOrigins[direction]})`\n          : `circle(0% at ${rippleOrigins[direction]})`,\n        filter: active ? \"blur(0px)\" : \"blur(2px)\",\n        transform: active ? \"scale(1)\" : \"scale(1.035)\",\n        transformOrigin: rippleOrigins[direction],\n      });\n      break;\n    case \"parallax\":\n      animatedLayers = (\n        \u003c>\n          \u003cLayer\n            style={{\n              transform: active\n                ? `translate3d(${-distanceX * 0.12}%, ${-distanceY * 0.12}%, 0) scale(1.045)`\n                : \"translate3d(0, 0, 0) scale(1)\",\n              filter: active ? \"brightness(.78) saturate(.75)\" : \"none\",\n              transition: transitionFor([\"transform\", \"filter\"]),\n            }}\n          >\n            {before}\n          \u003c/Layer>\n          \u003cLayer\n            style={{\n              clipPath: active ? \"inset(0)\" : hiddenInset(direction),\n              filter: active ? \"blur(0px)\" : \"blur(2px)\",\n              transition: transitionFor([\"clip-path\", \"filter\"]),\n            }}\n          >\n            \u003cdiv\n              className=\"h-full w-full\"\n              style={{\n                transform: active\n                  ? \"translate3d(0, 0, 0) scale(1)\"\n                  : `translate3d(${distanceX * 0.24}%, ${distanceY * 0.24}%, 0) scale(1.07)`,\n                transition: transitionFor([\"transform\"]),\n              }}\n            >\n              {after}\n            \u003c/div>\n          \u003c/Layer>\n        \u003c/>\n      );\n      break;\n    case \"curtain\": {\n      const verticalMotion = vector.y !== 0 || direction === \"center\";\n      animatedLayers = (\n        \u003c>\n          {hoverLayer({\n            opacity: active ? 1 : 0,\n            filter: active ? \"blur(0px)\" : \"blur(3px)\",\n            transform: active ? \"scale(1)\" : \"scale(.96)\",\n          })}\n          \u003cLayer\n            style={{\n              clipPath: verticalMotion\n                ? \"inset(0 0 50% 0)\"\n                : \"inset(0 50% 0 0)\",\n              transform: active\n                ? verticalMotion\n                  ? \"translate3d(0, -100%, 0)\"\n                  : \"translate3d(-100%, 0, 0)\"\n                : \"translate3d(0, 0, 0)\",\n              filter: active ? \"blur(1px)\" : \"blur(0px)\",\n              transition: transitionFor([\"transform\", \"filter\"]),\n            }}\n          >\n            {before}\n          \u003c/Layer>\n          \u003cLayer\n            style={{\n              clipPath: verticalMotion\n                ? \"inset(50% 0 0 0)\"\n                : \"inset(0 0 0 50%)\",\n              transform: active\n                ? verticalMotion\n                  ? \"translate3d(0, 100%, 0)\"\n                  : \"translate3d(100%, 0, 0)\"\n                : \"translate3d(0, 0, 0)\",\n              filter: active ? \"blur(1px)\" : \"blur(0px)\",\n              transition: transitionFor([\"transform\", \"filter\"]),\n            }}\n          >\n            {before}\n          \u003c/Layer>\n        \u003c/>\n      );\n      break;\n    }\n    case \"diagonal\": {\n      const fromLeft = direction.includes(\"left\") || direction === \"left\";\n      const firstClip = fromLeft\n        ? \"polygon(0 0, 100% 0, 100% 100%)\"\n        : \"polygon(0 0, 100% 0, 0 100%)\";\n      const secondClip = fromLeft\n        ? \"polygon(0 0, 100% 100%, 0 100%)\"\n        : \"polygon(100% 0, 100% 100%, 0 100%)\";\n      animatedLayers = (\n        \u003c>\n          {hoverLayer({\n            opacity: active ? 1 : 0,\n            filter: active ? \"blur(0px)\" : \"blur(2px)\",\n            transform: active ? \"scale(1)\" : \"scale(.97)\",\n          })}\n          \u003cLayer\n            style={{\n              clipPath: firstClip,\n              transform: active\n                ? fromLeft\n                  ? \"translate3d(100%, -100%, 0)\"\n                  : \"translate3d(-100%, -100%, 0)\"\n                : \"translate3d(0, 0, 0)\",\n              filter: active ? \"blur(1px)\" : \"blur(0px)\",\n              transition: transitionFor([\"transform\", \"filter\"]),\n            }}\n          >\n            {before}\n          \u003c/Layer>\n          \u003cLayer\n            style={{\n              clipPath: secondClip,\n              transform: active\n                ? fromLeft\n                  ? \"translate3d(-100%, 100%, 0)\"\n                  : \"translate3d(100%, 100%, 0)\"\n                : \"translate3d(0, 0, 0)\",\n              filter: active ? \"blur(1px)\" : \"blur(0px)\",\n              transition: transitionFor([\"transform\", \"filter\"]),\n            }}\n          >\n            {before}\n          \u003c/Layer>\n        \u003c/>\n      );\n      break;\n    }\n    case \"morph\":\n      animatedLayers = hoverLayer({\n        borderRadius: active ? \"0%\" : \"42%\",\n        clipPath: active ? \"inset(0% round 0%)\" : \"inset(43% round 42%)\",\n        filter: active ? \"blur(0px)\" : \"blur(3px)\",\n        opacity: active ? 1 : 0,\n        transform: active\n          ? \"translate3d(0, 0, 0) scale(1) rotate(0deg)\"\n          : `translate3d(${distanceX * 0.04}%, ${distanceY * 0.04}%, 0) scale(.86) rotate(${vector.x \u003c 0 ? -2 : 2}deg)`,\n        transformOrigin: rippleOrigins[direction],\n      });\n      break;\n    case \"strips\": {\n      const vertical = Math.abs(vector.x) >= Math.abs(vector.y);\n      const stripCount = 8;\n      animatedLayers = Array.from({ length: stripCount }, (_, index) => {\n        const start = (index / stripCount) * 100;\n        const end = ((index + 1) / stripCount) * 100;\n        const clipPath = vertical\n          ? `inset(0 ${100 - end}% 0 ${start}%)`\n          : `inset(${start}% 0 ${100 - end}% 0)`;\n        const offsetX = (vector.x || (vector.y === 0 ? 1 : 0)) * 72;\n        const offsetY = vector.y * 72;\n        const staggerIndex = active ? index : stripCount - index - 1;\n        const staggerWindow = seconds * 0.15;\n        const stripDelay =\n          stripCount > 1\n            ? (staggerIndex / (stripCount - 1)) * staggerWindow\n            : 0;\n        return (\n          \u003cLayer\n            key={index}\n            style={{\n              clipPath,\n              filter: active ? \"blur(0px)\" : \"blur(1.5px)\",\n              opacity: active ? 1 : 0,\n              transform: active\n                ? \"translate3d(0, 0, 0)\"\n                : `translate3d(${offsetX}%, ${offsetY}%, 0)`,\n              transition: transitionFor(\n                [\"transform\", \"opacity\", \"filter\"],\n                stripDelay,\n                0.85,\n              ),\n            }}\n          >\n            {after}\n          \u003c/Layer>\n        );\n      });\n      break;\n    }\n    case \"slide\":\n      animatedLayers = (\n        \u003c>\n          \u003cLayer\n            style={{\n              transform: active\n                ? direction === \"center\"\n
