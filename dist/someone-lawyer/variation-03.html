distortionStrength={distortionStrength}\n              waveCount={waveCount}\n              waveSize={waveSize}\n              waveRotationSpeed={waveRotationSpeed}\n              waveFadeMultiplier={waveFadeMultiplier}\n              waveGrowth={waveGrowth}\n              waveSpawnThreshold={waveSpawnThreshold}\n            />\n          \u003c/Canvas>\n        \u003c/WebGLErrorBoundary>\n      )}\n      {children ? (\n        \u003cdiv className=\"pointer-events-none absolute inset-0 z-10\">{children}\u003c/div>\n      ) : null}\n    \u003c/div>\n  );\n}\n\n\n\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface WebGLErrorBoundaryProps {\n  children: React.ReactNode;\n  fallback?: React.ReactNode;\n  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;\n}\n\ninterface WebGLErrorBoundaryState {\n  hasError: boolean;\n}\n\nexport class WebGLErrorBoundary extends React.Component\u003c\n  WebGLErrorBoundaryProps,\n  WebGLErrorBoundaryState\n> {\n  public state: WebGLErrorBoundaryState = { hasError: false };\n\n  static getDerivedStateFromError(): WebGLErrorBoundaryState {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {\n    this.props.onError?.(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback ?? \u003cWebGLFallback />;\n    }\n    return this.props.children;\n  }\n}\n\ninterface WebGLFallbackProps {\n  className?: string;\n  message?: string;\n}\n\nexport function WebGLFallback({\n  className,\n  message = \"Interactive WebGL content is unavailable on this device/browser.\",\n}: WebGLFallbackProps) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"flex h-full w-full items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-900 px-4 text-center text-sm text-white/75\",\n        className,\n      )}\n      role=\"status\"\n      aria-live=\"polite\"\n    >\n      \u003cp>{message}\u003c/p>\n    \u003c/div>\n  );\n}\n","filename":"image-ripple-effect.tsx","install":"pnpm dlx shadcn@latest add @componentry/image-ripple-effect","posterData":"/assets/embedded/247e0d44c872e9748eec9c8d4d8191eea5df581f083ef6cbbb43764df8e6c609.webp"},{"slug":"ripple-transition","title":"Ripple Transition","description":"WebGL image transitions with noisy refractive waves, chromatic edges, glow, and click-triggered ripple origins.","category":"Visual Effects","poster":"/preview-videos/visual-effects/rippletransition.webp","video":"/preview-videos/visual-effects/rippletransition.mp4","source":"\"use client\";\n\nimport {\n  WebGLErrorBoundary,\n  WebGLFallback,\n} from \"@/components/ui/webgl-error-boundary\";\nimport { cn } from \"@/lib/utils\";\nimport {\n  animate,\n  type AnimationPlaybackControls,\n  type Easing,\n} from \"framer-motion\";\nimport * as React from \"react\";\n\nexport interface RippleTransitionProps extends Omit\u003c\n  React.HTMLAttributes\u003cHTMLDivElement>,\n  \"children\" | \"onClick\"\n> {\n  images?: readonly string[];\n  duration?: number;\n  ease?: Easing;\n  autoPlay?: boolean;\n  autoPlayInterval?: number;\n  autoPlayOrigin?: \"center\" | \"random\";\n  waveSpeed?: number;\n  sigma?: number;\n  waveFreq?: number;\n  pushAmt?: number;\n  caStrength?: number;\n  glow?: number;\n  noiseWarp?: number;\n  pinch?: boolean;\n  borderRadius?: number;\n  background?: string;\n  label?: string;\n}\n\nconst sampleImages = [\n  \"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&q=85&w=1800\",\n  \"https://images.unsplash.com/photo-1473773508845-188df298d2d1?auto=format&fit=crop&q=85&w=1800\",\n  \"https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&q=85&w=1800\",\n] as const;\n\ntype RippleSettings = {\n  waveSpeed: number;\n  sigma: number;\n  waveFreq: number;\n  pushAmt: number;\n  caStrength: number;\n  glow: number;\n  noiseWarp: number;\n  pinch: boolean;\n};\n\ntype Picture = { element: HTMLImageElement; width: number; height: number };\n\nconst vertexSource = `\nattribute vec2 position;\nvarying vec2 uv;\nvoid main() {\n  uv = vec2(position.x * .5 + .5, .5 - position.y * .5);\n  gl_Position = vec4(position, 0., 1.);\n}`;\n\nconst fragmentSource = `\nprecision highp float;\nvarying vec2 uv;\nuniform sampler2D fromImage;\nuniform sampler2D toImage;\nuniform vec2 viewport;\nuniform vec2 fromSize;\nuniform vec2 toSize;\nuniform vec2 origin;\nuniform float phase;\nuniform float speed;\nuniform float thickness;\nuniform float frequency;\nuniform float displacement;\nuniform float chroma;\nuniform float highlight;\nuniform float roughness;\nuniform float pinchAmount;\n\nfloat random2(vec2 p) {\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);\n}\n\nfloat smoothNoise(vec2 p) {\n  vec2 cell = floor(p);\n  vec2 local = fract(p);\n  local = local * local * (3. - 2. * local);\n  return mix(\n    mix(random2(cell), random2(cell + vec2(1., 0.)), local.x),\n    mix(random2(cell + vec2(0., 1.)), random2(cell + vec2(1.)), local.x),\n    local.y\n  );\n}\n\nfloat layeredNoise(vec2 p) {\n  return smoothNoise(p) * .57 +\n    smoothNoise(p * 2.07 + 4.3) * .29 +\n    smoothNoise(p * 4.21 - 2.8) * .14;\n}\n\nvec2 cover(vec2 point, vec2 media, vec2 frame) {\n  float mediaRatio = media.x / media.y;\n  float frameRatio = frame.x / frame.y;\n  vec2 crop = frameRatio > mediaRatio\n    ? vec2(1., mediaRatio / frameRatio)\n    : vec2(frameRatio / mediaRatio, 1.);\n  return (point - .5) * crop + .5;\n}\n\nvec3 splitSample(sampler2D image, vec2 size, vec2 point, vec2 split) {\n  return vec3(\n    texture2D(image, cover(point - split, size, viewport)).r,\n    texture2D(image, cover(point, size, viewport)).g,\n    texture2D(image, cover(point + split, size, viewport)).b\n  );\n}\n\nvoid main() {\n  float aspect = viewport.x / viewport.y;\n  vec2 radial = uv - origin;\n  radial.x *= aspect;\n  float distanceFromOrigin = length(radial);\n  float farthest = length(vec2(aspect, 1.));\n  float distance01 = distanceFromOrigin * 2. / farthest;\n  float agitation = (layeredNoise(radial * 9. + phase * 1.8) - .5) * roughness;\n  float boundary = phase * speed;\n  float signedDistance = distance01 + agitation - boundary;\n  float wave = exp(-(signedDistance * signedDistance) / max(.0001, 2. * thickness * thickness));\n  wave *= .55 + .45 * cos(signedDistance * frequency * 6.28318);\n  wave *= smoothstep(0., .08, phase) * (1. - smoothstep(.82, 1., phase));\n\n  vec2 direction = distanceFromOrigin > .0001 ? radial / distanceFromOrigin : vec2(0.);\n  direction.x /= aspect;\n  float centerPull = exp(-distanceFromOrigin * distanceFromOrigin * 45.) * pinchAmount;\n  vec2 offset = direction * (wave * displacement - centerPull * .018);\n  vec2 split = direction * wave * chroma;\n  float reveal = 1. - smoothstep(-.045, .045, signedDistance);\n\n  vec3 before = splitSample(fromImage, fromSize, uv - offset, split);\n  vec3 after = splitSample(toImage, toSize, uv - offset, split);\n  vec3 color = mix(before, after, reveal);\n  color += wave * highlight * .38;\n  color *= 1. - centerPull * .12;\n  gl_FragColor = vec4(clamp(color, 0., 1.), 1.);\n}`;\n\nfunction fetchPictures(sources: readonly string[], signal: AbortSignal) {\n  return Promise.all(\n    sources.map(\n      (source) =>\n        new Promise\u003cPicture | null>((resolve) => {\n          const image = new Image();\n          const finish = (picture: Picture | null) => {\n            image.onload = null;\n            image.onerror = null;\n            resolve(picture);\n          };\n          image.crossOrigin = \"anonymous\";\n          image.onload = () =>\n            finish({\n              element: image,\n              width: image.naturalWidth || 1,\n              height: image.naturalHeight || 1,\n            });\n          image.onerror = () => finish(null);\n          signal.addEventListener(\"abort\", () => finish(null), { once: true });\n          image.src = source;\n        }),\n    ),\n  ).then((pictures) =>\n    pictures.filter((picture): picture is Picture => picture !== null),\n  );\n}\n\nfunction shader(gl: WebGLRenderingContext, type: number, source: string) {\n  const result = gl.createShader(type);\n  if (!result) throw new Error(\"Unable to allocate a WebGL shader.\");\n  gl.shaderSource(result, source);\n  gl.compileShader(result);\n  if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) {\n    const message = gl.getShaderInfoLog(result) ?? \"Shader compilation failed.\";\n    gl.deleteShader(result);\n    throw new Error(message);\n  }\n  return result;\n}\n\nclass RippleRenderer {\n  private gl: WebGLRenderingContext;\n  private program: WebGLProgram;\n  private vertexShader: WebGLShader;\n  private fragmentShader: WebGLShader;\n  private geometry: WebGLBuffer;\n  private textures: [WebGLTexture, WebGLTexture];\n  private textureSlots: [number, number] = [0, 1];\n  private phase = 0;\n  private origin: [number, number] = [0.5, 0.5];\n  private settings: RippleSettings;\n  private sizes: [Picture, Picture];\n\n  constructor(\n    private canvas: HTMLCanvasElement,\n    pictures: Picture[],\n    settings: RippleSettings,\n  ) {\n    const gl = canvas.getContext(\"webgl\", {\n      antialias: true,\n      premultipliedAlpha: false,\n    });\n    if (!gl) throw new Error(\"WebGL is not supported.\");\n    this.gl = gl;\n    this.settings = settings;\n    this.sizes = [pictures[0]!, pictures[1] ?? pictures[0]!];\n    this.vertexShader = shader(gl, gl.VERTEX_SHADER, vertexSource);\n    this.fragmentShader = shader(gl, gl.FRAGMENT_SHADER, fragmentSource);\n    const program = gl.createProgram();\n    if (!program) throw new Error(\"Unable to allocate a WebGL program.\");\n    this.program = program;\n    gl.attachShader(program, this.vertexShader);\n    gl.attachShader(program, this.fragmentShader);\n    gl.linkProgram(program);\n    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n      throw new Error(\n        gl.getProgramInfoLog(program) ?? \"WebGL program link failed.\",\n      );\n    }\n    gl.useProgram(program);\n\n    const geometry = gl.createBuffer();\n    if (!geometry) throw new Error(\"Unable to allocate WebGL geometry.\");\n    this.geometry = geometry;\n    gl.bindBuffer(gl.ARRAY_BUFFER, geometry);\n    gl.bufferData(\n      gl.ARRAY_BUFFER,\n      new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),\n      gl.STATIC_DRAW,\n    );\n    const position = gl.getAttribLocation(program, \"position\");\n    gl.enableVertexAttribArray(position);\n    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);\n    this.textures = [\n      this.makeTexture(0, this.sizes[0].element),\n      this.makeTexture(1, this.sizes[1].element),\n    ];\n    gl.uniform1i(this.location(\"fromImage\"), 0);\n    gl.uniform1i(this.location(\"toImage\"), 1);\n  }\n\n  private location(name: string) {\n    return this.gl.getUniformLocation(this.program, name);\n  }\n\n  private makeTexture(unit: number, image: HTMLImageElement) {\n    const gl = this.gl;\n    const texture = gl.createTexture();\n    if (!texture) throw new Error(\"Unable to allocate a WebGL texture.\");\n    gl.activeTexture(gl.TEXTURE0 + unit);\n    gl.bindTexture(gl.TEXTURE_2D, texture);\n    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);\n    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);\n    return texture;\n  }\n\n  resize(width: number, height: number) {\n    const density = Math.min(2, window.devicePixelRatio || 1);\n    const pixelWidth = Math.max(1, Math.round(width * density));\n    const pixelHeight = Math.max(1, Math.round(height * density));\n    if (\n      this.canvas.width !== pixelWidth ||\n      this.canvas.height !== pixelHeight\n    ) {\n      this.canvas.width = pixelWidth;\n      this.canvas.height = pixelHeight;\n      this.gl.viewport(0, 0, pixelWidth, pixelHeight);\n    }\n    this.draw();\n  }\n\n  configure(settings: RippleSettings) {\n    this.settings = settings;\n    this.draw();\n  }\n\n  begin(x: number, y: number) {\n    this.origin = [x, y];\n    this.phase = 0;\n    this.draw();\n  }\n\n  setPhase(value: number) {\n    this.phase = value;\n    this.draw();\n  }\n\n  advance(picture: Picture, nextIndex: number) {\n    const gl = this.gl;\n    const previousToSlot = this.textureSlots[1];\n    this.textureSlots = [previousToSlot, nextIndex];\n    this.sizes = [this.sizes[1], picture];\n    gl.activeTexture(gl.TEXTURE0 + nextIndex);\n    gl.bindTexture(gl.TEXTURE_2D, this.textures[nextIndex]!);\n    gl.texImage2D(\n      gl.TEXTURE_2D,\n      0,\n      gl.RGBA,\n      gl.RGBA,\n      gl.UNSIGNED_BYTE,\n      picture.element,\n    );\n    gl.uniform1i(this.location(\"fromImage\"), previousToSlot);\n    gl.uniform1i(this.location(\"toImage\"), nextIndex);\n    this.phase = 0;\n    this.draw();\n  }\n\n  draw() {\n    const gl = this.gl;\n    const s = this.settings;\n    gl.useProgram(this.program);\n    gl.uniform2f(\n      this.location(\"viewport\"),\n      this.canvas.width,\n      this.canvas.height,\n    );\n    gl.uniform2f(\n      this.location(\"fromSize\"),\n      this.sizes[0].width,\n      this.sizes[0].height,\n    );\n    gl.uniform2f(\n      this.location(\"toSize\"),\n      this.sizes[1].width,\n      this.sizes[1].height,\n    );\n    gl.uniform2f(this.location(\"origin\"), this.origin[0], this.origin[1]);\n    gl.uniform1f(this.location(\"phase\"), this.phase);\n    gl.uniform1f(this.location(\"speed\"), s.waveSpeed);\n    gl.uniform1f(this.location(\"thickness\"), s.sigma);\n    gl.uniform1f(this.location(\"frequency\"), s.waveFreq);\n    gl.uniform1f(this.location(\"displacement\"), s.pushAmt);\n    gl.uniform1f(this.location(\"chroma\"), s.caStrength);\n    gl.uniform1f(this.location(\"highlight\"), s.glow);\n    gl.uniform1f(this.location(\"roughness\"), s.noiseWarp * 0.09);\n    gl.uniform1f(this.location(\"pinchAmount\"), s.pinch ? 1 : 0);\n    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n  }\n\n  destroy() {\n    const gl = this.gl;\n    this.textures.forEach((texture) => gl.deleteTexture(texture));\n    gl.deleteBuffer(this.geometry);\n    gl.deleteProgram(this.program);\n    gl.deleteShader(this.vertexShader);\n    gl.deleteShader(this.fragmentShader);\n  }\n}\n\nfunction RippleTransitionCanvas({\n  images = sampleImages,\n  duration = 1.4,\n  ease = \"easeInOut\",\n  autoPlay = false,\n  autoPlayInterval = 3200,\n  autoPlayOrigin = \"center\",\n  waveSpeed = 1.6,\n  sigma = 0.15,\n  waveFreq = 5,\n  pushAmt = 0.145,\n  caStrength = 0.02,\n  glow = 0.73,\n  noiseWarp = 1,\n  pinch = false,\n  borderRadius = 24,\n  background = \"#111416\",\n  label = \"Ripple image transition\",\n  className,\n  style,\n  ...props\n}: RippleTransitionProps) {\n  const rootRef = React.useRef\u003cHTMLDivElement>(null);\n  const canvasRef = React.useRef\u003cHTMLCanvasElement>(null);\n  const engineRef = React.useRef\u003cRippleRenderer | null>(null);\n  const playRef = React.useRef\u003c(x?: number, y?: number) => void>(\n    () => undefined,\n  );\n  const settings = React.useMemo\u003cRippleSettings>(\n    () => ({\n      waveSpeed,\n      sigma,\n      waveFreq,\n      pushAmt,\n      caStrength,\n      glow,\n      noiseWarp,\n      pinch,\n    }),\n    [caStrength, glow, noiseWarp, pinch, pushAmt, sigma, waveFreq, waveSpeed],\n  );\n  const settingsRef = React.useRef(settings);\n  settingsRef.current = settings;\n\n  React.useEffect(() => {\n    engineRef.current?.configure(settings);\n  }, [settings]);\n\n  React.useEffect(() => {\n    const root = rootRef.current;\n    const canvas = canvasRef.current;\n    if (!root || !canvas) return;\n    const abortController = new AbortController();\n    let animation: AnimationPlaybackControls | null = null;\n    let engine: RippleRenderer | null = null;\n    let busy = false;\n    let current = 0;\n\n    fetchPictures(images, abortController.signal).then((pictures) => {\n      if (abortController.signal.aborted || pictures.length === 0) return;\n      engine = new RippleRenderer(canvas, pictures, settingsRef.current);\n      engineRef.current = engine;\n      const observer = new ResizeObserver(([entry]) => {\n        const box = entry?.contentRect;\n        if (box) engine?.resize(box.width, box.height);\n      });\n      observer.observe(root);\n      engine.resize(root.clientWidth, root.clientHeight);\n\n      playRef.current = (x = 0.5, y = 0.5) => {\n        if (busy || pictures.length \u003c 2 || !engine) return;\n        busy = true;\n        engine.begin(x, y);\n        animation?.stop();\n        animation = animate(0, 1, {\n          duration,\n          ease,\n          onUpdate: (value) => engine?.setPhase(value),\n          onComplete: () => {\n            current = (current + 1) % pictures.length;\n            const following = pictures[(current + 1) % pictures.length]!;\n            engine?.advance(following, (current + 1) % 2);\n            busy = false;\n          },\n        });\n      };\n\n      abortController.signal.addEventListener(\n        \"abort\",\n        () => {\n          observer.disconnect();\n          animation?.stop();\n          engine?.destroy();\n        },\n        { once: true },\n      );\n    });\n\n    return () => {\n      playRef.current = () => undefined;\n      engineRef.current = null;\n      abortController.abort();\n    };\n  }, [duration, ease, images]);\n\n  React.useEffect(() => {\n    if (!autoPlay) return;\n    const timer = window.setInterval(() => {\n      const x = autoPlayOrigin === \"random\" ? 0.18 + Math.random() * 0.64 : 0.5;\n      const y = autoPlayOrigin === \"random\" ? 0.18 + Math.random() * 0.64 : 0.5;\n      playRef.current(x, y);\n    }, autoPlayInterval);\n    return () => window.clearInterval(timer);\n  }, [autoPlay, autoPlayInterval, autoPlayOrigin]);\n\n  return (\n    \u003cdiv\n      ref={rootRef}\n      className={cn(\n        \"relative h-full min-h-[320px] w-full cursor-pointer overflow-hidden leading-none outline-none focus-visible:ring-2 focus-visible:ring-white/70 focus-visible:ring-offset-2\",\n        className,\n      )}\n      style={{\n        borderRadius,\n        background,\n        touchAction: \"manipulation\",\n        ...style,\n      }}\n      role=\"button\"\n      tabIndex={0}\n      aria-label={label}\n      onPointerUp={(event) => {\n        const bounds = event.currentTarget.getBoundingClientRect();\n        playRef.current(\n          (event.clientX - bounds.left) / bounds.width,\n          (event.clientY - bounds.top) / bounds.height,\n        );\n      }}\n      onKeyDown={(event) => {\n        if (event.key === \"Enter\" || event.key === \" \") {\n          event.preventDefault();\n          playRef.current();\n        }\n      }}\n      {...props}\n    >\n      \u003ccanvas ref={canvasRef} className=\"absolute inset-0 h-full w-full\" />\n    \u003c/div>\n  );\n}\n\nexport function RippleTransition(props: RippleTransitionProps) {\n  return (\n    \u003cWebGLErrorBoundary\n      fallback={\n        \u003cWebGLFallback\n          className={props.className}\n          message=\"Ripple transitions need WebGL, which is unavailable in this browser.\"\n        />\n      }\n    >\n      \u003cRippleTransitionCanvas {...props} />\n    \u003c/WebGLErrorBoundary>\n  );\n}\n\n\n\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface WebGLErrorBoundaryProps {\n  children: React.ReactNode;\n  fallback?: React.ReactNode;\n  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;\n}\n\ninterface WebGLErrorBoundaryState {\n  hasError: boolean;\n}\n\nexport class WebGLErrorBoundary extends React.Component\u003c\n  WebGLErrorBoundaryProps,\n  WebGLErrorBoundaryState\n> {\n  public state: WebGLErrorBoundaryState = { hasError: false };\n\n  static getDerivedStateFromError(): WebGLErrorBoundaryState {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {\n    this.props.onError?.(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback ?? \u003cWebGLFallback />;\n    }\n    return this.props.children;\n  }\n}\n\ninterface WebGLFallbackProps {\n  className?: string;\n  message?: string;\n}\n\nexport function WebGLFallback({\n  className,\n  message = \"Interactive WebGL content is unavailable on this device/browser.\",\n}: WebGLFallbackProps) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"flex h-full w-full items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-900 px-4 text-center text-sm text-white/75\",\n        className,\n      )}\n      role=\"status\"\n      aria-live=\"polite\"\n    >\n      \u003cp>{message}\u003c/p>\n    \u003c/div>\n  );\n}\n","filename":"ripple-transition.tsx","install":"pnpm dlx shadcn@latest add @componentry/ripple-transition","posterData":"/assets/embedded/542ed1abc8c1997d0807a04c105241caaa9d4ba0a324bb9697ec27754990da3a.webp"},{"slug":"infinite-image-field","title":"Infinite Image Field","description":"An endless, cursor-driven photo canvas that tiles images infinitely and pans fluidly toward wherever you move your cursor.","category":"Visual Effects","poster":"/preview-videos/visual-effects/infiniteimagefield.webp","video":"/preview-videos/visual-effects/infiniteimagefield.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport { useCallback, useEffect, useRef } from \"react\";\n\nexport const INFINITE_IMAGE_FIELD_IMAGES: string[] = [\n  \"https://plus.unsplash.com/premium_photo-1665311515452-a9f54c4266c9?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1501854140801-50d01698950b?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1440342359743-84fcb8c21f21?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1448375240586-882707db888b?w=400&h=560&fit=crop&q=80\",\n  \"https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?w=400&h=560&fit=crop&q=80\",\n];\n\nexport interface InfiniteImageFieldProps\n  extends Omit\u003cReact.HTMLAttributes\u003cHTMLDivElement>, \"children\"> {\n  className?: string;\n  images?: string[];\n  imageWidth?: number;\n  imageHeight?: number;\n  gap?: number;\n  maxSpeed?: number;\n  smoothing?: number;\n  borderRadius?: number;\n}\n\nfunction drawRoundedRect(\n  ctx: CanvasRenderingContext2D,\n  x: number,\n  y: number,\n  w: number,\n  h: number,\n  r: number\n) {\n  const clampedR = Math.min(r, w / 2, h / 2);\n  ctx.beginPath();\n  ctx.moveTo(x + clampedR, y);\n  ctx.lineTo(x + w - clampedR, y);\n  ctx.quadraticCurveTo(x + w, y, x + w, y + clampedR);\n  ctx.lineTo(x + w, y + h - clampedR);\n  ctx.quadraticCurveTo(x + w, y + h, x + w - clampedR, y + h);\n  ctx.lineTo(x + clampedR, y + h);\n  ctx.quadraticCurveTo(x, y + h, x, y + h - clampedR);\n  ctx.lineTo(x, y + clampedR);\n  ctx.quadraticCurveTo(x, y, x + clampedR, y);\n  ctx.closePath();\n}\n\nexport function InfiniteImageField({\n  className,\n  images = INFINITE_IMAGE_FIELD_IMAGES,\n  imageWidth = 200,\n  imageHeight = 280,\n  gap = 28,\n  maxSpeed = 5,\n  smoothing = 0.07,\n  borderRadius = 0,\n  ...rest\n}: InfiniteImageFieldProps) {\n  const canvasRef = useRef\u003cHTMLCanvasElement>(null);\n  const loadedImagesRef = useRef\u003cHTMLImageElement[]>([]);\n  const dimsRef = useRef({ w: 0, h: 0 });\n  const camRef = useRef({ x: 0, y: 0 });\n  const velRef = useRef({ x: 0, y: 0 });\n  const mouseRef = useRef({ x: 0.5, y: 0.5 });\n  const isInsideRef = useRef(false);\n  const rafRef = useRef\u003cnumber>(0);\n\n  // Pre-load images\n  useEffect(() => {\n    const imgs = images.map((src) => {\n      const img = new Image();\n      img.crossOrigin = \"anonymous\";\n      img.src = src;\n      return img;\n    });\n    loadedImagesRef.current = imgs;\n  }, [images]);\n\n  const draw = useCallback(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n    const ctx = canvas.getContext(\"2d\");\n    if (!ctx) return;\n\n    const { w: W, h: H } = dimsRef.current;\n    if (W === 0 || H === 0) {\n      rafRef.current = requestAnimationFrame(draw);\n      return;\n    }\n\n    const dpr = window.devicePixelRatio || 1;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n\n    const cellW = imageWidth + gap;\n    const cellH = imageHeight + gap;\n    const imgs = loadedImagesRef.current;\n    const numImages = imgs.length;\n\n    // Physics — cursor offset from center drives velocity\n    const tx = isInsideRef.current\n      ? (mouseRef.current.x - 0.5) * 2 * maxSpeed\n      : 0;\n    const ty = isInsideRef.current\n      ? (mouseRef.current.y - 0.5) * 2 * maxSpeed\n      : 0;\n\n    velRef.current.x += (tx - velRef.current.x) * smoothing;\n    velRef.current.y += (ty - velRef.current.y) * smoothing;\n\n    camRef.current.x += velRef.current.x;\n    camRef.current.y += velRef.current.y;\n\n    const camX = camRef.current.x;\n    const camY = camRef.current.y;\n\n    ctx.clearRect(0, 0, W, H);\n\n    // Compute visible cell range\n    const colMin = Math.floor((camX - W / 2) / cellW) - 1;\n    const colMax = Math.ceil((camX + W / 2) / cellW) + 1;\n    const rowMin = Math.floor((camY - H / 2) / cellH) - 1;\n    const rowMax = Math.ceil((camY + H / 2) / cellH) + 1;\n\n    for (let row = rowMin; row \u003c= rowMax; row++) {\n      for (let col = colMin; col \u003c= colMax; col++) {\n        // Top-left corner in screen space\n        const sx = col * cellW - camX + W / 2 - imageWidth / 2;\n        const sy = row * cellH - camY + H / 2 - imageHeight / 2;\n\n        // Deterministic image assignment — same cell always gets same image\n        const imgIdx =\n          Math.abs(col * 7 + row * 13 + ((col * row * 3) | 0)) % numImages;\n        const img = imgs[imgIdx];\n\n        ctx.save();\n        drawRoundedRect(ctx, sx, sy, imageWidth, imageHeight, borderRadius);\n        ctx.clip();\n\n        if (img && img.complete && img.naturalWidth > 0) {\n          ctx.drawImage(img, sx, sy, imageWidth, imageHeight);\n        } else {\n          // Placeholder while loading — semi-transparent so background shows\n          ctx.fillStyle = \"rgba(0,0,0,0.15)\";\n          ctx.fillRect(sx, sy, imageWidth, imageHeight);\n        }\n        ctx.restore();\n\n        // Subtle border overlay for glass-panel effect\n        ctx.save();\n        drawRoundedRect(ctx, sx, sy, imageWidth, imageHeight, borderRadius);\n        ctx.strokeStyle = \"rgba(255,255,255,0.06)\";\n        ctx.lineWidth = 1;\n        ctx.stroke();\n        ctx.restore();\n      }\n    }\n\n    rafRef.current = requestAnimationFrame(draw);\n  }, [imageWidth, imageHeight, gap, maxSpeed, smoothing, borderRadius]);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n\n    const resize = () => {\n      const dpr = window.devicePixelRatio || 1;\n      const rect = canvas.getBoundingClientRect();\n      dimsRef.current = { w: rect.width, h: rect.height };\n      canvas.width = rect.width * dpr;\n      canvas.height = rect.height * dpr;\n    };\n\n    resize();\n\n    const ro = new ResizeObserver(resize);\n    ro.observe(canvas);\n\n    const onMove = (e: MouseEvent) => {\n      const rect = canvas.getBoundingClientRect();\n      mouseRef.current = {\n        x: (e.clientX - rect.left) / rect.width,\n        y: (e.clientY - rect.top) / rect.height,\n      };\n    };\n\n    const onEnter = () => {\n      isInsideRef.current = true;\n    };\n    const onLeave = () => {\n      isInsideRef.current = false;\n    };\n\n    canvas.addEventListener(\"mousemove\", onMove);\n    canvas.addEventListener(\"mouseenter\", onEnter);\n    canvas.addEventListener(\"mouseleave\", onLeave);\n\n    rafRef.current = requestAnimationFrame(draw);\n\n    return () => {\n      cancelAnimationFrame(rafRef.current);\n      ro.disconnect();\n      canvas.removeEventListener(\"mousemove\", onMove);\n      canvas.removeEventListener(\"mouseenter\", onEnter);\n      canvas.removeEventListener(\"mouseleave\", onLeave);\n    };\n  }, [draw]);\n\n  return (\n    \u003cdiv\n      {...rest}\n      className={cn(\"relative w-full h-full overflow-hidden\", className)}\n    >\n      \u003ccanvas ref={canvasRef} className=\"block w-full h-full bg-transparent\" />\n    \u003c/div>\n  );\n}\n","filename":"infinite-image-field.tsx","install":"pnpm dlx shadcn@latest add @componentry/infinite-image-field","posterData":"/assets/embedded/f8f4e5a2c721247d38b94181bdd2c7712d5d313096ab68e0ae4d25c4591df8a0.webp"},{"slug":"dither-gradient","title":"Dither Gradient","description":"Gradient background with dithering noise.","category":"Visual Effects","poster":"/preview-videos/visual-effects/dithergradient.webp","video":"/preview-videos/visual-effects/dithergradient.mp4","source":"\"use client\"\n\nimport { useEffect, useRef } from \"react\"\nimport { cn } from \"@/lib/utils\"\n\ninterface DitherGradientProps {\n  className?: string\n  colorFrom?: string\n  colorTo?: string\n  colorMid?: string\n  intensity?: number\n  speed?: number\n  angle?: number\n}\n\nexport function DitherGradient({\n  className,\n  colorFrom = \"#4f46e5\",\n  colorTo = \"#ec4899\",\n  colorMid = \"#a855f7\",\n  intensity = 0.15,\n  speed = 3,\n  angle = 45,\n}: DitherGradientProps) {\n  const canvasRef = useRef\u003cHTMLCanvasElement>(null)\n  const animationRef = useRef\u003cnumber>(0)\n\n  useEffect(() => {\n    const canvas = canvasRef.current\n    if (!canvas) return\n\n    const ctx = canvas.getContext(\"2d\")\n    if (!ctx) return\n\n    const resize = () => {\n      const rect = canvas.getBoundingClientRect()\n      canvas.width = rect.width\n      canvas.height = rect.height\n    }\n\n    resize()\n    window.addEventListener(\"resize\", resize)\n\n    let time = 0\n    const bayerMatrix = [\n      [0, 8, 2, 10],\n      [12, 4, 14, 6],\n      [3, 11, 1, 9],\n      [15, 7, 13, 5],\n    ]\n\n    const hexToRgb = (hex: string) => {\n      const result = /^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex)\n      if (!result) return { r: 0, g: 0, b: 0 }\n      return {\n        r: parseInt(result[1]!, 16),\n        g: parseInt(result[2]!, 16),\n        b: parseInt(result[3]!, 16),\n      }\n    }\n\n    const smoothstep = (t: number) => t * t * (3 - 2 * t)\n\n    const animate = () => {\n      const { width, height } = canvas\n      const imageData = ctx.createImageData(width, height)\n      const data = imageData.data\n\n      const from = hexToRgb(colorFrom)\n      const mid = hexToRgb(colorMid)\n      const to = hexToRgb(colorTo)\n      const rad = (angle * Math.PI) / 180\n\n      for (let y = 0; y \u003c height; y++) {\n        for (let x = 0; x \u003c width; x++) {\n          const normalizedX = x / width\n          const normalizedY = y / height\n          \n          const gradientPos = \n            (normalizedX * Math.cos(rad) + normalizedY * Math.sin(rad)) * 0.8 + \n            0.1 + \n            Math.sin(time * speed * 0.0008) * 0.1\n\n          const clampedPos = Math.max(0, Math.min(1, gradientPos))\n\n          let r: number, g: number, b: number\n          if (clampedPos \u003c 0.5) {\n            const t = smoothstep(clampedPos * 2)\n            r = from.r + (mid.r - from.r) * t\n            g = from.g + (mid.g - from.g) * t\n            b = from.b + (mid.b - from.b) * t\n          } else {\n            const t = smoothstep((clampedPos - 0.5) * 2)\n            r = mid.r + (to.r - mid.r) * t\n            g = mid.g + (to.g - mid.g) * t\n            b = mid.b + (to.b - mid.b) * t\n          }\n\n          const threshold = (bayerMatrix[y % 4]![x % 4]! / 16 - 0.5) * intensity * 180\n          const noise = (Math.random() - 0.5) * intensity * 60\n\n          const idx = (y * width + x) * 4\n          data[idx] = Math.min(255, Math.max(0, r + threshold + noise))\n          data[idx + 1] = Math.min(255, Math.max(0, g + threshold + noise))\n          data[idx + 2] = Math.min(255, Math.max(0, b + threshold + noise))\n          data[idx + 3] = 255\n        }\n      }\n\n      ctx.putImageData(imageData, 0, 0)\n      time += 16\n      animationRef.current = requestAnimationFrame(animate)\n    }\n\n    animate()\n\n    return () => {\n      window.removeEventListener(\"resize\", resize)\n      cancelAnimationFrame(animationRef.current)\n    }\n  }, [colorFrom, colorTo, colorMid, intensity, speed, angle])\n\n  return (\n    \u003ccanvas\n      ref={canvasRef}\n      className={cn(\"absolute inset-0 h-full w-full\", className)}\n    />\n  )\n}\n","filename":"dither-gradient.tsx","install":"pnpm dlx shadcn@latest add @componentry/dither-gradient","posterData":"/assets/embedded/627191ff7175fd3a1c36763d1e6dd8e0f32c17c001a3ce1b2004e377c3c1e719.webp"},{"slug":"magnet-lines","title":"Magnet Lines","description":"Lines that react to cursor movement like a magnetic field.","category":"Visual Effects","poster":"/preview-videos/visual-effects/magneticlines.webp","video":"/preview-videos/visual-effects/magneticlines.mp4","source":"\"use client\";\n\nimport React, { useRef, useState, useEffect } from \"react\";\nimport { motion } from \"framer-motion\";\n\ninterface MagnetLinesProps {\n    rows?: number;\n    columns?: number;\n    containerSize?: string;\n    lineColor?: string;\n    lineWidth?: string;\n    lineHeight?: string;\n    baseAngle?: number;\n    className?: string;\n    style?: React.CSSProperties;\n}\n\nexport function MagnetLines({\n    rows = 9,\n    columns = 9,\n    containerSize = \"80vmin\",\n    lineColor = \"#efefef\",\n    lineWidth = \"1vmin\",\n    lineHeight = \"6vmin\",\n    baseAngle = 0,\n    className = \"\",\n    style = {},\n}: MagnetLinesProps) {\n    const containerRef = useRef\u003cHTMLDivElement>(null);\n\n    // Spans the grid\n    const total = rows * columns;\n    const spans = Array.from({ length: total }, (_, i) => i);\n\n    return (\n        \u003cdiv\n            ref={containerRef}\n            className={`relative grid place-items-center ${className}`}\n            style={{\n                gridTemplateColumns: `repeat(${columns}, 1fr)`,\n                gridTemplateRows: `repeat(${rows}, 1fr)`,\n                width: containerSize,\n                height: containerSize,\n                ...style,\n            }}\n        >\n            {spans.map((i) => (\n                \u003cLine\n                    key={i}\n                    containerRef={containerRef}\n                    lineColor={lineColor}\n                    lineWidth={lineWidth}\n                    lineHeight={lineHeight}\n                    baseAngle={baseAngle}\n                />\n            ))}\n        \u003c/div>\n    );\n}\n\nfunction Line({\n    containerRef,\n    lineColor,\n    lineWidth,\n    lineHeight,\n    baseAngle,\n}: {\n    containerRef: React.RefObject\u003cHTMLDivElement | null>;\n    lineColor: string;\n    lineWidth: string;\n    lineHeight: string;\n    baseAngle: number;\n}) {\n    const lineRef = useRef\u003cHTMLDivElement>(null);\n    const [rotate, setRotate] = useState(baseAngle);\n\n    useEffect(() => {\n        const updateRotation = (e: MouseEvent) => {\n            if (!lineRef.current || !containerRef.current) return;\n\n            const rect = lineRef.current.getBoundingClientRect();\n            const centerX = rect.left + rect.width / 2;\n            const centerY = rect.top + rect.height / 2;\n\n            const mouseX = e.clientX;\n            const mouseY = e.clientY;\n\n            const distanceX = mouseX - centerX;\n            const distanceY = mouseY - centerY;\n\n            const angle = (Math.atan2(distanceY, distanceX) * 180) / Math.PI;\n\n            setRotate(angle + baseAngle);\n        };\n\n        window.addEventListener(\"mousemove\", updateRotation);\n        return () => window.removeEventListener(\"mousemove\", updateRotation);\n    }, [baseAngle, containerRef]);\n\n    return (\n        \u003cmotion.div\n            ref={lineRef}\n            animate={{ rotate }}\n            transition={{ type: \"spring\", damping: 20, stiffness: 300 }}\n            style={{\n                width: lineWidth,\n                height: lineHeight,\n                backgroundColor: lineColor,\n            }}\n        />\n    );\n}\n","filename":"magnet-lines.tsx","install":"pnpm dlx shadcn@latest add @componentry/magnet-lines","posterData":"/assets/embedded/29518c5cb9cad9f6f7521c3c8d5a17320e2966d71ba2fa88b4e40d894eddae9c.webp"},{"slug":"pixel-canvas","title":"Pixel Canvas","description":"Canvas where pixels react to interaction.","category":"Visual Effects","poster":"/preview-videos/visual-effects/pixelcanvas.webp","video":"/preview-videos/visual-effects/pixelcanvas.mp4","source":"\"use client\";\n\nimport React, { useEffect, useRef, useCallback } from \"react\";\nimport { cn } from \"@/lib/utils\";\n\ninterface PixelCanvasProps extends React.HTMLAttributes\u003cHTMLDivElement> {\n    /** Size of each pixel cell in pixels */\n    gap?: number;\n    /** Speed of the trailing decay (higher = faster fade) */\n    speed?: number;\n    /** Array of colors for pixels - will interpolate through them as trail fades */\n    colors?: string[];\n    /** Disable mouse tracking */\n    noFocus?: boolean;\n    /** Variant style */\n    variant?: \"default\" | \"trail\" | \"glow\";\n}\n\ninterface Pixel {\n    x: number;\n    y: number;\n    size: number;\n    intensity: number;\n    targetIntensity: number;\n    colorPhase: number;\n}\n\n// Helper to interpolate between two hex colors\nfunction lerpColor(color1: string, color2: string, t: number): string {\n    const c1 = hexToRgb(color1);\n    const c2 = hexToRgb(color2);\n    if (!c1 || !c2) return color1;\n\n    const r = Math.round(c1.r + (c2.r - c1.r) * t);\n    const g = Math.round(c1.g + (c2.g - c1.g) * t);\n    const b = Math.round(c1.b + (c2.b - c1.b) * t);\n\n    return `rgb(${r}, ${g}, ${b})`;\n}\n\nfunction hexToRgb(hex: string): { r: number; g: number; b: number } | null {\n    const result = /^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i.exec(hex);\n    return result\n        ? {\n            r: parseInt(result[1]!, 16),\n            g: parseInt(result[2]!, 16),\n            b: parseInt(result[3]!, 16),\n        }\n        : null;\n}\n\nexport function PixelCanvas({\n    className,\n    gap = 6,\n    speed = 0.02,\n    colors = [\"#e879f9\", \"#a78bfa\", \"#38bdf8\", \"#22d3ee\"],\n    noFocus = false,\n    variant = \"default\",\n    ...props\n}: PixelCanvasProps) {\n    const canvasRef = useRef\u003cHTMLCanvasElement>(null);\n    const containerRef = useRef\u003cHTMLDivElement>(null);\n    const pixelsRef = useRef\u003cPixel[][]>([]);\n    const mouseRef = useRef({ x: -1000, y: -1000 });\n    const animationRef = useRef\u003cnumber>(0);\n    const lastTimeRef = useRef\u003cnumber>(0);\n\n    const getColorFromIntensity = useCallback((intensity: number, phase: number) => {\n        if (colors.length === 0) return \"#ffffff\";\n        if (colors.length === 1) return colors[0]!;\n\n        // Use phase + intensity to create a shifting color effect\n        const t = (phase + intensity) % 1;\n        const index = Math.floor(t * (colors.length - 1));\n        const nextIndex = Math.min(index + 1, colors.length - 1);\n        const localT = (t * (colors.length - 1)) % 1;\n\n        const color1 = colors[index];\n        const color2 = colors[nextIndex];\n\n        if (!color1) return \"#ffffff\";\n        if (!color2) return color1!;\n\n        return lerpColor(color1, color2, localT);\n    }, [colors]);\n\n    useEffect(() => {\n        const canvas = canvasRef.current;\n        const container = containerRef.current;\n        if (!canvas || !container) return;\n\n        const ctx = canvas.getContext(\"2d\", { alpha: true });\n        if (!ctx) return;\n\n        let cols = 0;\n        let rows = 0;\n        const pixelSize = Math.max(gap, 4);\n\n        const initPixels = () => {\n            const rect = container.getBoundingClientRect();\n            const dpr = window.devicePixelRatio || 1;\n\n            canvas.width = rect.width * dpr;\n            canvas.height = rect.height * dpr;\n            canvas.style.width = `${rect.width}px`;\n            canvas.style.height = `${rect.height}px`;\n            ctx.scale(dpr, dpr);\n\n            cols = Math.ceil(rect.width / pixelSize);\n            rows = Math.ceil(rect.height / pixelSize);\n\n            const newPixels: Pixel[][] = [];\n            for (let i = 0; i \u003c cols; i++) {\n                const row: Pixel[] = [];\n                for (let j = 0; j \u003c rows; j++) {\n                    // Preserve existing intensity if pixel exists\n                    const existing = pixelsRef.current[i]?.[j];\n                    row.push({\n                        x: i * pixelSize,\n                        y: j * pixelSize,\n                        size: pixelSize - 1,\n                        intensity: existing?.intensity ?? 0,\n                        targetIntensity: 0,\n                        colorPhase: Math.random(), // Random starting phase for color variety\n                    });\n                }\n                newPixels.push(row);\n            }\n            pixelsRef.current = newPixels;\n        };\n\n        const draw = (timestamp: number) => {\n            const deltaTime = timestamp - lastTimeRef.current;\n            lastTimeRef.current = timestamp;\n\n            const rect = container.getBoundingClientRect();\n            ctx.clearRect(0, 0, rect.width, rect.height);\n\n            const { x: mouseX, y: mouseY } = mouseRef.current;\n            const pixels = pixelsRef.current;\n\n            // Influence radius based on variant\n            const radius = variant === \"glow\" ? 120 : 80;\n            const glowPasses = variant === \"glow\" ? 2 : 1;\n\n            // Update pixel states\n            for (let i = 0; i \u003c cols; i++) {\n                const col = pixels[i];\n                if (!col) continue;\n\n                for (let j = 0; j \u003c rows; j++) {\n                    const pixel = col[j];\n                    if (!pixel) continue;\n\n                    // Calculate distance from mouse\n                    const centerX = pixel.x + pixel.size / 2;\n                    const centerY = pixel.y + pixel.size / 2;\n                    const dx = mouseX - centerX;\n                    const dy = mouseY - centerY;\n                    const distance = Math.sqrt(dx * dx + dy * dy);\n\n                    // Set target intensity based on distance\n                    if (distance \u003c radius) {\n                        const falloff = 1 - (distance / radius);\n                        // Smooth falloff curve\n                        pixel.targetIntensity = Math.pow(falloff, 1.5);\n                    } else {\n                        pixel.targetIntensity = 0;\n                    }\n\n                    // Smooth interpolation towards target\n                    const lerpSpeed = pixel.targetIntensity > pixel.intensity\n                        ? 0.3 // Quick light up\n                        : speed; // Slow decay for trailing\n\n                    pixel.intensity += (pixel.targetIntensity - pixel.intensity) * lerpSpeed;\n\n                    // Shift color phase slowly for shimmer effect\n                    pixel.colorPhase = (pixel.colorPhase + 0.001 * (deltaTime / 16)) % 1;\n\n                    // Only draw if visible\n                    if (pixel.intensity > 0.01) {\n                        const color = getColorFromIntensity(pixel.intensity, pixel.colorPhase);\n\n                        // Glow effect: draw larger, blurred version first\n                        if (variant === \"glow\" && pixel.intensity > 0.2) {\n                            for (let g = glowPasses; g > 0; g--) {\n                                const glowSize = pixel.size + g * 4;\n                                const glowOffset = (glowSize - pixel.size) / 2;\n                                ctx.globalAlpha = pixel.intensity * 0.15 / g;\n                                ctx.fillStyle = color;\n                                ctx.fillRect(\n                                    pixel.x - glowOffset,\n                                    pixel.y - glowOffset,\n                                    glowSize,\n                                    glowSize\n                                );\n                            }\n                        }\n\n                        // Main pixel\n                        ctx.globalAlpha = pixel.intensity * 0.9;\n                        ctx.fillStyle = color;\n\n                        if (variant === \"trail\") {\n                            // Rounded pixels for trail variant\n                            const cornerRadius = pixel.size * 0.3;\n                            ctx.beginPath();\n                            ctx.roundRect(pixel.x, pixel.y, pixel.size, pixel.size, cornerRadius);\n                            ctx.fill();\n                        } else {\n                            ctx.fillRect(pixel.x, pixel.y, pixel.size, pixel.size);\n                        }\n                    }\n                }\n            }\n\n            ctx.globalAlpha = 1;\n            animationRef.current = requestAnimationFrame(draw);\n        };\n\n        const onMouseMove = (e: MouseEvent) => {\n            const rect = canvas.getBoundingClientRect();\n            mouseRef.current = {\n                x: e.clientX - rect.left,\n                y: e.clientY - rect.top,\n            };\n        };\n\n        const onMouseLeave = () => {\n            mouseRef.current = { x: -1000, y: -1000 };\n        };\n\n        const onTouchMove = (e: TouchEvent) => {\n            if (e.touches.length > 0) {\n                const touch = e.touches[0];\n                if (touch) {\n                    const rect = canvas.getBoundingClientRect();\n                    mouseRef.current = {\n                        x: touch.clientX - rect.left,\n                        y: touch.clientY - rect.top,\n                    };\n                }\n            }\n        };\n\n        const onTouchEnd = () => {\n            mouseRef.current = { x: -1000, y: -1000 };\n        };\n\n        // Initialize\n        initPixels();\n        lastTimeRef.current = performance.now();\n        animationRef.current = requestAnimationFrame(draw);\n\n        // Event listeners\n        window.addEventListener(\"resize\", initPixels);\n        if (!noFocus) {\n            container.addEventListener(\"mousemove\", onMouseMove);\n            container.addEventListener(\"mouseleave\", onMouseLeave);\n            container.addEventListener(\"touchmove\", onTouchMove, { passive: true });\n            container.addEventListener(\"touchend\", onTouchEnd);\n        }\n\n        return () => {\n            cancelAnimationFrame(animationRef.current);\n            window.removeEventListener(\"resize\", initPixels);\n            container.removeEventListener(\"mousemove\", onMouseMove);\n            container.removeEventListener(\"mouseleave\", onMouseLeave);\n            container.removeEventListener(\"touchmove\", onTouchMove);\n            container.removeEventListener(\"touchend\", onTouchEnd);\n        };\n    }, [gap, speed, noFocus, variant, getColorFromIntensity]);\n\n    return (\n        \u003cdiv\n            ref={containerRef}\n            className={cn(\"h-full w-full relative overflow-hidden\", className)}\n            {...props}\n        >\n            \u003ccanvas ref={canvasRef} className=\"block w-full h-full\" />\n        \u003c/div>\n    );\n}\n","filename":"pixel-canvas.tsx","install":"pnpm dlx shadcn@latest add @componentry/pixel-canvas","posterData":"/assets/embedded/8fafc2cf123111ce2ce265377f3ef3f432b2d4e851bb86cbfb8c183848cc3472.webp"},{"slug":"pixel-image-trail","title":"Pixel Image Trail","description":"An image reveal made from cursor-painted squares that expire into a bounded pixel trail.","category":"Visual Effects","poster":"/preview-videos/visual-effects/pixelimagetrail.webp","video":"/preview-videos/visual-effects/pixelimagetrail.mp4","source":"\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface PixelImageTrailProps extends React.HTMLAttributes\u003cHTMLDivElement> {\n  /** Image revealed by the pixel trail. */\n  src: string;\n  /** Accessible description for the image. */\n  alt: string;\n  /** Width and height of each square in pixels. */\n  pixelSize?: number;\n  /** Maximum distance for an occasional satellite pixel. */\n  radius?: number;\n  /** Time in milliseconds before a square completely fades. */\n  fadeDuration?: number;\n  /** Maximum number of squares kept in the trail. */\n  maxPixels?: number;\n  /** Number of image fragments visible before the first interaction. */\n  initialPixels?: number;\n}\n\ninterface TrailPixel {\n  column: number;\n  row: number;\n  touchedAt: number;\n  ambient: boolean;\n}\n\nexport function PixelImageTrail({\n  src,\n  alt,\n  pixelSize = 36,\n  radius = 58,\n  fadeDuration = 900,\n  maxPixels = 84,\n  initialPixels = 24,\n  className,\n  children,\n  ...props\n}: PixelImageTrailProps) {\n  const containerRef = React.useRef\u003cHTMLDivElement>(null);\n  const canvasRef = React.useRef\u003cHTMLCanvasElement>(null);\n  const imageRef = React.useRef\u003cHTMLImageElement>(null);\n\n  React.useEffect(() => {\n    const container = containerRef.current;\n    const canvas = canvasRef.current;\n    const image = imageRef.current;\n    const context = canvas?.getContext(\"2d\");\n\n    if (!container || !canvas || !image || !context) return;\n\n    const size = Math.max(12, pixelSize);\n    const pixels = new Map\u003cstring, TrailPixel>();\n    const reducedMotion = window.matchMedia(\n      \"(prefers-reduced-motion: reduce)\",\n    ).matches;\n\n    let width = 0;\n    let height = 0;\n    let frame = 0;\n    let pointerInside = false;\n    const hoveredKeys = new Set\u003cstring>();\n    let lastColumn: number | null = null;\n    let lastRow: number | null = null;\n\n    const seedPixels = () => {\n      const columns = Math.max(1, Math.ceil(width / size));\n      const rows = Math.max(1, Math.ceil(height / size));\n      const count = Math.min(initialPixels, columns * rows);\n\n      for (let index = 0; index \u003c count; index += 1) {\n        const column = Math.floor(Math.random() * columns);\n        const row = Math.floor(Math.random() * rows);\n        pixels.set(`${column}:${row}`, {\n          column,\n          row,\n          touchedAt: performance.now(),\n          ambient: true,\n        });\n      }\n    };\n\n    const resize = () => {\n      cancelAnimationFrame(frame);\n      const rect = container.getBoundingClientRect();\n      const dpr = Math.min(window.devicePixelRatio || 1, 2);\n\n      width = rect.width;\n      height = rect.height;\n      canvas.width = Math.round(width * dpr);\n      canvas.height = Math.round(height * dpr);\n      canvas.style.width = `${width}px`;\n      canvas.style.height = `${height}px`;\n      context.setTransform(dpr, 0, 0, dpr, 0, 0);\n      pixels.clear();\n      seedPixels();\n      context.clearRect(0, 0, width, height);\n      frame = requestAnimationFrame(draw);\n    };\n\n    const drawPixel = (pixel: TrailPixel, opacity: number) => {\n      if (!image.complete || !image.naturalWidth || !image.naturalHeight) {\n        return;\n      }\n\n      const x = pixel.column * size;\n      const y = pixel.row * size;\n      const coverScale = Math.max(\n        width / image.naturalWidth,\n        height / image.naturalHeight,\n      );\n      const renderedWidth = image.naturalWidth * coverScale;\n      const renderedHeight = image.naturalHeight * coverScale;\n      const offsetX = (width - renderedWidth) / 2;\n      const offsetY = (height - renderedHeight) / 2;\n\n      context.globalAlpha = opacity;\n      context.drawImage(\n        image,\n        (x - offsetX) / coverScale,\n        (y - offsetY) / coverScale,\n        size / coverScale,\n        size / coverScale,\n        x,\n        y,\n        size,\n        size,\n      );\n    };\n\n    const draw = (now: number) => {\n      frame = 0;\n      context.clearRect(0, 0, width, height);\n\n      for (const [key, pixel] of pixels) {\n        if (pointerInside && hoveredKeys.has(key)) {\n          pixel.touchedAt = now;\n        }\n\n        const age = now - pixel.touchedAt;\n        const opacity = pixel.ambient\n          ? pointerInside && hoveredKeys.has(key)\n            ? 1\n            : 0.58\n          : reducedMotion\n            ? pointerInside\n              ? 1\n              : 0\n            : Math.max(0, 1 - age / Math.max(120, fadeDuration));\n\n        if (opacity \u003c= 0) {\n          pixels.delete(key);\n          continue;\n        }\n\n        drawPixel(pixel, opacity * opacity * (3 - 2 * opacity));\n      }\n\n      context.globalAlpha = 1;\n      if (\n        !reducedMotion &&\n        [...pixels.values()].some((pixel) => !pixel.ambient)\n      ) {\n        frame = requestAnimationFrame(draw);\n      }\n    };\n\n    const requestDraw = () => {\n      if (!frame) frame = requestAnimationFrame(draw);\n    };\n\n    const trimTrail = () => {\n      const limit = Math.max(1, maxPixels);\n      const trailPixels = [...pixels.entries()].filter(\n        ([, pixel]) => !pixel.ambient,\n      );\n      if (trailPixels.length \u003c= limit) return;\n\n      const oldest = trailPixels.sort(\n        (a, b) => a[1].touchedAt - b[1].touchedAt,\n      );\n      const excess = trailPixels.length - limit;\n      for (let index = 0; index \u003c excess; index += 1) {\n        const entry = oldest[index];\n        if (entry) pixels.delete(entry[0]);\n      }\n    };\n\n    const setTrailPixel = (\n      key: string,\n      column: number,\n      row: number,\n      touchedAt: number,\n    ) => {\n      if (pixels.get(key)?.ambient) return;\n      pixels.set(key, { column, row, touchedAt, ambient: false });\n    };\n\n    const paintAt = (clientX: number, clientY: number) => {\n      const rect = container.getBoundingClientRect();\n      const x = clientX - rect.left;\n      const y = clientY - rect.top;\n      const centerColumn = Math.floor(x / size);\n      const centerRow = Math.floor(y / size);\n\n      if (reducedMotion) {\n        for (const [key, pixel] of pixels) {\n          if (!pixel.ambient) pixels.delete(key);\n        }\n      }\n\n      const now = performance.now();\n      hoveredKeys.clear();\n      const fromColumn = lastColumn ?? centerColumn;\n      const fromRow = lastRow ?? centerRow;\n      const columnDistance = centerColumn - fromColumn;\n      const rowDistance = centerRow - fromRow;\n      const steps = Math.max(\n        1,\n        Math.abs(columnDistance),\n        Math.abs(rowDistance),\n      );\n\n      for (let step = 0; step \u003c= steps; step += 1) {\n        const progress = step / steps;\n        const column = Math.round(fromColumn + columnDistance * progress);\n        const row = Math.round(fromRow + rowDistance * progress);\n        const key = `${column}:${row}`;\n\n        setTrailPixel(key, column, row, now);\n      }\n\n      const xDirection = x % size > size / 2 ? 1 : -1;\n      const yDirection = y % size > size / 2 ? 1 : -1;\n      const activeCluster: Array\u003c[number, number]> = [\n        [centerColumn, centerRow],\n        [centerColumn + xDirection, centerRow],\n        [centerColumn, centerRow + yDirection],\n        [centerColumn + xDirection, centerRow + yDirection],\n      ];\n\n      for (const [column, row] of activeCluster) {\n        if (\n          column \u003c 0 ||\n          row \u003c 0 ||\n          column * size >= width ||\n          row * size >= height\n        ) {\n          continue;\n        }\n\n        const key = `${column}:${row}`;\n        hoveredKeys.add(key);\n        setTrailPixel(key, column, row, now);\n      }\n\n      const moved = lastColumn !== centerColumn || lastRow !== centerRow;\n      if (moved && !reducedMotion && Math.random() \u003c 0.34) {\n        const spread = Math.max(1, Math.floor(radius / size));\n        const distance = 1 + Math.floor(Math.random() * spread);\n        const horizontalMotion =\n          Math.abs(columnDistance) >= Math.abs(rowDistance);\n        const column =\n          centerColumn +\n          (horizontalMotion ? 0 : Math.random() \u003c 0.5 ? -distance : distance);\n        const row =\n          centerRow +\n          (horizontalMotion ? (Math.random() \u003c 0.5 ? -distance : distance) : 0);\n\n        if (\n          column >= 0 &&\n          row >= 0 &&\n          column * size \u003c width &&\n          row * size \u003c height\n        ) {\n          setTrailPixel(\n            `${column}:${row}`,\n            column,\n            row,\n            now - fadeDuration * 0.18,\n          );\n        }\n      }\n\n      lastColumn = centerColumn;\n      lastRow = centerRow;\n\n      trimTrail();\n      requestDraw();\n    };\n\n    const onPointerEnter = (event: PointerEvent) => {\n      pointerInside = true;\n      paintAt(event.clientX, event.clientY);\n    };\n\n    const onPointerMove = (event: PointerEvent) => {\n      pointerInside = true;\n      paintAt(event.clientX, event.clientY);\n    };\n\n    const onPointerLeave = () => {\n      pointerInside = false;\n      hoveredKeys.clear();\n      lastColumn = null;\n      lastRow = null;\n      if (reducedMotion) {\n        for (const [key, pixel] of pixels) {\n          if (!pixel.ambient) pixels.delete(key);\n        }\n        requestDraw();\n      }\n    };\n\n    const onFocusIn = () => {\n      const rect = container.getBoundingClientRect();\n      pointerInside = true;\n      paintAt(rect.left + rect.width / 2, rect.top + rect.height / 2);\n    };\n\n    const onFocusOut = (event: FocusEvent) => {\n      if (!container.contains(event.relatedTarget as Node | null)) {\n        onPointerLeave();\n      }\n    };\n\n    resize();\n    const observer = new ResizeObserver(resize);\n    observer.observe(container);\n\n    image.addEventListener(\"load\", requestDraw);\n    container.addEventListener(\"pointerenter\", onPointerEnter);\n    container.addEventListener(\"pointermove\", onPointerMove);\n    container.addEventListener(\"pointerleave\", onPointerLeave);\n    container.addEventListener(\"focusin\", onFocusIn);\n    container.addEventListener(\"focusout\", onFocusOut);\n\n    return () => {\n      cancelAnimationFrame(frame);\n      observer.disconnect();\n      image.removeEventListener(\"load\", requestDraw);\n      container.removeEventListener(\"pointerenter\", onPointerEnter);\n      container.removeEventListener(\"pointermove\", onPointerMove);\n      container.removeEventListener(\"pointerleave\", onPointerLeave);\n      container.removeEventListener(\"focusin\", onFocusIn);\n      container.removeEventListener(\"focusout\", onFocusOut);\n    };\n  }, [fadeDuration, initialPixels, maxPixels, pixelSize, radius, src]);\n\n  return (\n    \u003cdiv\n      ref={containerRef}\n      className={cn(\"relative isolate overflow-hidden touch-pan-y\", className)}\n      {...props}\n    >\n      \u003cimg\n        ref={imageRef}\n        src={src}\n        alt={alt}\n        className=\"pointer-events-none absolute inset-0 size-full object-cover opacity-0\"\n        draggable={false}\n      />\n      \u003ccanvas\n        ref={canvasRef}\n        aria-hidden=\"true\"\n        className=\"pointer-events-none absolute inset-0 size-full\"\n      />\n      {children ? \u003cdiv className=\"relative z-10\">{children}\u003c/div> : null}\n    \u003c/div>\n  );\n}\n","filename":"pixel-image-trail.tsx","install":"pnpm dlx shadcn@latest add @componentry/pixel-image-trail","posterData":"/assets/embedded/1634c9b69dd8975737500435a98aa4e02f204e851c1cf377af469c531083a9ff.webp"},{"slug":"signature","title":"Signature","description":"An animated SVG signature effect that draws out text as if hand-written.","category":"Components","poster":"/preview-videos/component-animations/signature.webp","video":"/preview-videos/component-animations/signature.mp4","source":"\"use client\";\n\nimport { useEffect, useId, useState } from \"react\";\nimport { motion } from \"framer-motion\";\nimport opentype from \"opentype.js\";\nimport { cn } from \"@/lib/utils\";\n\ninterface SignatureProps {\n  /** Text to generate signature for */\n  text?: string;\n  /** Color of the signature path */\n  color?: string;\n  /** Font size of the signature */\n  fontSize?: number;\n  /** Animation duration in seconds */\n  duration?: number;\n  /** Delay before animation starts in seconds */\n  delay?: number;\n  /** Additional CSS classes */\n  className?: string;\n  /** Only animate when in view */\n  inView?: boolean;\n  /** Only animate once */\n  once?: boolean;\n  /** Custom font URL to load */\n  fontUrl?: string;\n}\n\nexport function Signature({\n  text = \"Signature\",\n  color = \"currentColor\",\n  fontSize = 32,\n  duration = 1.5,\n  delay = 0,\n  className,\n  inView = false,\n  once = true,\n  fontUrl,\n}: SignatureProps) {\n  const [paths, setPaths] = useState\u003cstring[]>([]);\n  const [width, setWidth] = useState\u003cnumber>(300);\n  const height = fontSize * 3; // Give plenty of vertical space\n  const horizontalPadding = fontSize * 0.1;\n  const topMargin = fontSize * 1.5; // Shift down\n  const baseline = topMargin;\n  const maskId = `signature-reveal-${useId().replace(/:/g, \"\")}`;\n\n  useEffect(() => {\n    async function load() {\n      try {\n        let font;\n        const fontPaths = fontUrl \n          ? [fontUrl] \n          : [\n              \"/LastoriaBoldRegular.otf\",\n              \"./LastoriaBoldRegular.otf\",\n              \"https://www.componentry.fun/LastoriaBoldRegular.otf\",\n            ];\n\n        for (const path of fontPaths) {\n          try {\n            font = await opentype.load(path as string);\n            break;\n          } catch {\n            // Try next path\n          }\n        }\n\n        if (!font) {\n          throw new Error(\"Font could not be loaded from any path\");\n        }\n\n        let x = horizontalPadding;\n        const newPaths: string[] = [];\n\n        for (const char of text) {\n          const glyph = font.charToGlyph(char);\n          const path = glyph.getPath(x, baseline, fontSize);\n          newPaths.push(path.toPathData(3));\n\n          const advanceWidth = glyph.advanceWidth ?? font.unitsPerEm;\n          x += advanceWidth * (fontSize / font.unitsPerEm);\n        }\n\n        setPaths(newPaths);\n        setWidth(x + horizontalPadding);\n      } catch (error) {\n        console.error(\"Signature component font load error:\", error);\n        setPaths([]);\n        setWidth(text.length * fontSize * 0.6);\n      }\n    }\n\n    load();\n  }, [text, fontSize, baseline, horizontalPadding, fontUrl]);\n\n  const variants = {\n    hidden: { pathLength: 0, opacity: 0 },\n    visible: { pathLength: 1, opacity: 1 },\n  };\n\n  return (\n    \u003cmotion.svg\n      key={paths.length}\n      width={width}\n      height={height}\n      viewBox={`0 0 ${width} ${height}`}\n      fill=\"none\"\n      className={cn(\"text-foreground overflow-visible\", className)}\n      initial=\"hidden\"\n      whileInView={inView ? \"visible\" : undefined}\n      animate={inView ? undefined : \"visible\"}\n      viewport={{ once }}\n    >\n      \u003cdefs>\n        \u003cmask id={maskId} maskUnits=\"userSpaceOnUse\">\n          {paths.map((d, i) => (\n            \u003cmotion.path\n              key={i}\n              d={d}\n              stroke=\"white\"\n              strokeWidth={fontSize * 0.22}\n              fill=\"none\"\n              variants={variants}\n              transition={{\n                pathLength: {\n                  delay: delay + i * 0.2,\n                  duration,\n                  ease: \"easeInOut\",\n                },\n                opacity: {\n                  delay: delay + i * 0.2 + 0.01,\n                  duration: 0.01,\n                },\n              }}\n              vectorEffect=\"non-scaling-stroke\"\n              strokeLinecap=\"round\"\n              strokeLinejoin=\"round\"\n            />\n          ))}\n        \u003c/mask>\n      \u003c/defs>\n\n      {paths.map((d, i) => (\n        \u003cmotion.path\n          key={i}\n          d={d}\n          stroke={color}\n          strokeWidth={2}\n          fill=\"none\"\n          variants={variants}\n          transition={{\n            pathLength: {\n              delay: delay + i * 0.2,\n              duration,\n              ease: \"easeInOut\",\n            },\n            opacity: {\n              delay: delay + i * 0.2 + 0.01,\n              duration: 0.01,\n            },\n          }}\n          vectorEffect=\"non-scaling-stroke\"\n          strokeLinecap=\"butt\"\n          strokeLinejoin=\"round\"\n        />\n      ))}\n\n      \u003cg mask={`url(#${maskId})`}>\n        {paths.map((d, i) => \u003cpath key={i} d={d} fill={co  const columns = Math.floor(w / fontSize)\n        const drops = new Array(columns).fill(1)\n\n        // Character set: Katakana + Numbers\n        const chars = \"ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890\"\n\n\n\n        let isDark = document.documentElement.classList.contains(\"dark\")\n\n        // Set default background based on theme immediately to avoid delay\n        // If transparent, we don't need to fill initial background\n        if (!transparent) {\n            const bg = isDark ? \"#000000\" : \"#ffffff\"\n            ctx.fillStyle = bg\n            ctx.fillRect(0, 0, w, h)\n        }\n\n        const draw = () => {\n            // Check theme state on every frame\n            const currentIsDark = document.documentElement.classList.contains(\"dark\")\n\n            // If theme changed, reset the background immediately\n            if (currentIsDark !== isDark) {\n                isDark = currentIsDark\n                if (!transparent) {\n                    ctx.fillStyle = isDark ? \"#000000\" : \"#ffffff\"\n                    ctx.fillRect(0, 0, canvas.width, canvas.height)\n                }\n            }\n\n            // Semi-transparent color for trail effect\n            if (transparent) {\n                // For transparent background, we want to fade out the previous frame\n                ctx.globalCompositeOperation = \"destination-out\"\n                ctx.fillStyle = \"rgba(0, 0, 0, 0.05)\"\n                ctx.fillRect(0, 0, canvas.width, canvas.height)\n                ctx.globalCompositeOperation = \"source-over\"\n            } else {\n                // Use black for dark mode, white for light mode\n                ctx.fillStyle = isDark ? \"rgba(0, 0, 0, 0.05)\" : \"rgba(255, 255, 255, 0.05)\"\n                ctx.fillRect(0, 0, canvas.width, canvas.height)\n            }\n\n            ctx.font = `${fontSize}px monospace`\n\n            for (let i = 0; i \u003c drops.length; i++) {\n                const text = chars[Math.floor(Math.random() * chars.length)] || \"\"\n\n                // Color selection\n                if (variant === \"rainbow\" && !fixedColor) {\n                    const hue = (Date.now() / 20 + i * 10) % 360\n                    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`\n                } else if (fixedColor) {\n                    ctx.fillStyle = fixedColor\n                } else {\n                    // Adaptive colors based on background\n                    if (variant === \"cyan\") {\n                        ctx.fillStyle = isDark ? \"#0FF\" : \"#0e7490\" // Cyan-700\n                    } else {\n                        // Default to green\n                        ctx.fillStyle = isDark ? \"#0F0\" : \"#15803d\" // Green-700\n                    }\n                }\n\n                const x = i * fontSize\n                const y = drops[i] * fontSize\n\n                ctx.fillText(text, x, y)\n\n                if (y > canvas.height && Math.random() > 0.975) {\n                    drops[i] = 0\n                }\n\n                drops[i]++\n            }\n        }\n\n        const interval = setInterval(draw, speed)\n\n        return () => {\n            clearInterval(interval)\n            resizeObserver.disconnect()\n        }\n    }, [variant, fontSize, speed, fixedColor, width, height, transparent])\n\n    return (\n        \u003ccanvas\n            ref={canvasRef}\n            className={cn(\"size-full block rounded-[inherit]\", !transparent && \"bg-background\", className)}\n            style={{ width, height }}\n        />\n    )\n}\n","filename":"matrix-rain.tsx","install":"pnpm dlx shadcn@latest add @componentry/matrix-rain","posterData":"/assets/embedded/6938e268259f3c760325e43cf3d128ee46174ef2f7c0627d6da505a3a3bf9f55.webp"}],"blocks":[{"slug":"gradient-hero-01","title":"Gradient Hero 01","description":"A simple centered hero with a warm cinematic gradient, compact badge, short copy, and two actions.","category":"hero-s
