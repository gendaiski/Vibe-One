on.h1>\n                                    \u003c/div>\n                                )}\n                            \u003c/div>\n                        )}\n\n                        {/* Custom Children */}\n                        {children && (\n                            \u003cmotion.div\n                                initial={{ opacity: 0, y: 20 }}\n                                animate={{ opacity: 1, y: 0 }}\n                                transition={{ duration: 0.8, delay: 0.7, ease: \"easeOut\" }}\n                            >\n                                {children}\n                            \u003c/motion.div>\n                        )}\n                    \u003c/div>\n                \u003c/div>\n            )}\n        \u003c/div>\n    );\n}\n\n// Named export for easier imports\nexport { DitherPrismHero };\n\n\n\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface WebGLErrorBoundaryProps {\n  children: React.ReactNode;\n  fallback?: React.ReactNode;\n  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;\n}\n\ninterface WebGLErrorBoundaryState {\n  hasError: boolean;\n}\n\nexport class WebGLErrorBoundary extends React.Component\u003c\n  WebGLErrorBoundaryProps,\n  WebGLErrorBoundaryState\n> {\n  public state: WebGLErrorBoundaryState = { hasError: false };\n\n  static getDerivedStateFromError(): WebGLErrorBoundaryState {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {\n    this.props.onError?.(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback ?? \u003cWebGLFallback />;\n    }\n    return this.props.children;\n  }\n}\n\ninterface WebGLFallbackProps {\n  className?: string;\n  message?: string;\n}\n\nexport function WebGLFallback({\n  className,\n  message = \"Interactive WebGL content is unavailable on this device/browser.\",\n}: WebGLFallbackProps) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"flex h-full w-full items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-900 px-4 text-center text-sm text-white/75\",\n        className,\n      )}\n      role=\"status\"\n      aria-live=\"polite\"\n    >\n      \u003cp>{message}\u003c/p>\n    \u003c/div>\n  );\n}\n","filename":"dither-prism-hero.tsx","install":"pnpm dlx shadcn@latest add @componentry/dither-prism-hero","posterData":"/assets/embedded/1a75b454ffcb742eba1db80f84e713b0b54fbb7e377e8cfc96ac31ba470a4161.webp"},{"slug":"webgl-liquid","title":"WebGL Liquid","description":"Cinematic liquid shader hero with premium gradients, configurable reveal timing, and advanced flow controls.","category":"Hero Backgrounds","poster":"/preview-videos/hero-backgrounds/webglliquid.webp","video":"/preview-videos/hero-backgrounds/webglliquid.mp4","source":"\"use client\";\n\nimport { useEffect, useMemo, useRef, useState } from \"react\";\nimport { cn } from \"@/lib/utils\";\nimport { WebGLErrorBoundary, WebGLFallback } from \"@/components/ui/webgl-error-boundary\";\n\nconst VERTEX_SHADER = `\nattribute vec2 position;\nvoid main() {\n  gl_Position = vec4(position, 0.0, 1.0);\n}\n`;\n\nconst FRAGMENT_SHADER = `\nprecision highp float;\n\nuniform vec2 u_res;\nuniform float u_time;\nuniform vec3 u_colorDeep;\nuniform vec3 u_colorMid;\nuniform vec3 u_colorHighlight;\nuniform float u_speed;\nuniform float u_flowStrength;\nuniform float u_grain;\nuniform float u_contrast;\nuniform float u_opacity;\nuniform float u_reveal;\n\nfloat hash(vec2 p) {\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat noise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  float a = hash(i);\n  float b = hash(i + vec2(1.0, 0.0));\n  float c = hash(i + vec2(0.0, 1.0));\n  float d = hash(i + vec2(1.0, 1.0));\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;\n}\n\nfloat fbm(vec2 p) {\n  float v = 0.0;\n  float a = 0.5;\n  mat2 rot = mat2(0.86, 0.51, -0.51, 0.86);\n  for (int i = 0; i \u003c 6; i++) {\n    v += a * noise(p);\n    p = rot * p * 2.0;\n    a *= 0.5;\n  }\n  return v;\n}\n\nvec3 applyContrast(vec3 c, float contrast) {\n  return clamp((c - 0.5) * contrast + 0.5, 0.0, 1.0);\n}\n\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / u_res;\n  float t = u_time * (0.14 * u_speed);\n  vec2 aspect = vec2(u_res.x / max(u_res.y, 1.0), 1.0);\n  vec2 p = (uv - 0.5) * aspect;\n\n  vec2 flowP = vec2(p.x * 1.1, p.y - t * 0.35);\n  float n1 = fbm(flowP * 2.8 + vec2(0.0, t * 0.2));\n  float n2 = fbm((flowP + n1 * 0.45) * 4.0 - vec2(0.0, t * 0.35));\n  float n3 = fbm((flowP + n2 * 0.4) * 6.5 + vec2(t * 0.15, 0.0));\n\n  float structure = n3 * 1.15 + (n2 - 0.5) * 0.5;\n  structure += (n1 - 0.5) * 0.3 * u_flowStrength;\n\n  float lowBand = smoothstep(0.18, 0.6, structure);\n  float highBand = smoothstep(0.62, 1.08, structure);\n  vec3 col = mix(u_colorDeep, u_colorMid, lowBand);\n  col = mix(col, u_colorHighlight, highBand);\n\n  float glow = smoothstep(0.52, 0.95, structure) * (0.35 + 0.5 * u_flowStrength);\n  col += glow * u_colorHighlight * 0.35;\n\n  float verticalMask = smoothstep(1.05, 0.05, uv.y);\n  verticalMask = pow(verticalMask, 1.1);\n\n  float vignette = smoothstep(1.28, 0.36, length(uv - 0.5));\n  col *= mix(0.9, 1.05, vignette);\n\n  col = applyContrast(col, u_contrast);\n\n  float dither = (hash(gl_FragCoord.xy + t * 10.0) - 0.5) * u_grain;\n  col += dither;\n\n  float alpha = verticalMask * smoothstep(0.08, 0.95, structure);\n  alpha *= smoothstep(0.0, 0.28, u_reveal - uv.x);\n  alpha *= u_opacity;\n\n  gl_FragColor = vec4(clamp(col, 0.0, 1.0), clamp(alpha, 0.0, 1.0));\n}\n`;\n\nconst HEX_COLOR_REGEX = /^#?[0-9a-fA-F]{6}$/;\nconst FALLBACK_DEEP = \"#04050b\";\nconst FALLBACK_MID = \"#134d93\";\nconst FALLBACK_HIGHLIGHT = \"#8cecff\";\n\nfunction sanitizeHexColor(value: string, fallback: string) {\n  const trimmed = value.trim();\n  if (!HEX_COLOR_REGEX.test(trimmed)) {\n    return fallback;\n  }\n  return trimmed.startsWith(\"#\") ? trimmed : `#${trimmed}`;\n}\n\nfunction hexToRgb01(hex: string): [number, number, number] {\n  const normalized = sanitizeHexColor(hex, FALLBACK_DEEP).replace(\"#\", \"\");\n  const r = parseInt(normalized.slice(0, 2), 16) / 255;\n  const g = parseInt(normalized.slice(2, 4), 16) / 255;\n  const b = parseInt(normalized.slice(4, 6), 16) / 255;\n  return [r, g, b];\n}\n\nexport interface WebGLLiquidProps extends React.HTMLAttributes\u003cHTMLDivElement> {\n  title?: string;\n  subtitle?: string;\n  description?: string;\n  colorDeep?: string;\n  colorMid?: string;\n  colorHighlight?: string;\n  speed?: number;\n  flowStrength?: number;\n  grain?: number;\n  contrast?: number;\n  opacity?: number;\n  reveal?: boolean;\n  delayMs?: number;\n  revealDuration?: number;\n  children?: React.ReactNode;\n}\n\nconst LIQUID_HEADLINE_CLASS =\n  \"pb-[0.08em] text-[11cqi] md:text-[7cqi] lg:text-[5.5cqi] leading-[0.92] tracking-[-0.03em] font-semibold text-white\";\n\nexport function WebGLLiquid({\n  title = \"Fluid Motion\",\n  subtitle = \"Premium Presence\",\n  description = \"A cinematic liquid field tuned for modern hero sections with polished depth and restrained motion.\",\n  colorDeep = FALLBACK_DEEP,\n  colorMid = FALLBACK_MID,\n  colorHighlight = FALLBACK_HIGHLIGHT,\n  speed = 1,\n  flowStrength = 1,\n  grain = 0.05,\n  contrast = 1.1,\n  opacity = 0.95,\n  reveal = true,\n  delayMs = 0,\n  revealDuration = 1.2,\n  className,\n  children,\n  style,\n  ...props\n}: WebGLLiquidProps) {\n  const canvasRef = useRef\u003cHTMLCanvasElement | null>(null);\n  const hostRef = useRef\u003cHTMLDivElement | null>(null);\n  const [hasWebGLError, setHasWebGLError] = useState(false);\n\n  const settings = useMemo(\n    () => ({\n      colorDeep,\n      colorMid,\n      colorHighlight,\n      speed,\n      flowStrength,\n      grain,\n      contrast,\n      opacity,\n      reveal,\n      delayMs,\n      revealDuration,\n    }),\n    [\n      colorDeep,\n      colorMid,\n      colorHighlight,\n      speed,\n      flowStrength,\n      grain,\n      contrast,\n      opacity,\n      reveal,\n      delayMs,\n      revealDuration,\n    ],\n  );\n\n  useEffect(() => {\n    if (hasWebGLError) {\n      return;\n    }\n\n    const canvas = canvasRef.current;\n    const host = hostRef.current;\n    if (!canvas || !host) {\n      return;\n    }\n\n    try {\n      const gl = canvas.getContext(\"webgl\", { antialias: true, alpha: true });\n      if (!gl) {\n        setHasWebGLError(true);\n        return;\n      }\n\n      const compileShader = (type: number, source: string) => {\n        const shader = gl.createShader(type);\n        if (!shader) {\n          return null;\n        }\n        gl.shaderSource(shader, source);\n        gl.compileShader(shader);\n        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {\n          gl.deleteShader(shader);\n          return null;\n        }\n        return shader;\n      };\n\n      const vertexShader = compileShader(gl.VERTEX_SHADER, VERTEX_SHADER);\n      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);\n      if (!vertexShader || !fragmentShader) {\n        setHasWebGLError(true);\n        return;\n      }\n\n      const program = gl.createProgram();\n      if (!program) {\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      gl.attachShader(program, vertexShader);\n      gl.attachShader(program, fragmentShader);\n      gl.linkProgram(program);\n      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      gl.useProgram(program);\n\n      const positionLocation = gl.getAttribLocation(program, \"position\");\n      const quadBuffer = gl.createBuffer();\n      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);\n      gl.bufferData(\n        gl.ARRAY_BUFFER,\n        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),\n        gl.STATIC_DRAW,\n      );\n      gl.enableVertexAttribArray(positionLocation);\n      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);\n\n      const uRes = gl.getUniformLocation(program, \"u_res\");\n      const uTime = gl.getUniformLocation(program, \"u_time\");\n      const uColorDeep = gl.getUniformLocation(program, \"u_colorDeep\");\n      const uColorMid = gl.getUniformLocation(program, \"u_colorMid\");\n      const uColorHighlight = gl.getUniformLocation(program, \"u_colorHighlight\");\n      const uSpeed = gl.getUniformLocation(program, \"u_speed\");\n      const uFlowStrength = gl.getUniformLocation(program, \"u_flowStrength\");\n      const uGrain = gl.getUniformLocation(program, \"u_grain\");\n      const uContrast = gl.getUniformLocation(program, \"u_contrast\");\n      const uOpacity = gl.getUniformLocation(program, \"u_opacity\");\n      const uReveal = gl.getUniformLocation(program, \"u_reveal\");\n\n      if (\n        !uRes ||\n        !uTime ||\n        !uColorDeep ||\n        !uColorMid ||\n        !uColorHighlight ||\n        !uSpeed ||\n        !uFlowStrength ||\n        !uGrain ||\n        !uContrast ||\n        !uOpacity ||\n        !uReveal\n      ) {\n        gl.deleteBuffer(quadBuffer);\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      const resize = () => {\n        const dpr = Math.min(window.devicePixelRatio || 1, 2);\n        const { width, height } = host.getBoundingClientRect();\n        canvas.width = Math.max(1, Math.floor(width * dpr));\n        canvas.height = Math.max(1, Math.floor(height * dpr));\n        gl.viewport(0, 0, canvas.width, canvas.height);\n        gl.uniform2f(uRes, canvas.width, canvas.height);\n      };\n\n      resize();\n      const resizeObserver = new ResizeObserver(resize);\n      resizeObserver.observe(host);\n\n      let rafId = 0;\n      const start = performance.now();\n\n      const render = (now: number) => {\n        const elapsedSec = Math.max(0, (now - start - settings.delayMs) / 1000);\n        const revealProgress = settings.reveal\n          ? Math.min(1, elapsedSec / Math.max(settings.revealDuration, 0.05))\n          : 1;\n\n        const deep = hexToRgb01(settings.colorDeep);\n        const mid = hexToRgb01(settings.colorMid);\n        const highlight = hexToRgb01(settings.colorHighlight);\n\n        gl.clearColor(0, 0, 0, 0);\n        gl.clear(gl.COLOR_BUFFER_BIT);\n\n        gl.uniform1f(uTime, elapsedSec);\n        gl.uniform3f(uColorDeep, deep[0], deep[1], deep[2]);\n        gl.uniform3f(uColorMid, mid[0], mid[1], mid[2]);\n        gl.uniform3f(uColorHighlight, highlight[0], highlight[1], highlight[2]);\n        gl.uniform1f(uSpeed, settings.speed);\n        gl.uniform1f(uFlowStrength, settings.flowStrength);\n        gl.uniform1f(uGrain, settings.grain);\n        gl.uniform1f(uContrast, settings.contrast);\n        gl.uniform1f(uOpacity, settings.opacity);\n        gl.uniform1f(uReveal, revealProgress);\n        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n\n        rafId = requestAnimationFrame(render);\n      };\n\n      rafId = requestAnimationFrame(render);\n\n      return () => {\n        cancelAnimationFrame(rafId);\n        resizeObserver.disconnect();\n        gl.deleteBuffer(quadBuffer);\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n      };\n    } catch {\n      setHasWebGLError(true);\n      return;\n    }\n  }, [hasWebGLError, settings]);\n\n  const fallbackContent = (\n    \u003cdiv\n      className={cn(\n        \"relative flex min-h-screen w-full items-center overflow-hidden bg-[#02040b] text-white\",\n        className,\n      )}\n      style={{ containerType: \"size\", ...style }}\n      {...props}\n    >\n      \u003cWebGLFallback className=\"absolute inset-0 h-full w-full\" />\n      {(title || subtitle || description || children) && (\n        \u003cdiv className=\"relative z-10 mx-auto w-full max-w-[1240px] px-6 py-20 md:px-10 md:py-28\">\n          \u003cdiv className=\"max-w-[760px]\">\n            {title && \u003ch1 className={LIQUID_HEADLINE_CLASS}>{title}\u003c/h1>}\n            {subtitle && (\n              \u003ch2 className=\"mt-2 text-[11cqi] md:text-[7cqi] lg:text-[5.5cqi] leading-[0.9] tracking-[-0.03em] font-bold text-white/95\">\n                {subtitle}\n              \u003c/h2>\n            )}\n            {description && (\n              \u003cp className=\"mt-6 max-w-[620px] text-base leading-relaxed text-white/75 md:text-xl\">\n                {description}\n              \u003c/p>\n            )}\n            {children && \u003cdiv className=\"mt-10\">{children}\u003c/div>}\n          \u003c/div>\n        \u003c/div>\n      )}\n    \u003c/div>\n  );\n\n  if (hasWebGLError) {\n    return fallbackContent;\n  }\n\n  return (\n    \u003cWebGLErrorBoundary fallback={fallbackContent}>\n      \u003cdiv\n        ref={hostRef}\n        className={cn(\n          \"relative flex min-h-screen w-full items-center overflow-hidden bg-[#02040b] text-white\",\n          className,\n        )}\n        style={{ containerType: \"size\", ...style }}\n        {...props}\n      >\n        \u003ccanvas\n          ref={canvasRef}\n          aria-hidden=\"true\"\n          className=\"pointer-events-none absolute inset-0 h-full w-full\"\n          style={{ width: \"100%\", height: \"100%\", display: \"block\" }}\n        />\n\n        \u003cdiv className=\"pointer-events-none absolute inset-0 bg-gradient-to-r from-black/35 via-black/15 to-transparent\" />\n        \u003cdiv className=\"pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_65%_40%,rgba(255,255,255,0.16),transparent_45%)]\" />\n\n        {(title || subtitle || description || children) && (\n          \u003cdiv className=\"relative z-10 mx-auto w-full max-w-[1240px] px-6 py-20 md:px-10 md:py-28\">\n            \u003cdiv className=\"max-w-[760px]\">\n              {title && \u003ch1 className={LIQUID_HEADLINE_CLASS}>{title}\u003c/h1>}\n              {subtitle && (\n                \u003ch2 className=\"mt-2 text-[11cqi] md:text-[7cqi] lg:text-[5.5cqi] leading-[0.9] tracking-[-0.03em] font-bold text-white/95\">\n                  {subtitle}\n                \u003c/h2>\n              )}\n              {description && (\n                \u003cp className=\"mt-6 max-w-[620px] text-base leading-relaxed text-white/75 md:text-xl\">\n                  {description}\n                \u003c/p>\n              )}\n              {children && \u003cdiv className=\"mt-10\">{children}\u003c/div>}\n            \u003c/div>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/WebGLErrorBoundary>\n  );\n}\n\nexport default WebGLLiquid;\n\n\n\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface WebGLErrorBoundaryProps {\n  children: React.ReactNode;\n  fallback?: React.ReactNode;\n  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;\n}\n\ninterface WebGLErrorBoundaryState {\n  hasError: boolean;\n}\n\nexport class WebGLErrorBoundary extends React.Component\u003c\n  WebGLErrorBoundaryProps,\n  WebGLErrorBoundaryState\n> {\n  public state: WebGLErrorBoundaryState = { hasError: false };\n\n  static getDerivedStateFromError(): WebGLErrorBoundaryState {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {\n    this.props.onError?.(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback ?? \u003cWebGLFallback />;\n    }\n    return this.props.children;\n  }\n}\n\ninterface WebGLFallbackProps {\n  className?: string;\n  message?: string;\n}\n\nexport function WebGLFallback({\n  className,\n  message = \"Interactive WebGL content is unavailable on this device/browser.\",\n}: WebGLFallbackProps) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"flex h-full w-full items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-900 px-4 text-center text-sm text-white/75\",\n        className,\n      )}\n      role=\"status\"\n      aria-live=\"polite\"\n    >\n      \u003cp>{message}\u003c/p>\n    \u003c/div>\n  );\n}\n","filename":"webgl-liquid.tsx","install":"pnpm dlx shadcn@latest add @componentry/webgl-liquid","posterData":"/assets/embedded/cc8a08b57a3af1f2a2f3e909a62d8a2abbe7db1ea45c7d9974b8b93550f8910b.webp"},{"slug":"spectral-ribbon","title":"Spectral Ribbon","description":"A soft spectral light ribbon on pure black — slow liquid motion and rainbow fringe.","category":"Hero Backgrounds","poster":"/preview-videos/hero-backgrounds/spectralribbon.webp","video":"/preview-videos/hero-backgrounds/spectralribbon.mp4","source":"\"use client\";\n\nimport { useEffect, useRef, type CSSProperties, type ReactNode } from \"react\";\nimport { cn } from \"@/lib/utils\";\n\nexport interface SpectralRibbonProps {\n  /** Animation speed, 0 to 2. Default 1; zero freezes the current frame. */\n  speed?: number;\n  /** Ribbon brightness, 0.25 to 2. */\n  intensity?: number;\n  /** Ribbon thickness, 0.5 to 2. */\n  thickness?: number;\n  /** Film grain amount, 0 to 1. */\n  grain?: number;\n  className?: string;\n  style?: CSSProperties;\n  children?: ReactNode;\n}\n\nconst vertex = `attribute vec2 a_position;\nvoid main() { gl_Position = vec4(a_position, 0., 1.); }`;\n\nconst fragment = `precision highp float;\nuniform vec2 u_resolution;\nuniform float u_time, u_intensity, u_thickness, u_grain;\n\nfloat hash(vec2 p) {\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat noise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  float a = hash(i);\n  float b = hash(i + vec2(1.0, 0.0));\n  float c = hash(i + vec2(0.0, 1.0));\n  float d = hash(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\nfloat fbm(vec2 p) {\n  float v = 0.0;\n  float a = 0.5;\n  mat2 m = mat2(0.8, 0.6, -0.6, 0.8);\n  for (int i = 0; i \u003c 4; i++) {\n    v += a * noise(p);\n    p = m * p * 2.02;\n    a *= 0.5;\n  }\n  return v;\n}\n\n// Soft C/S light trail — enters bottom-left, arcs up-right, falls away.\nvec2 ribbonPoint(float s, float time) {\n  float sway = sin(time * 0.42 + s * 2.1) * 0.055;\n  float lift = cos(time * 0.31 - s * 1.5) * 0.04;\n  float x = mix(-1.2, 0.95, s) + sway * (0.55 + s * 0.5);\n  float y = mix(-0.72, -0.55, s)\n    + sin(s * 2.85 + 0.35) * 0.92\n    + cos(s * 1.15) * 0.12\n    - pow(max(s - 0.55, 0.0), 2.0) * 1.15\n    + lift;\n  return vec2(x, y);\n}\n\n// Prismatic fringe: warm belly → green → cyan → blue → magenta rim.\nvec3 prism(float across, float along) {\n  float h = clamp(0.5 + across * 0.52 + along * 0.18, 0.0, 1.0);\n  vec3 warm = vec3(1.0, 0.72, 0.28);\n  vec3 lime = vec3(0.55, 1.0, 0.35);\n  vec3 cyan = vec3(0.2, 0.85, 1.0);\n  vec3 blue = vec3(0.25, 0.4, 1.0);\n  vec3 mag = vec3(0.85, 0.25, 1.0);\n  vec3 c = mix(warm, lime, smoothstep(0.0, 0.28, h));\n  c = mix(c, cyan, smoothstep(0.22, 0.48, h));\n  c = mix(c, blue, smoothstep(0.42, 0.68, h));\n  c = mix(c, mag, smoothstep(0.62, 0.95, h));\n  // Slight cool push on the outer (positive) side.\n  c = mix(c, mag, smoothstep(0.2, 0.9, across) * 0.35);\n  return c;\n}\n\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / u_resolution;\n  float aspect = u_resolution.x / max(u_resolution.y, 1.0);\n  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);\n  // Zoom out on square/portrait so the full arc stays in frame.\n  float portrait = smoothstep(1.35, 0.85, aspect);\n  p *= mix(1.0, 1.32, portrait);\n  float time = u_time;\n\n  // Soft domain warp — liquid, not mechanical.\n  float warp = fbm(p * 1.2 + vec2(time * 0.1, -time * 0.07));\n  p += (warp - 0.5) * 0.14;\n\n  float minDist = 1e5;\n  float closestT = 0.0;\n  float side = 0.0;\n  vec2 prev = ribbonPoint(0.0, time);\n\n  for (int i = 1; i \u003c= 56; i++) {\n    float s = float(i) / 56.0;\n    vec2 cur = ribbonPoint(s, time);\n    vec2 pa = p - prev;\n    vec2 ba = cur - prev;\n    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);\n    vec2 closest = prev + ba * h;\n    float d = length(p - closest);\n    if (d \u003c minDist) {\n      minDist = d;\n      closestT = mix(s - 1.0 / 56.0, s, h);\n      side = pa.x * ba.y - pa.y * ba.x;\n    }\n    prev = cur;\n  }\n\n  float thick = 0.055 * u_thickness;\n  float across = clamp((minDist * sign(side)) / (thick * 2.8), -1.2, 1.2);\n\n  // Heavy soft glow — thin bright core, wide spectral bloom.\n  float core = exp(-pow(minDist / (thick * 0.7), 2.0));\n  float body = exp(-pow(minDist / (thick * 1.8), 2.0));\n  float bloom = exp(-pow(minDist / (thick * 4.2), 2.0));\n  float haze = exp(-pow(minDist / (thick * 7.5), 2.0));\n\n  vec3 spectral = prism(across, closestT);\n  // Desaturate only the very center; keep fringe vivid.\n  spectral = mix(vec3(0.95, 0.9, 0.82), spectral, smoothstep(0.0, 0.55, abs(across)));\n\n  // Hot cream core near the start of the trail.\n  float hot = exp(-closestT * 4.5) * pow(core, 0.85);\n\n  vec3 col = spectral * (body * 0.55 + bloom * 0.85 + haze * 0.4);\n  col += spectral * core * 0.35;\n  col += vec3(1.0, 0.96, 0.88) * hot * 1.1;\n  col *= u_intensity * 1.15;\n\n  float mask = clamp(body * 0.7 + bloom + haze * 0.55 + hot, 0.0, 1.6);\n  col *= mask;\n\n  float grain = (hash(gl_FragCoord.xy + time * 40.0) - 0.5) * 0.06 * u_grain;\n  col += grain * mask;\n\n  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);\n}`;\n\nfunction bounded(value: number, min: number, max: number, fallback: number) {\n  return Number.isFinite(value)\n    ? Math.min(max, Math.max(min, value))\n    : fallback;\n}\n\n/** Soft spectral light ribbon on black. Give the container an explicit height. */\nexport function SpectralRibbon({\n  speed = 1,\n  intensity = 1,\n  thickness = 1,\n  grain = 0.45,\n  className,\n  style,\n  children,\n}: SpectralRibbonProps) {\n  const canvasRef = useRef\u003cHTMLCanvasElement>(null);\n  const updateRef = useRef\u003c(() => void) | null>(null);\n  const settings = useRef({ speed, intensity, thickness, grain });\n\n  useEffect(() => {\n    settings.current = { speed, intensity, thickness, grain };\n    updateRef.current?.();\n  }, [speed, intensity, thickness, grain]);\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    if (!canvas) return;\n\n    const gl = canvas.getContext(\"webgl\", {\n      alpha: false,\n      antialias: false,\n      depth: false,\n    });\n    if (!gl) return;\n\n    let dispose = () => {};\n\n    const initialize = () => {\n      const shaders: WebGLShader[] = [];\n      const compile = (type: number, source: string) => {\n        const shader = gl.createShader(type);\n        if (!shader) return null;\n        shaders.push(shader);\n        gl.shaderSource(shader, source);\n        gl.compileShader(shader);\n        return gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? shader : null;\n      };\n\n      const vs = compile(gl.VERTEX_SHADER, vertex);\n      const fs = compile(gl.FRAGMENT_SHADER, fragment);\n      const program = gl.createProgram();\n      const buffer = gl.createBuffer();\n      const release = () => {\n        gl.deleteBuffer(buffer);\n        gl.deleteProgram(program);\n        shaders.forEach((shader) => gl.deleteShader(shader));\n      };\n\n      if (!vs || !fs || !program || !buffer) {\n        release();\n        return;\n      }\n\n      gl.attachShader(program, vs);\n      gl.attachShader(program, fs);\n      gl.linkProgram(program);\n      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n        release();\n        return;\n      }\n\n      gl.useProgram(program);\n      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);\n      gl.bufferData(\n        gl.ARRAY_BUFFER,\n        new Float32Array([-1, -1, 3, -1, -1, 3]),\n        gl.STATIC_DRAW,\n      );\n      const attribute = gl.getAttribLocation(program, \"a_position\");\n      gl.enableVertexAttribArray(attribute);\n      gl.vertexAttribPointer(attribute, 2, gl.FLOAT, false, 0, 0);\n\n      const uniforms = {\n        resolution: gl.getUniformLocation(program, \"u_resolution\"),\n        time: gl.getUniformLocation(program, \"u_time\"),\n        intensity: gl.getUniformLocation(program, \"u_intensity\"),\n        thickness: gl.getUniformLocation(program, \"u_thickness\"),\n        grain: gl.getUniformLocation(program, \"u_grain\"),\n      };\n\n      const motion = matchMedia(\"(prefers-reduced-motion: reduce)\");\n      let visible = true;\n      let frame = 0;\n      let previous = 0;\n      let elapsed = 0;\n\n      const draw = (now: number) => {\n        frame = 0;\n        const config = settings.current;\n        const rate = bounded(config.speed, 0, 2, 1);\n        if (previous && !motion.matches) {\n          elapsed += Math.min((now - previous) / 1000, 0.05) * rate;\n        }\n        previous = now;\n\n        gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);\n        gl.uniform1f(uniforms.time, elapsed);\n        gl.uniform1f(\n          uniforms.intensity,\n          bounded(config.intensity, 0.25, 2, 1),\n        );\n        gl.uniform1f(\n          uniforms.thickness,\n          bounded(config.thickness, 0.5, 2, 1),\n        );\n        gl.uniform1f(uniforms.grain, bounded(config.grain, 0, 1, 0.45));\n        gl.drawArrays(gl.TRIANGLES, 0, 3);\n        canvas.style.opacity = \"1\";\n\n        if (rate > 0 && !motion.matches && visible && !document.hidden) {\n          frame = requestAnimationFrame(draw);\n        }\n      };\n\n      const refresh = () => {\n        cancelAnimationFrame(frame);\n        previous = 0;\n        if (visible && !document.hidden) frame = requestAnimationFrame(draw);\n      };\n\n      const resize = () => {\n        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);\n        canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));\n        canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));\n        gl.viewport(0, 0, canvas.width, canvas.height);\n        refresh();\n      };\n\n      const observer = new ResizeObserver(resize);\n      observer.observe(canvas);\n      const intersection = new IntersectionObserver(([entry]) => {\n        visible = entry?.isIntersecting ?? false;\n        refresh();\n      });\n      intersection.observe(canvas);\n      document.addEventListener(\"visibilitychange\", refresh);\n      motion.addEventListener(\"change\", refresh);\n      updateRef.current = refresh;\n      resize();\n\n      dispose = () => {\n        cancelAnimationFrame(frame);\n        observer.disconnect();\n        intersection.disconnect();\n        document.removeEventListener(\"visibilitychange\", refresh);\n        motion.removeEventListener(\"change\", refresh);\n        updateRef.current = null;\n        release();\n      };\n    };\n\n    const lost = (event: Event) => {\n      event.preventDefault();\n      dispose();\n      canvas.style.opacity = \"0\";\n    };\n    const restored = () => initialize();\n    canvas.addEventListener(\"webglcontextlost\", lost);\n    canvas.addEventListener(\"webglcontextrestored\", restored);\n    initialize();\n\n    return () => {\n      dispose();\n      canvas.removeEventListener(\"webglcontextlost\", lost);\n      canvas.removeEventListener(\"webglcontextrestored\", restored);\n    };\n  }, []);\n\n  return (\n    \u003cdiv\n      className={cn(\n        \"relative h-full min-h-0 w-full overflow-hidden bg-black\",\n        className,\n      )}\n      style={style}\n    >\n      \u003ccanvas\n        ref={canvasRef}\n        aria-hidden=\"true\"\n        className=\"pointer-events-none absolute inset-0 block size-full\"\n        style={{ opacity: 0 }}\n      />\n      {children ? (\n        \u003cdiv className=\"relative z-10 h-full min-h-0 w-full\">{children}\u003c/div>\n      ) : null}\n    \u003c/div>\n  );\n}\n","filename":"spectral-ribbon.tsx","install":"pnpm dlx shadcn@latest add @componentry/spectral-ribbon","posterData":"/assets/embedded/2cb6af6e4d5d9912026e4e7b01f3766ce5bf0308e650d61b74b0822ffa000b83.webp"},{"slug":"silk-aurora","title":"Silk Aurora","description":"Premium WebGL hero background with satin-dark aurora ribbons, pearlescent highlights, fine grain, and cursor depth.","category":"Hero Backgrounds","poster":"/preview-videos/hero-backgrounds/silkaurora.webp","video":"/preview-videos/hero-backgrounds/silkaurora.mp4","source":"\"use client\";\n\nimport * as React from \"react\";\nimport { cn } from \"@/lib/utils\";\nimport {\n  WebGLErrorBoundary,\n  WebGLFallback,\n} from \"@/components/ui/webgl-error-boundary\";\n\nconst VERTEX_SHADER = `\nattribute vec2 position;\n\nvoid main() {\n  gl_Position = vec4(position, 0.0, 1.0);\n}\n`;\n\nconst FRAGMENT_SHADER = `\nprecision highp float;\n\nuniform vec2 u_res;\nuniform vec2 u_mouse;\nuniform float u_time;\nuniform float u_speed;\nuniform float u_intensity;\nuniform float u_grain;\nuniform float u_vignette;\nuniform float u_mouseInfluence;\nuniform vec3 u_base;\nuniform vec3 u_mid;\nuniform vec3 u_sheen;\nuniform vec3 u_accent;\n\nfloat hash(vec2 p) {\n  return fract(sin(dot(p, vec2(41.93, 289.17))) * 43758.5453123);\n}\n\nfloat noise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  vec2 u = f * f * (3.0 - 2.0 * f);\n\n  float a = hash(i);\n  float b = hash(i + vec2(1.0, 0.0));\n  float c = hash(i + vec2(0.0, 1.0));\n  float d = hash(i + vec2(1.0, 1.0));\n\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\nfloat fbm(vec2 p) {\n  float value = 0.0;\n  float amp = 0.5;\n  mat2 rot = mat2(0.82, 0.57, -0.57, 0.82);\n\n  for (int i = 0; i \u003c 5; i++) {\n    value += amp * noise(p);\n    p = rot * p * 2.03;\n    amp *= 0.5;\n  }\n\n  return value;\n}\n\nfloat ribbon(vec2 p, float offset, float width, float softness) {\n  float y = p.y + sin(p.x * 1.8 + offset) * 0.18;\n  y += sin(p.x * 4.2 - offset * 0.7) * 0.045;\n  return smoothstep(width + softness, width, abs(y));\n}\n\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / u_res;\n  float aspect = u_res.x / max(u_res.y, 1.0);\n  vec2 p = (uv - 0.5) * vec2(aspect, 1.0);\n\n  vec2 mouse = (u_mouse - 0.5) * vec2(aspect, 1.0);\n  float t = u_time * 0.12 * u_speed;\n  float pointerFalloff = smoothstep(0.72, 0.0, length(p - mouse));\n  p += (mouse - p) * pointerFalloff * 0.05 * u_mouseInfluence;\n\n  vec2 silk = p;\n  silk.x += fbm(p * 1.6 + vec2(t * 0.8, -t * 0.35)) * 0.16;\n  silk.y += fbm(p * 2.2 + vec2(-t * 0.25, t * 0.7)) * 0.10;\n\n  float veilA = ribbon(silk + vec2(-0.18, 0.08), t * 2.1, 0.055, 0.22);\n  float veilB = ribbon(silk * vec2(0.86, 1.18) + vec2(0.2, -0.14), -t * 2.8 + 1.7, 0.038, 0.18);\n  float veilC = ribbon(silk * vec2(1.18, 0.9) + vec2(-0.08, 0.24), t * 1.4 - 2.1, 0.03, 0.16);\n\n  float atmosphere = fbm(p * 1.35 + vec2(t * 0.22, -t * 0.1));\n  float pearlescent = pow(max(0.0, sin((p.x - p.y) * 7.5 + atmosphere * 4.0 - t * 2.5)), 5.0);\n  float glint = pow(max(0.0, noise(gl_FragCoord.xy * 0.065 + t * 18.0) - 0.72), 5.0);\n\n  vec3 col = u_base;\n  col = mix(col, u_mid, smoothstep(-0.45, 0.75, p.y + atmosphere * 0.75));\n  col += u_accent * veilA * 0.72 * u_intensity;\n  col += u_sheen * veilB * 0.64 * u_intensity;\n  col += mix(u_sheen, u_accent, 0.35) * veilC * 0.42 * u_intensity;\n  col += u_sheen * pearlescent * 0.075 * u_intensity;\n  col += vec3(1.0, 0.93, 0.82) * glint * 0.22 * u_intensity;\n  col += u_sheen * pointerFalloff * 0.08 * u_mouseInfluence;\n\n  float vignette = smoothstep(1.25, 0.22, length(p));\n  col *= mix(1.0 - u_vignette * 0.42, 1.06, vignette);\n\n  float grain = (hash(gl_FragCoord.xy + t * 90.0) - 0.5) * 0.08 * u_grain;\n  col += grain;\n\n  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);\n}\n`;\n\nconst HEX_COLOR_REGEX = /^#?[0-9a-fA-F]{6}$/;\n\nconst DEFAULT_BASE = \"#050507\";\nconst DEFAULT_MID = \"#14151d\";\nconst DEFAULT_SHEEN = \"#f4dfb8\";\nconst DEFAULT_ACCENT = \"#6ed6c9\";\n\nfunction sanitizeHexColor(value: string, fallback: string) {\n  const trimmed = value.trim();\n  if (!HEX_COLOR_REGEX.test(trimmed)) {\n    return fallback;\n  }\n\n  return trimmed.startsWith(\"#\") ? trimmed : `#${trimmed}`;\n}\n\nfunction hexToRgb01(hex: string, fallback: string): [number, number, number] {\n  const normalized = sanitizeHexColor(hex, fallback).replace(\"#\", \"\");\n  const r = parseInt(normalized.slice(0, 2), 16) / 255;\n  const g = parseInt(normalized.slice(2, 4), 16) / 255;\n  const b = parseInt(normalized.slice(4, 6), 16) / 255;\n\n  return [r, g, b];\n}\n\nexport interface SilkAuroraProps extends React.HTMLAttributes\u003cHTMLDivElement> {\n  title?: string;\n  subtitle?: string;\n  description?: string;\n  baseColor?: string;\n  midColor?: string;\n  sheenColor?: string;\n  accentColor?: string;\n  speed?: number;\n  intensity?: number;\n  grain?: number;\n  vignette?: number;\n  mouseInfluence?: number;\n  interactive?: boolean;\n  children?: React.ReactNode;\n}\n\nconst HEADLINE_CLASS =\n  \"max-w-[820px] text-[13cqi] font-semibold leading-[0.86] tracking-normal text-white md:text-[8cqi] lg:text-[6.4cqi]\";\n\nexport function SilkAurora({\n  title,\n  subtitle,\n  description,\n  baseColor = DEFAULT_BASE,\n  midColor = DEFAULT_MID,\n  sheenColor = DEFAULT_SHEEN,\n  accentColor = DEFAULT_ACCENT,\n  speed = 1,\n  intensity = 1,\n  grain = 0.85,\n  vignette = 1,\n  mouseInfluence = 1,\n  interactive = true,\n  className,\n  children,\n  style,\n  ...props\n}: SilkAuroraProps) {\n  const containerRef = React.useRef\u003cHTMLDivElement | null>(null);\n  const canvasRef = React.useRef\u003cHTMLCanvasElement | null>(null);\n  const mouseRef = React.useRef({ x: 0.5, y: 0.5 });\n  const targetMouseRef = React.useRef({ x: 0.5, y: 0.5 });\n  const [hasWebGLError, set         if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {\n          gl.deleteShader(shader);\n          return null;\n        }\n\n        return shader;\n      };\n\n      const vertexShader = compileShader(gl.VERTEX_SHADER, VERTEX_SHADER);\n      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);\n      if (!vertexShader || !fragmentShader) {\n        setHasWebGLError(true);\n        return;\n      }\n\n      const program = gl.createProgram();\n      if (!program) {\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      gl.attachShader(program, vertexShader);\n      gl.attachShader(program, fragmentShader);\n      gl.linkProgram(program);\n      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      gl.useProgram(program);\n\n      const position = gl.getAttribLocation(program, \"position\");\n      const buffer = gl.createBuffer();\n      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);\n      gl.bufferData(\n        gl.ARRAY_BUFFER,\n        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),\n        gl.STATIC_DRAW,\n      );\n      gl.enableVertexAttribArray(position);\n      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);\n\n      const uRes = gl.getUniformLocation(program, \"u_res\");\n      const uMouse = gl.getUniformLocation(program, \"u_mouse\");\n      const uTime = gl.getUniformLocation(program, \"u_time\");\n      const uSpeed = gl.getUniformLocation(program, \"u_speed\");\n      const uIntensity = gl.getUniformLocation(program, \"u_intensity\");\n      const uGrain = gl.getUniformLocation(program, \"u_grain\");\n      const uVignette = gl.getUniformLocation(program, \"u_vignette\");\n      const uMouseInfluence = gl.getUniformLocation(\n        program,\n        \"u_mouseInfluence\",\n      );\n      const uBase = gl.getUniformLocation(program, \"u_base\");\n      const uMid = gl.getUniformLocation(program, \"u_mid\");\n      const uSheen = gl.getUniformLocation(program, \"u_sheen\");\n      const uAccent = gl.getUniformLocation(program, \"u_accent\");\n\n      if (\n        !uRes ||\n        !uMouse ||\n        !uTime ||\n        !uSpeed ||\n        !uIntensity ||\n        !uGrain ||\n        !uVignette ||\n        !uMouseInfluence ||\n        !uBase ||\n        !uMid ||\n        !uSheen ||\n        !uAccent\n      ) {\n        gl.deleteBuffer(buffer);\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n        setHasWebGLError(true);\n        return;\n      }\n\n      const resize = () => {\n        const dpr = Math.min(window.devicePixelRatio || 1, 2);\n        const { width, height } = container.getBoundingClientRect();\n        canvas.width = Math.max(1, Math.floor(width * dpr));\n        canvas.height = Math.max(1, Math.floor(height * dpr));\n        gl.viewport(0, 0, canvas.width, canvas.height);\n        gl.uniform2f(uRes, canvas.width, canvas.height);\n      };\n\n      resize();\n      const resizeObserver = new ResizeObserver(resize);\n      resizeObserver.observe(container);\n\n      const base = hexToRgb01(settings.baseColor, DEFAULT_BASE);\n      const mid = hexToRgb01(settings.midColor, DEFAULT_MID);\n      const sheen = hexToRgb01(settings.sheenColor, DEFAULT_SHEEN);\n      const accent = hexToRgb01(settings.accentColor, DEFAULT_ACCENT);\n\n      gl.uniform3f(uBase, base[0], base[1], base[2]);\n      gl.uniform3f(uMid, mid[0], mid[1], mid[2]);\n      gl.uniform3f(uSheen, sheen[0], sheen[1], sheen[2]);\n      gl.uniform3f(uAccent, accent[0], accent[1], accent[2]);\n\n      let rafId = 0;\n      const start = performance.now();\n\n      const render = (now: number) => {\n        mouseRef.current.x +=\n          (targetMouseRef.current.x - mouseRef.current.x) * 0.045;\n        mouseRef.current.y +=\n          (targetMouseRef.current.y - mouseRef.current.y) * 0.045;\n\n        const elapsed = reducedMotion ? 8 : (now - start) / 1000;\n\n        gl.uniform2f(uMouse, mouseRef.current.x, mouseRef.current.y);\n        gl.uniform1f(uTime, elapsed);\n        gl.uniform1f(uSpeed, reducedMotion ? 0 : settings.speed);\n        gl.uniform1f(uIntensity, settings.intensity);\n        gl.uniform1f(uGrain, settings.grain);\n        gl.uniform1f(uVignette, settings.vignette);\n        gl.uniform1f(\n          uMouseInfluence,\n          settings.interactive && !reducedMotion ? settings.mouseInfluence : 0,\n        );\n        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n\n        rafId = requestAnimationFrame(render);\n      };\n\n      rafId = requestAnimationFrame(render);\n\n      return () => {\n        container.removeEventListener(\"pointermove\", handlePointerMove);\n        container.removeEventListener(\"pointerleave\", handlePointerLeave);\n        cancelAnimationFrame(rafId);\n        resizeObserver.disconnect();\n        gl.deleteBuffer(buffer);\n        gl.deleteProgram(program);\n        gl.deleteShader(vertexShader);\n        gl.deleteShader(fragmentShader);\n      };\n    } catch {\n      setHasWebGLError(true);\n      return () => {\n        container.removeEventListener(\"pointermove\", handlePointerMove);\n        container.removeEventListener(\"pointerleave\", handlePointerLeave);\n      };\n    }\n  }, [hasWebGLError, settings]);\n\n  const fallbackContent = (\n    \u003cdiv\n      className={cn(\n        \"relative flex min-h-screen w-full items-center overflow-hidden bg-[#050507] text-white\",\n        className,\n      )}\n      style={{ containerType: \"size\", ...style }}\n      {...props}\n    >\n      \u003cWebGLFallback className=\"absolute inset-0 h-full w-full\" />\n      {(title || subtitle || description || children) && (\n        \u003cdiv className=\"relative z-10 mx-aut othstep(1., .45, f);\n      mixer = shape + .48 * sign(proportion - .5) * pow(abs(proportion - .5), .5);\n    } else {\n      float sh = 1. - uv.y;\n      sh -= .5;\n      sh /= (noise_scale * u_resolution.y);\n      sh += .5;\n      float shape_scaling = .2 * (1. - u_shapeScale);\n      shape = smoothstep(.45 - shape_scaling, .55 + shape_scaling, sh + .3 * (proportion - .5));\n      mixer = shape;\n    }\n\n    vec4 color_mix = blend_colors(u_color1, u_color2, u_color3, mixer, 1. - clamp(u_softness, 0., 1.), .01 + .01 * u_scale);\n\n    fragColor = vec4(color_mix.rgb, color_mix.a);\n}\n`;\n\n\n\"use client\";\n\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\n\ninterface WebGLErrorBoundaryProps {\n  children: React.ReactNode;\n  fallback?: React.ReactNode;\n  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;\n}\n\ninterface WebGLErrorBoundaryState {\n  hasError: boolean;\n}\n\nexport class WebGLErrorBoundary extends React.Component\u003c\n  WebGLErrorBoundaryProps,\n  WebGLErrorBoundaryState\n> {\n  public state: WebGLErrorBoundaryState = { hasError: false };\n\n  static getDerivedStateFromError(): WebGLErrorBoundaryState {\n    return { hasError: true };\n  }\n\n  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {\n    this.props.onError?.(error, errorInfo);\n  }\n\n  render() {\n    if (this.state.hasError) {\n      return this.props.fallback ?? \u003cWebGLFallback />;\n    }\n    return this.props.children;\n  }\n}\n\ninterface WebGLFallbackProps {\n  className?: string;\n  message?: string;\n}\n\nexport function WebGLFallback({\n  className,\n  message = \"Interactive WebGL content is unavailable on this device/browser.\",\n}: WebGLFallbackProps) {\n  return (\n    \u003cdiv\n      className={cn(\n        \"flex h-full w-full items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-900 px-4 text-center text-sm text-white/75\",\n        className,\n      )}\n      role=\"status\"\n      aria ;\n  const containerRef = useRef\u003cHTMLDivElement>(null);\n  const frameIdRef = useRef\u003cnumber | undefined>(undefined);\n  const [mounted, setMounted] = useState(false);\n  const [webglFailed, setWebglFailed] = useState(false);\n  const { resolvedTheme } = useTheme();\n\n  useEffect(() => {\n    setMounted(true);\n  }, []);\n\n  const colors = useMemo(\n    () => (mounted && resolvedTheme === \"light\" ? PRISM.light : PRISM.dark),\n    [mounted, resolvedTheme],\n  );\n\n  useEffect(() => {\n    const canvas = canvasRef.current;\n    const container = containerRef.current;\n    if (!canvas || !container || !mounted || webglFailed) return;\n\n    const gl = canvas.getContext(\"webgl2\", {\n      premultipliedAlpha: true,\n      alpha: true,\n      antialias: true,\n    });\n    if (!gl) {\n      setWebglFailed(true);\n      return;\n    }\n\n    const compileShader = (type: number, source: string) => {\n      const shader = gl.createShader(type);\n      if (!shader) return null;\n      gl.shaderSource(shader, source);\n      gl.compileShader(shader);\n      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {\n        gl.deleteShader(shader);\n        return null;\n      }\n      return shader;\n    };\n\n    const vertexShader = compileShader(gl.VERTEX_SHADER, VERTEX_SHADER);\n    const fragmentShader = compileShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);\n    if (!vertexShader || !fragmentShader) {\n      if (vertexShader) gl.deleteShader(vertexShader);\n      if (fragmentShader) gl.deleteShader(fragmentShader);\n      setWebglFailed(true);\n      return;\n    }\n\n    const program = gl.createProgram();\n    if (!program) {\n      gl.deleteShader(vertexShader);\n      gl.deleteShader(fragmentShader);\n      setWebglFailed(true);\n      return;\n    }\n\n    gl.attachShader(program, vertexShader);\n    gl.attachShader(program, fragmentShader);\n    gl.linkProgram(program);\n    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {\n      gl.deleteProgram const elapsed = (time - startedAt) / 1000;\n      const prismSpeed = (PRISM.speed / 100) * 5 * Math.max(0, speed);\n      const color1 = hexToRgba(colors[0]);\n      const color2 = hexToRgba(colors[1]);\n      const color3 = hexToRgba(colors[2]);\n\n      gl.uniform1f(uniforms.time, elapsed * prismSpeed + PRISM.offset * 0.01);\n      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);\n      gl.uniform1f(uniforms.pixelRatio, window.devicePixelRatio || 1);\n      gl.uniform1f(uniforms.scale, PRISM.scale);\n      gl.uniform1f(uniforms.rotation, (PRISM.rotation * Math.PI) / 180);\n      gl.uniform4fv(uniforms.color1, color1);\n      gl.uniform4fv(uniforms.color2, color2);\n      gl.uniform4fv(uniforms.color3, color3);\n      gl.uniform1f(uniforms.proportion, PRISM.proportion / 100);\n      gl.uniform1f(uniforms.softness, PRISM.softness / 100);\n      gl.uniform1f(uniforms.shapeScale, PRISM.shapeSize / 100);\n      gl.uniform1f(uniforms.distortion, PRISM.distortion / 50);\n      gl.uniform1f(uniforms.swirl, PRISM.swirl / 100);\n      gl.uniform1f(uniforms.swirlIterations, PRISM.swirlIterations);\n      gl.drawArrays(gl.TRIANGLES, 0, 6);\n\n      if (!reduceMotion && speed > 0) {\n        frameIdRef.current = requestAnimationFrame(draw);\n      }\n    };\n\n    frameIdRef.current = requestAnimationFrame(draw);\n\n    return () => {\n      if (frameIdRef.current !== undefined)\n        cancelAnimationFrame(frameIdRef.current);\n      resizeObserver.disconnect();\n      gl.deleteBuffer(positionBuffer);\n      gl.deleteProgram(program);\n      gl.deleteShader(vertexShader);\n      gl.deleteShader(fragmentShader);\n    };\n  }, [colors, mounted, speed, webglFailed]);\n\n  return (\n    \u003cdiv\n      ref={containerRef}\n      aria-hidden=\"true\"\n      className={cn(\"absolute inset-0 z-0 overflow-hidden\", className)}\n      style={{ borderRadius: radius, ...style }}\n    >\n      {webglFailed ? (\n        \u003cdiv className=\"absolute inset-0 bg-[radial-gradient(circle_at_55%_45%,#66b3ff_0%,#050505_48%,#fff_100%)] dark:bg-[radial-gradient(circle_at_55%_45%,#66b3ff_0%,#050505_55%,#fff_100%)]\" />\n      ) : (\n        \u003ccanvas ref={canvasRef} className=\"block size-full\" />\n      )}\n      {noise && noise.opacity > 0 && (\n        \u003cdiv\n          className=\"pointer-events-none absolute inset-0 bg-repeat\"\n          style={{\n            backgroundImage: `url(\"${NOISE_TEXTURE}\")`,\n            backgroundSize: (noise.scale ?? 1) * 200,\n            opacity: noise.opacity / 2,\n          }}\n        />\n      )}\n    \u003c/div>\n  );\n}\n\nfunction hexToRgba(hex: string): [number, number, number, number] {\n  const value = hex.replace(\"#\", \"\");\n  const expanded =\n    value.length === 3\n      ? value\n          .split(\"\")\n          .map((character) => character + character)\n          .join(\"\")\n      : value;\n\n  return [\n    Number.parseInt(expanded.slice(0, 2), 16) / 255,\n    Number.parseInt(expanded.slice(2, 4), 16) / 255,\n    Number.parseInt(expanded.slice(4, 6), 16) / 255,\n    expanded.length === 8 ? Number.parseInt(expanded.slice(6, 8), 16) / 255 : 1,\n  ];\n}\n\nconst VERTEX_SHADER = `#version 300 es\nin vec4 a_position;\nvoid main() {\n  gl_Position = a_position;\n}`;\n\nconst FRAGMENT_SHADER = `#version 300 es\nprecision highp float;\n\nuniform float u_time;\nuniform float u_pixelRatio;\nuniform vec2 u_resolution;\nuniform float u_scale;\nuniform float u_rotation;\nuniform vec4 u_color1;\nuniform vec4 u_color2;\nuniform vec4 u_color3;\nuniform float u_proportion;\nuniform float u_softness;\nuniform float u_shapeScale;\nuniform float u_distortion;\nuniform float u_swirl;\nuniform float u_swirlIterations;\n\nout vec4 fragColor;\n\n#define TWO_PI 6.28318530718\n#define PI 3.14159265358979323846\n\nvec2 rotate(vec2 uv, float th) {\n  return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv;\n}\n\nfloat random(vec2 st) {\n  return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);\n}\n\nfloat noise(vec2 st) {\n  vec2 i = floor(st);\n  vec2 f = fract(st);\n  float a = random(i);\n  float b = random(i + vec2(1.0, 0.0));\n  float c = random(i + vec2(0.0, 1.0));\n  float d = random(i + vec2(1.0, 1.0));\n  vec2 u = f * f * (3.0 - 2.0 * f);\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\n}\n\nvec4 blendColors(vec4 c1, vec4 c2, vec4 c3, float mixer, float edgesWidth, float edgeBlur) {\n  vec3 color1 = c1.rgb * c1.a;\n  vec3 color2 = c2.rgb * c2.a;\n  vec3 color3 = c3.rgb * c3.a;\n  float r1 = smoothstep(.0 + .35 * edgesWidth, .7 - .35 * edgesWidth + .5 * edgeBlur, mixer);\n  float r2 = smoothstep(.3 + .35 * edgesWidth, 1. - .35 * edgesWidth + edgeBlur, mixer);\n  vec3 blendedColor2 = mix(color1, color2, r1);\n  float blendedOpacity2 = mix(c1.a, c2.a, r1);\n  vec3 color = mix(blendedColor2, color3, r2);\n  float opacity = mix(blendedOpacity2, c3.a, r2);\n  return vec4(color, opacity);\n}\n\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / u_resolution.xy;\n  float time = .5 * u_time;\n  float noiseScale = .0005 + .006 * u_scale;\n\n  uv -= .5;\n  uv *= noiseScale * u_resolution;\n  uv = rotate(uv, u_rotation * .5 * PI);\n  uv /= u_pixelRatio;\n  uv += .5;\n\n  float n1 = noise(uv + time);\n  float n2 = noise(uv * 2. - time);\n  float angle = n1 * TWO_PI;\n  uv.x += 4. * u_distortion * n2 * cos(angle);\n  uv.y += 4. * u_distortion * n2 * sin(angle);\n\n  float iterations = ceil(clamp(u_swirlIterations, 1., 30.));\n  for (float i = 1.; i \u003c= iterations; i++) {\n    uv.x += clamp(u_swirl, 0., 2.) / i * cos(time + i * 1.5 * uv.y);\n    uv.y += clamp(u_swirl, 0., 2.) / i * cos(time + i * uv.x);\n  }\n\n  float proportion = clamp(u_proportion, 0., 1.);\n  vec2 checksUv = uv * (.5 + 3.5 * u_shapeScale);\n  float shape = .5 + .5 * sin(checksUv.x) * cos(checksUv.y);\n  float mixer = shape + .48 * sign(proportion - .5) * pow(abs(proportion - .5), .5);\n  vec4 colorMix = blendColors(\n    u_color1,\n    u_color2,\n    u_color3,\n    mixer,\n    1. - c n                       hash( i + vec2(1.0,1.0) ), u.x), u.y);\n  }\n\n  float fbm( vec2 p ) {\n      float f = 0.0;\n      f += 0.5000*noise( p ); p = m*p*2.02;\n      f += 0.2500*noise( p ); p = m*p*2.03;\n      f += 0.1250*noise( p ); p = m*p*2.01;\n      f += 0.0625*noise( p );\n      return f/0.9375;\n  }\n\n  void main() {\n    vec2 uv = gl_FragCoord.xy / u_resolution.xy;\n    vec2 p = -1.0 + 2.0 * uv;\n    if (u_resolution.y > 0.0) {\n        p.x *= u_resolution.x / u_resolution.y;\n    }\n\n    // Mouse interaction\n    vec2 mouse = (u_mouse - 0.5) * 2.0;\n    if (u_resolution.y > 0.0) {\n        mouse.x *= u_resolution.x / u_resolution.y;\n    }\n    \n    // Distort based on distance to mouse\n    vec2 diff = p - mouse;\n    float dist = length(diff);\n    vec2 distortion = vec2(0.0);\n    if (dist > 0.0) {\n        distortion = (diff / dist) * exp(-dist * 3.0) * 0.1;\n    }\n    p += distortion;\n\n    float time = u_time * 0.5;\n\n    // Domain warping\n    vec2 q = vec2(0.0);\n    q.x = fbm(p + vec2(0.0, 0.0) + time * 0.1);\n    q.y = fbm(p + vec2(5.2, 1.3) + time * 0.15);\n\n    vec2 r = vec2(0.0);\n    r.x = fbm(p + 4.0 * q + vec2(1.7, 9.2) + time * 0.2);\n    r.y = fbm(p + 4.0 * q + vec2(8.3, 2.8) + time * 0.25);\n\n    float f = fbm(p + r * 4.0 * u_amplitude);\n\n    // Color mixing (Chrome / Liquid Metal style)\n    vec3 col = u_baseColor;\n    \n    // Add bright highlights based on the warped noise\n    float highlight = smoothstep(0.4, 0.6, f);\n    float highlight2 = smoothstep(0.6, 0.8, f);\n    float dark = smoothstep(0.1, 0.3, f);\n    \n    col = mix(col, vec3(0.0), 1.0 - dark); // add shadows\n    col = mix(col, vec3(0.8, 0.8, 0.9), highlight); // add silver midtones\n    col = mix(col, vec3(1.0, 1.0, 1.0), highlight2); // add bright white specular\n    \n    // Vignette\n    float v = 16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);\n    col *= 0.5 + 0.5 * pow(max(0.0, v), 0.2);\n\n    gl_FragColor = vec4(col, 1.0);\n  }\n`;;\n\nexport f export type AsciiPresetProps = Omit\u003cAsciiEffectProps, \"variant\">\n\nconst IMAGE_COLORS = [\"#f4f4f5\", \"#a1a1aa\"]\nconst FLOW_COLORS = [\"#e2e8f0\", \"#67e8f9\", \"#818cf8\"]\nconst GLITCH_COLORS = [\"#ecfccb\", \"#a3e635\", \"#22d3ee\"]\n\nfunction clamp(value: number, min = 0, max = 1) {\n  return Math.min(max, Math.max(min, value))\n}\n\nfunction parseHex(color: string) {\n  const match = /^#([\\da-f]{2})([\\da-f]{2})([\\da-f]{2})$/i.exec(color)\n  return match\n    ? [Number.parseInt(match[1]!, 16), Number.parseInt(match[2]!, 16), Number.parseInt(match[3]!, 16)]\n    : null\n}\n\nfunction gradientColor(colors: string[], amount: number) {\n  if (colors.length \u003c 2) return colors[0] ?? \"#ffffff\"\n\n  const position = clamp(amount) * (colors.length - 1)\n  const index = Math.min(Math.floor(position), colors.length - 2)\n  const mix = position - index\n  const from = parseHex(colors[index]!)\n  const to = parseHex(colors[index + 1]!)\n  if (!from || !to) return colors[Math.round(position)] ?? colors[0]!\n\n  return `rgb(${from.map((channel, i) => Math.round(channel + (to[i]! - channel) * mix)).join(\", \")})`\n}\n\nexport function AsciiEffect({\n  imageSrc,\n  alt = \"ASCII rendering\",\n  variant = \"image\",\n  chars = \" .:-=+*#%@\",\n  fontSize = 9,\n  fontFamily = \"Arial, Helvetica, sans-serif\",\n  fontWeight = 400,\n  lineHeight = 1,\n  characterSpacing = 1,\n  brightnessBoost = 2.2,\n  contrast = 1.1,\n  threshold = 0.06,\n  posterize = 32,\n  dither = \"floyd-steinberg\",\n  ditherStrength = 0.8,\n  flowSpeed = 0.22,\n  flowDirection = 0,\n  flowStrength = 12,\n  flowFrequency = 0.018,\n  mouseRadius = 150,\n  mouseStrength = 22,\n  mouseWaveSpeed = 1.2,\n  scale = 1.15,\n  fit = \"cover\",\n  colors = IMAGE_COLORS,\n  colorMode = \"gradient\",\n  backgroundColor = \"#07090d\",\n  invert = false,\n  glitchIntensity = 0.65,\n  glitchFrequency = 1.4,\n  revealDuration = 1400,\n  className,\n  onPointerMove,\n  onPointerLeave,\n  ...props\n}: A    } else {\n        for (let index = 0; index \u003c luminanceField.length; index++) {\n          luminanceField[index] = Math.round(clamp(luminanceField[index]!) * (steps - 1)) / (steps - 1)\n        }\n      }\n\n      const reveal = variant === \"glitch\" && !reduceMotion && revealDuration > 0\n        ? clamp((now - startedAt) / revealDuration)\n        : 1\n\n      updateGlitch(now, rows)\n      if (now > glitchUntil) glitchBands.clear()\n\n      context.fillStyle = backgroundColor\n      context.fillRect(0, 0, width, height)\n      context.textBaseline = \"top\"\n\n      for (let row = 0; row \u003c rows; row++) {\n        const rowOffset = glitchBands.get(row) ?? 0\n        for (let column = 0; column \u003c columns; column++) {\n          const dx = column / Math.max(1, columns - 1) - 0.5\n          const dy = row / Math.max(1, rows - 1) - 0.5\n          if (Math.hypot(dx, dy) > reveal * 0.72) continue\n\n          let sourceColumn = column\n          let sourceRow = row\n          let mouseInfluence = 0\n          if (variant === \"flow\" && !reduceMotion) {\n            const x = column * cellWidth\n            const y = row * cellHeight\n            const phase = (x * directionX + y * directionY) * flowFrequency + now * flowSpeed * Math.PI * 0.002\n            const crossPhase = (-x * directionY + y * directionX) * flowFrequency * 0.65\n            const drift = (Math.sin(phase) + Math.sin(phase * 0.61 + crossPhase) * 0.45) * flowStrength\n            let mouseDisplacement = 0\n\n            if (pointer.current.active && mouseRadius > 0) {\n              const mouseX = x - pointer.current.x\n              const mouseY = y - pointer.current.y\n              const distance = Math.hypot(mouseX, mouseY)\n              mouseInfluence = clamp(1 - distance / mouseRadius)\n              if (distance > 0 && mouseInfluence > 0) {\n                const ripple = Math.sin(distance * 0.055 - now * mouseWaveSpeed * Math.PI * 0.002)\n                mouseDisplacement = Mode, colors, contrast, dither, ditherStrength, fit, flowDirection, flowFrequency, flowSpeed, flowStrength, fontFamily, fontSize, fontWeight, glitchFrequency, glitchIntensity, imageSrc, invert, lineHeight, mouseRadius, mouseStrength, mouseWaveSpeed, posterize, revealDuration, scale, threshold, variant])\n\n  const trackPointer = (event: PointerEvent\u003cHTMLDivElement>) => {\n    onPointerMove?.(event)\n    if (variant !== \"flow\") return\n    const rect = event.currentTarget.getBoundingClientRect()\n    const x = event.clientX - rect.left\n    const y = event.clientY - rect.top\n    if (!pointer.current.active) {\n      pointer.current.x = x\n      pointer.current.y = y\n    }\n    pointer.current.active = true\n    pointer.current.targetX = x\n    pointer.current.targetY = y\n  }\n\n  const resetPointer = (event: PointerEvent\u003cHTMLDivElement>) => {\n    onPointerLeave?.(event)\n    pointer.current.active = false\n  }\n\n  return (\n    \u003cdiv\n      ref={containerRef}\n      className={cn(\"relative size-full overflow-hidden\", className)}\n      onPointerMove={trackPointer}\n      onPointerLeave={resetPointer}\n      {...props}\n    >\n      \u003ccanvas ref={canvasRef} role=\"img\" aria-label={alt} className=\"block size-full\" />\n    \u003c/div>\n  )\n}\n\nexport function AsciiImage(props: AsciiPresetProps) {\n  return \u003cAsciiEffect {...props} variant=\"image\" colors={props.colors ?? IMAGE_COLORS} />\n}\n\nexport function AsciiFlow(props: AsciiPresetProps) {\n  return \u003cAsciiEffect {...props} variant=\"flow\" colors={props.colors ?? FLOW_COLORS} />\n}\n\nexport function AsciiGlitch(props: AsciiPresetProps) {\n  return \u003cAsciiEffect {...props} variant=\"glitch\" colors={props.colors ?? GLITCH_COLORS} />\n}\n","filename":"ascii-effect.tsx","install":"pnpm dlx shadcn@latest add @componentry/ascii-effect","posterData":"/assets/embedded/ce1aa5c1f245d6111e45c433b3236c4b8acafd1c609ff5af205cd71b1e43bb0c.webp"},{"slug":"image-trail","title":"Image Trail","description":"Leaves a trail of images behind the cursor with a premium delay fade.","category":"Visual Effects","poster":"/preview-videos/visual-effects/imagetrail.webp","video":"/preview-videos/visual-effects/imagetrail.mp4","source":"\"use client\"\n\nimport React, { useEffect, useRef } from \"react\"\nimport { Expo, gsap, Power1, Quint } from \"gsap\"\n\ninterface ImageTrailProps {\n    images: string[]\n    imageWidth?: number\n    imageHeight?: number\n    threshold?: number\n    duration?: number\n}\n\nexport function ImageTrail({\n    images = [],\n    imageWidth = 200,\n    imageHeight = 200,\n    threshold = 50,\n    duration = 1.6,\n}: ImageTrailProps) {\n    const contentRef = useRef\u003cHTMLDivElement | null>(null)\n    const imagesRef = useRef\u003cHTMLImageElement[]>([])\n    const mousePos = useRef({ x: 0, y: 0 })\n    const cacheMousePos = useRef({ x: 0, y: 0 })\n    const lastMousePos = useRef({ x: 0, y: 0 })\n    const zIndexVal = useRef(1)\n    const imgPosition = useRef(0)\n    const parentSize = useRef({ width: 0, height: 0 })\n\n    useEffect(() => {\n        if (contentRef.current) {\n            imagesRef.current = Array.from(contentRef.current.querySelectorAll(\"img\"))\n        }\n\n        const handleMouseMove = (e: MouseEvent) => {\n            const rect = contentRef.current?.getBoundingClientRect()\n            if (rect) {\n                mousePos.current = {\n                    x: e.clientX - rect.left,\n                    y: e.clientY - rect.top,\n                }\n            }\n        }\n\n        calcParentSize()\n        if (imagesRef.current.length === 0) {\n            return\n        }\n\n        window.addEventListener(\"mousemove\", handleMouseMove)\n        window.addEventListener(\"resize\", calcParentSize)\n\n        requestAnimationFrame(renderImages)\n\n        return () => {\n            window.removeEventListener(\"mousemove\", handleMouseMove)\n            window.removeEventListener(\"resize\", calcParentSize)\n        }\n        // eslint-disable-next-line react-hooks/exhaustive-deps\n    }, [])\n\n    const calcParentSize = () => {\n        const rect = contentRef.current?.getBoundingClientRect()\n        if (rect) {\n            parentSize.current = { width: rect.width, height: rect.height }\n        }\n    }\n\n    const lerp = (a: number, b: number, n: number) => (1 - n) * a + n * b\n\n    const getMouseDistance = () => {\n        const dx = mousePos.current.x - lastMousePos.current.x\n        const dy = mousePos.current.y - lastMousePos.current.y\n        return Math.hypot(dx, dy)\n    }\n\n    const renderImages = () => {\n        const distance = getMouseDistance()\n\n        cacheMousePos.current.x = lerp(\n            cacheMousePos.current.x,\n            mousePos.current.x,\n            0.1\n        )\n        cacheMousePos.current.y = lerp(\n            cacheMousePos.current.y,\n            mousePos.current.y,\n            0.1\n        )\n\n        if (distance > threshold) {\n            showNextImage()\n            zIndexVal.current += 1\n            imgPosition.current = (imgPosition.current + 1) % imagesRef.current.length\n            lastMousePos.current = { ...mousePos.current }\n        }\n\n        requestAnimationFrame(renderImages)\n    }\n\n    const showNextImage = () => {\n        const img = imagesRef.current[imgPosition.current]\n        if (!img) return\n\n        const rect = img.getBoundingClientRect()\n        gsap.killTweensOf(img)\n\n        gsap\n            .timeline()\n            .set(img, {\n                startAt: { opacity: 0 },\n                opacity: 1,\n                zIndex: zIndexVal.current,\n                x: cacheMousePos.current.x - rect.width / 2,\n                y: cacheMousePos.current.y - rect.height / 2,\n            })\n            .to(img, {\n                duration: duration,\n                ease: Expo.easeOut,\n                x: mousePos.current.x - rect.width / 2,\n                y: mousePos.current.y - rect.height / 2,\n            })\n            .to(\n                img,\n                {\n                    duration: 1,\n                    ease: Power1.easeOut,\n                    opacity: 0,\n                },\n                duration - 1 > 0 ? duration - 1 : 0.4\n            )\n            .to(\n                img,\n                {\n                    duration: 1,\n                    ease: Quint.easeInOut,\n                    y: `+=${parentSize.current.height + rect.height / 2}`,\n                },\n                duration - 1 > 0 ? duration - 1 : 0.4\n            )\n    }\n\n    return (\n        \u003cdiv\n            style={\n                {\n                    \"--image-width\": `${imageWidth}px`,\n                    \"--image-height\": `${imageHeight}px`,\n                } as React.CSSProperties\n            }\n            className=\"relative isolate z-0 flex h-full w-full items-center justify-center overflow-hidden\"\n            ref={contentRef}\n        >\n            {images.map((url, index) => (\n                \u003cimg\n                    key={index}\n                    className=\"pointer-events-none absolute top-0 left-0 h-[var(--image-height)] w-[var(--image-width)] object-cover opacity-0 will-change-transform\"\n                    src={url}\n                    alt={`trail element ${index + 1}`}\n                />\n            ))}\n        \u003c/div>\n    )\n}\n","filename":"image-trail.tsx","install":"pnpm dlx shadcn@latest add @componentry/image-trail","posterData":"/assets/embedded/5db2274d5ae6a1505161e10761dd63fbc947532570d99dd7eeb6991615c4920b.webp"},{"slug":"image-ripple-effect","title":"Image Ripple Effect","description":"WebGL-powered cursor ripples that displace layered image cards in real time.","category":"Visual Effects","poster":"/preview-videos/visual-effects/imagerippleeffect.webp","video":"/preview-videos/visual-effects/imagerippleeffect.mp4","source":"/* React Three Fiber elements use Three.js properties, not DOM attributes. */\n/* eslint react/no-unknown-property: [\"error\", { \"ignore\": [\"args\", \"vertexShader\", \"fragmentShader\", \"transparent\", \"uniforms\"] }] */\n\"use client\";\n\nimport { OrthographicCamera, useFBO, useTexture } from \"@react-three/drei\";\nimport { Canvas, useFrame, useThree } from \"@react-three/fiber\";\nimport { cn } from \"@/lib/utils\";\nimport * as React from \"react\";\nimport * as THREE from \"three\";\nimport { WebGLErrorBoundary, WebGLFallback } from \"@/components/ui/webgl-error-boundary\";\n\nconst fragmentShader = `\nuniform sampler2D uTexture;\nuniform sampler2D uDisplacement;\nuniform vec2 winResolution;\nuniform float uStrength;\n\nconst float PI = 3.141592653589793238;\n\nvoid main() {\n  vec2 vUvScreen = gl_FragCoord.xy / winResolution.xy;\n  vec4 displacement = texture2D(uDisplacement, vUvScreen);\n  float theta = displacement.r * 2.0 * PI;\n\n  vec2 dir = vec2(sin(theta), cos(theta));\n  vec2 uv = vUvScreen + dir * displacement.r * uStrength;\n  vec4 color = texture2D(uTexture, uv);\n\n  gl_FragColor = color;\n}\n`;\n\nconst vertexShader = `\nvarying vec2 vUv;\n\nvoid main() {\n  vUv = uv;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}\n`;\n\nconst BRUSH_DATA_URI = `data:image/svg+xml;utf8,${encodeURIComponent(`\n  \u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"128\" height=\"128\">\n    \u003cdefs>\n      \u003cradialGradient id=\"g\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n        \u003cstop offset=\"0%\" stop-color=\"white\" stop-opacity=\"1\"/>\n        \u003cstop offset=\"65%\" stop-color=\"white\" stop-opacity=\"0.55\"/>\n        \u003cstop offset=\"100%\" stop-color=\"white\" stop-opacity=\"0\"/>\n      \u003c/radialGradient>\n    \u003c/defs>\n    \u003crect width=\"128\" height=\"128\" fill=\"url(#g)\"/>\n  \u003c/svg>\n`)}`;\n\nfunction createDemoImage(title: string, colorA: string, colorB: string) {\n  const svg = `\n    \u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 1000\">\n      \u003cdefs>\n        \u003clinearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n          \u003cstop offset=\"0%\" stop-color=\"${colorA}\" />\n          \u003cstop offset=\"100%\" stop-color=\"${colorB}\" />\n        \u003c/linearGradient>\n      \u003c/defs>\n      \u003crect width=\"800\" height=\"1000\" fill=\"url(#g)\"/>\n      \u003ccircle cx=\"610\" cy=\"180\" r=\"130\" fill=\"white\" fill-opacity=\"0.12\"/>\n      \u003ccircle cx=\"180\" cy=\"760\" r=\"190\" fill=\"white\" fill-opacity=\"0.12\"/>\n      \u003ctext x=\"64\" y=\"900\" fill=\"white\" font-size=\"64\" font-family=\"system-ui, sans-serif\" opacity=\"0.9\">\n        ${title}\n      \u003c/text>\n    \u003c/svg>\n  `;\n  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;\n}\n\nconst DEFAULT_IMAGE_URLS = [createDemoImage(\"Aurora\", \"#0f172a\", \"#155e75\")];\n\nexport interface RippleImageItem {\n  src: string;\n  x?: number;\n  y?: number;\n  widthScale?: number;\n  heightScale?: number;\n}\n\nexport interface ImageRippleEffectProps\n  extends Omit\u003cReact.HTMLAttributes\u003cHTMLDivElement>, \"children\"> {\n  className?: string;\n  images?: RippleImageItem[];\n  brushTextureUrl?: string;\n  distortionStrength?: number;\n  waveCount?: number;\n  waveSize?: number;\n  waveRotationSpeed?: number;\n  waveFadeMultiplier?: number;\n  waveGrowth?: number;\n  waveSpawnThreshold?: number;\n  children?: React.ReactNode;\n}\n\ntype ViewportDimensions = {\n  width: number;\n  height: number;\n  pixelRatio: number;\n};\n\nfunction useContainerDimensions(\n  ref: React.RefObject\u003cHTMLElement | null>,\n): ViewportDimensions {\n  const [dimensions, setDimensions] = React.useState\u003cViewportDimensions>({\n    width: 0,\n    height: 0,\n    pixelRatio: 1,\n  });\n\n  React.useEffect(() => {\n    const element = ref.current;\n    if (!element) {\n      return;\n    }\n\n    const updateSize = () => {\n      const rect = element.getBoundingClientRect();\n      setDimensions({\n        width: Math.round(rect.width),\n        height: Math.round(rect.height),\n        pixelRatio:\n          typeof window !== \"undefined\" ? Math.min(window.devicePixelRatio, 2) : 1,\n      });\n    };\n\n    updateSize();\n    const observer = new ResizeObserver(updateSize);\n    observer.observe(element);\n    window.addEventListener(\"resize\", updateSize);\n\n    return () => {\n      observer.disconnect();\n      window.removeEventListener(\"resize\", updateSize);\n    };\n  }, [ref]);\n\n  return dimensions;\n}\n\ninterface RippleSceneProps {\n  width: number;\n  height: number;\n  pixelRatio: number;\n  pointerRef: React.MutableRefObject\u003c{ x: number; y: number }>;\n  images: RippleImageItem[];\n  brushTextureUrl: string;\n  distortionStrength: number;\n  waveCount: number;\n  waveSize: number;\n  waveRotationSpeed: number;\n  waveFadeMultiplier: number;\n  waveGrowth: number;\n  waveSpawnThreshold: number;\n}\n\nfunction RippleScene({\n  width,\n  height,\n  pixelRatio,\n  pointerRef,\n  images,\n  brushTextureUrl,\n  distortionStrength,\n  waveCount,\n  waveSize,\n  waveRotationSpeed,\n  waveFadeMultiplier,\n  waveGrowth,\n  waveSpawnThreshold,\n}: RippleSceneProps) {\n  const { viewport } = useThree();\n  const { gl, camera } = useThree();\n\n  const brushTexture = useTexture(brushTextureUrl);\n  const imageTextures = useTexture(images.map((item) => item.src));\n  const rippleScene = React.useMemo(() => new THREE.Scene(), []);\n  const imageScene = React.useMemo(() => new THREE.Scene(), []);\n\n  const waveMeshesRef = React.useRef\u003cTHREE.Mesh[]>([]);\n  const prevMouseRef = React.useRef({ x: 0, y: 0 });\n  const currentWaveRef = React.useRef(0);\n\n  const uniformsRef = React.useRef({\n    uDisplacement: { value: null as THREE.Texture | null },\n    uTexture: { value: null as THREE.Texture | null },\n    winResolution: { value: new THREE.Vector2(1, 1) },\n    uStrength: { value: distortionStrength },\n  });\n\n  const fboBase = useFBO(Math.max(width, 1), Math.max(height, 1), {\n    depthBuffer: false,\n    stencilBuffer: false,\n  });\n  const fboTexture = useFBO(Math.max(width, 1), Math.max(height, 1), {\n    depthBuffer: false,\n    stencilBuffer: false,\n  });\n\n  const imageCamera = React.useMemo(\n    () =>\n      new THREE.OrthographicCamera(\n        viewport.width / -2,\n        viewport.width / 2,\n        viewport.height / 2,\n        viewport.height / -2,\n        -1000,\n        1000,\n      ),\n    [viewport.height, viewport.width],\n  );\n\n  React.useEffect(() => {\n    imageCamera.position.z = 2;\n  }, [imageCamera]);\n\n  React.useEffect(() => {\n    uniformsRef.current.uStrength.value = distortionStrength;\n  }, [distortionStrength]);\n\n  React.useEffect(() => {\n    brushTexture.minFilter = THREE.LinearFilter;\n    brushTexture.magFilter = THREE.LinearFilter;\n    brushTexture.needsUpdate = true;\n  }, [brushTexture]);\n\n  React.useEffect(() => {\n    waveMeshesRef.current.forEach((mesh) => {\n      rippleScene.remove(mesh);\n      mesh.geometry.dispose();\n      if (Array.isArray(mesh.material)) {\n        mesh.material.forEach((material) => material.dispose());\n      } else {\n        mesh.material.dispose();\n      }\n    });\n\n    const meshes: THREE.Mesh[] = [];\n    for (let i = 0; i \u003c waveCount; i += 1) {\n      const geometry = new THREE.PlaneGeometry(waveSize, waveSize, 1, 1);\n      const material = new THREE.MeshBasicMaterial({\n        transparent: true,\n        map: brushTexture,\n        depthWrite: false,\n      });\n      const mesh = new THREE.Mesh(geometry, material);\n      mesh.visible = false;\n      mesh.rotation.z = Math.random();\n      rippleScene.add(mesh);\n      meshes.push(mesh);\n    }\n\n    waveMeshesRef.current = meshes;\n    currentWaveRef.current = 0;\n\n    return () => {\n      meshes.forEach((mesh) => {\n        rippleScene.remove(mesh);\n        mesh.geometry.dispose();\n        if (Array.isArray(mesh.material)) {\n          mesh.material.forEach((material) => material.dispose());\n        } else {\n          mesh.material.dispose();\n        }\n      });\n    };\n  }, [brushTexture, rippleScene, waveCount, waveSize]);\n\n  React.useEffect(() => {\n    while (imageScene.children.length > 0) {\n      imageScene.remove(imageScene.children[0] as THREE.Object3D);\n    }\n\n    imageScene.add(imageCamera);\n    const geometry = new THREE.PlaneGeometry(1, 1);\n    const group = new THREE.Group();\n\n    images.forEach((item, index) => {\n      const texture = imageTextures[index];\n      if (!texture) {\n        return;\n      }\n      texture.minFilter = THREE.LinearFilter;\n      texture.magFilter = THREE.LinearFilter;\n      texture.needsUpdate = true;\n\n      const mesh = new THREE.Mesh(\n        geometry,\n        new THREE.MeshBasicMaterial({ map: texture }),\n      );\n      mesh.position.x = (item.x ?? (index - (images.length - 1) / 2) * 0.25) * viewport.width;\n      mesh.position.y = (item.y ?? 0) * viewport.height;\n      mesh.position.z = 1;\n      mesh.scale.x = viewport.width * (item.widthScale ?? 0.22);\n      mesh.scale.y = viewport.width * (item.heightScale ?? 0.28);\n      group.add(mesh);\n    });\n\n    imageScene.add(group);\n\n    return () => {\n      geometry.dispose();\n      group.children.forEach((child) => {\n        const mesh = child as THREE.Mesh;\n        mesh.geometry?.dispose?.();\n        if (Array.isArray(mesh.material)) {\n          mesh.material.forEach((material) => material.dispose());\n        } else {\n          mesh.material?.dispose?.();\n        }\n      });\n      imageScene.remove(group);\n    };\n  }, [imageCamera, imageScene, imageTextures, images, viewport.height, viewport.width]);\n\n  useFrame(() => {\n    const x = pointerRef.current.x - width / 2;\n    const y = -pointerRef.current.y + height / 2;\n    const prev = prevMouseRef.current;\n    const moved =\n      Math.abs(x - prev.x) > waveSpawnThreshold ||\n      Math.abs(y - prev.y) > waveSpawnThreshold;\n\n    if (moved && waveMeshesRef.current.length > 0) {\n      const waveIndex = currentWaveRef.current % waveMeshesRef.current.length;\n      const mesh = waveMeshesRef.current[waveIndex];\n      if (mesh) {\n        mesh.position.x = x;\n        mesh.position.y = y;\n        mesh.visible = true;\n        mesh.scale.set(1.75, 1.75, 1);\n        mesh.rotation.z = Math.random() * Math.PI;\n        const material = mesh.material as THREE.MeshBasicMaterial;\n        material.opacity = 1;\n      }\n      currentWaveRef.current = (waveIndex + 1) % waveMeshesRef.current.length;\n    }\n    prevMouseRef.current = { x, y };\n\n    waveMeshesRef.current.forEach((mesh) => {\n      if (!mesh.visible) {\n        return;\n      }\n      mesh.rotation.z += waveRotationSpeed;\n      mesh.scale.x = 0.98 * mesh.scale.x + waveGrowth;\n      mesh.scale.y = 0.98 * mesh.scale.y + waveGrowth;\n      const material = mesh.material as THREE.MeshBasicMaterial;\n      material.opacity *= waveFadeMultiplier;\n      if (material.opacity \u003c= 0.01) {\n        mesh.visible = false;\n      }\n    });\n\n    uniformsRef.current.uTexture.value = fboTexture.texture;\n    uniformsRef.current.uDisplacement.value = fboBase.texture;\n    uniformsRef.current.winResolution.value\n      .set(width, height)\n      .multiplyScalar(pixelRatio);\n\n    gl.setRenderTarget(fboBase);\n    gl.clear();\n    gl.render(rippleScene, camera);\n\n    gl.setRenderTarget(fboTexture);\n    gl.clear();\n    gl.render(imageScene, imageCamera);\n\n    gl.setRenderTarget(null);\n  });\n\n  return (\n    \u003cmesh>\n      \u003cplaneGeometry args={[Math.max(width, 1), Math.max(height, 1), 1, 1]} />\n      \u003cshaderMaterial\n        vertexShader={vertexShader}\n        fragmentShader={fragmentShader}\n        transparent\n        uniforms={uniformsRef.current}\n      />\n    \u003c/mesh>\n  );\n}\n\nexport function ImageRippleEffect({\n  className,\n  images = DEFAULT_IMAGE_URLS.map((src) => ({ src })),\n  brushTextureUrl = BRUSH_DATA_URI,\n  distortionStrength = 0.075,\n  waveCount = 100,\n  waveSize = 60,\n  waveRotationSpeed = 0.025,\n  waveFadeMultiplier = 0.95,\n  waveGrowth = 0.155,\n  waveSpawnThreshold = 0.1,\n  children,\n  ...props\n}: ImageRippleEffectProps) {\n  const containerRef = React.useRef\u003cHTMLDivElement>(null);\n  const { width, height, pixelRatio } = useContainerDimensions(containerRef);\n  const pointerRef = React.useRef({ x: 0, y: 0 });\n\n  const handlePointerMove = React.useCallback(\n    (event: React.PointerEvent\u003cHTMLDivElement>) => {\n      const rect = containerRef.current?.getBoundingClientRect();\n      if (!rect) {\n        return;\n      }\n      pointerRef.current = {\n        x: event.clientX - rect.left,\n        y: event.clientY - rect.top,\n      };\n    },\n    [],\n  );\n\n  const frustumSize = height;\n  const aspect = width > 0 && height > 0 ? width / height : 1;\n\n  return (\n    \u003cdiv\n      ref={containerRef}\n      onPointerMove={handlePointerMove}\n      className={cn(\n        \"relative h-[560px] w-full overflow-hidden text-white\",\n        className,\n      )}\n      {...props}\n    >\n      {width > 0 && height > 0 && (\n        \u003cWebGLErrorBoundary fallback={\u003cWebGLFallback className=\"absolute inset-0 h-full w-full\" />}>\n          \u003cCanvas>\n            \u003cOrthographicCamera\n              makeDefault\n              args={[\n                (frustumSize * aspect) / -2,\n                (frustumSize * aspect) / 2,\n                frustumSize / 2,\n                frustumSize / -2,\n                -1000,\n                1000,\n              ]}\n              position={[0, 0, 2]}\n            />\n            \u003cRippleScene\n              width={width}\n              height={height}\n              pixelRatio={pixelRatio}\n              pointerRef={pointerRef}\n              images={images}\n              brushTextureUrl={brushTextureUrl}\n
