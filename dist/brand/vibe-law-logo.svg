<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-labelledby="law-title"><title id="law-title">Vibe Law — balancing V</title><style>.balance-beam{transform-origin:44px 22px;animation:weigh 3.8s cubic-bezier(.45,0,.25,1) infinite}.balance-pan{transform-box:fill-box;transform-origin:50% 0;animation:counter 3.8s cubic-bezier(.45,0,.25,1) infinite}@keyframes weigh{0%,100%{transform:rotate(-9deg)}22%{transform:rotate(11deg)}28%{transform:rotate(8deg)}50%{transform:rotate(0)}72%{transform:rotate(-11deg)}78%{transform:rotate(-8deg)}}@keyframes counter{0%,100%{transform:rotate(9deg)}22%{transform:rotate(-11deg)}28%{transform:rotate(-8deg)}50%{transform:rotate(0)}72%{transform:rotate(11deg)}78%{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.balance-beam,.balance-pan{animation:none;transform:none}}</style><g fill="none" stroke="#b08c50" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M44 14v66"/><circle cx="44" cy="22" r="3" fill="#f5f4f0"/><g class="balance-beam"><path d="M13 22h62"/><g class="balance-pan"><path d="m14 23-9 18h18L14 23M5 41q9 8 18 0"/></g><g class="balance-pan"><path d="m74 23-9 18h18L74 23M65 41q9 8 18 0"/></g></g></g><path d="m22 55 22 33 22-33" fill="none" stroke="#253b42" stroke-width="4" stroke-linecap="square"/><text x="105" y="67" fill="#23313a" font-family="Georgia,serif" font-size="45" letter-spacing="-2">Vibe <tspan font-style="italic">Law</tspan></text></svg>